/* Desempeño de vendedores y descuentos del mes */
function desempenoVendedores(db, mes) {
  const ventas = db.ventas.filter(v => mesDe(v.fecha) === mes && v.estado !== 'anulada');
  const por = {};
  for (const v of ventas) {
    const k = v.vendedorId || '_';
    const p = por[k] || (por[k] = { vendedorId: v.vendedorId, nombre: v.vendedorNombre, ventas: 0, total: 0, utilidad: 0, comision: 0, descuentos: 0 });
    p.ventas++; p.total = sumaL([p.total, v.total]); p.utilidad = sumaL([p.utilidad, utilidadVenta(v)]);
    p.comision = sumaL([p.comision, v.comision ? v.comision.monto : 0]); p.descuentos = sumaL([p.descuentos, v.descuento]);
  }
  const descuentos = ventas.filter(v => v.descuento > 0).map(v => ({ numero: v.numero, fecha: v.fecha, cliente: v.clienteNombre, vendedor: v.vendedorNombre, subtotal: v.subtotal, descuento: v.descuento, pct: r2(v.descuento / v.subtotal * 100) }));
  return { vendedores: Object.values(por).sort((a, b) => b.total - a.total), descuentos };
}

/* Cierre asistido: qué mes toca cerrar y qué conviene revisar antes. */
function revisionCierre(db, ahora) {
  const mes = mesesSinCerrar(db, ahora)[0];
  if (!mes) return null;
  const corte = finDeMes(mes), avisos = [];
  const tr = db.movs.filter(m => m.pendiente && movVigente(m) && m.fecha <= corte);
  if (tr.length) avisos.push(`${tr.length} transferencia(s) sin confirmar (${L(sumaL(tr, m => m.monto))})`);
  const llegar = db.ventas.filter(v => v.estado !== 'anulada' && v.entrega && v.entrega.estado === 'por_llegar' && v.fecha <= corte);
  if (llegar.length) avisos.push(`${llegar.length} encargo(s) sin llegar (pasan al mes siguiente)`);
  const fijos = (db.config.gastosFijos || []).filter(g => !db.movs.some(m => m.gastoFijoId === g.id && movVigente(m) && mesDe(m.fecha) === mes));
  if (fijos.length) avisos.push(`Gastos fijos sin registrar en ${nombreMes(mes)}: ${fijos.map(g => g.nombre).join(', ')}`);
  const dia = +ahora.slice(8, 10), auto = +(db.config.cierre && db.config.cierre.diaAuto) || 5;
  return { mes, avisos, automatico: dia >= auto || mesSiguiente(mes) < mesDe(ahora), diaAuto: auto };
}

/* ─────────────── 9. RESULTADOS Y CIERRE ─────────────── */
function resumenMes(db, mes) {
  const ventas = db.ventas.filter(v => mesDe(v.fecha) === mes && v.estado !== 'anulada');
  let ingresos = 0, costo = 0, descuentos = 0, devol = 0, devCosto = 0, interes = 0;
  for (const v of ventas) {
    ingresos += v.subtotal; costo += v.costo; descuentos += v.descuento; interes += v.interes;
    for (const d of v.devoluciones || []) { devol += d.montoBase; devCosto += d.costo; }
  }
  // devoluciones de ventas de meses ya cerrados que caen en este mes
  for (const v of db.ventas.filter(v => mesDe(v.fecha) < mes && v.estado !== 'anulada'))
    for (const d of (v.devoluciones || []).filter(d => mesDe(d.fecha) === mes)) { devol += d.montoBase; devCosto += d.costo; }
  const isvIncl = sumaL(ventas, v => v.isvIncluido || 0), isvTotal = sumaL(ventas, v => v.isv || 0);
  const ventasNetas = sumaL([ingresos, -descuentos, -devol, -isvIncl]);
  const costoVendido = r2(costo - devCosto);
  const movsMes = db.movs.filter(m => movCuenta(m) && mesDe(m.fecha) === mes);
  const gastosPorCat = {};
  let gastos = 0;
  for (const m of movsMes.filter(m => m.tipo === 'gasto' || m.tipo === 'envio')) {
    const c = m.categoria || 'Otros';
    gastosPorCat[c] = r2((gastosPorCat[c] || 0) - m.monto);
    gastos -= m.monto;
  }
  const financieros = r2(movsMes.filter(m => m.interes).reduce((s, m) => s + m.interes, 0));
  const otrosIngresos = r2(movsMes.filter(m => m.tipo === 'retenido').reduce((s, m) => s + m.monto, 0));
  const comisiones = r2(ventas.filter(v => v.comision).reduce((s, v) => s + v.comision.monto, 0) + db.comisionAjustes.filter(x => mesDe(x.fecha) === mes).reduce((s, x) => s + x.monto, 0));
  const utilBruta = r2(ventasNetas - costoVendido);
  const utilNeta = r2(utilBruta + interes + otrosIngresos - r2(gastos) - financieros - comisiones);
  const contado = ventas.filter(v => !v.plazo).length;
  return { mes, numVentas: ventas.length, contado, credito: ventas.length - contado, ingresos: r2(ingresos), descuentos: r2(descuentos), devoluciones: r2(devol),
    ventasNetas, costoVendido, utilBruta, margenPct: ventasNetas > 0 ? r2(utilBruta / ventasNetas * 100) : 0, interes: r2(interes),
    gastos: r2(gastos), gastosPorCat, financieros, otrosIngresos, comisiones, utilNeta, isv: isvTotal };
}

function sugerirDistribucion(db, utilNeta) {
  const f = db.config.fondos;
  const u = Math.max(0, r2(utilNeta));
  // Cada fondo recibe su % de la utilidad, sin pasar su techo; lo que no cabe pasa a dividendos.
  const reserva = r2(Math.min(u * (+f.reservaPct || 0) / 100, Math.max(0, (+f.reservaMeta || 0) - saldoFondo(db, 'reserva'))));
  const crecimiento = r2(Math.min(u * (+f.crecPct || 0) / 100, Math.max(0, (+f.crecTecho || 0) - saldoFondo(db, 'crecimiento'))));
  const dividendos = sumaL([u, -reserva, -crecimiento]);
  // Reparto exacto en centavos: si los % suman 100, el último socio recibe el residuo del redondeo.
  const suma100 = db.socios.reduce((t, x) => t + (+x.pct || 0), 0) === 100;
  let repartido = 0;
  const porSocio = db.socios.map((s, i) => {
    const monto = suma100 && i === db.socios.length - 1 ? sumaL([dividendos, -repartido]) : r2(dividendos * s.pct / 100);
    repartido = sumaL([repartido, monto]);
    return { socioId: s.id, nombre: s.nombre, pct: s.pct, monto };
  });
  return { utilidad: u, reserva, crecimiento, dividendos, porSocio };
}

function mesesSinCerrar(db, ahora) {
  const ultimo = db.cierres.length ? db.cierres.map(c => c.mes).sort().pop() : null;
  let m = ultimo ? mesSiguiente(ultimo) : mesDe(db._inicio || db._creado || ahora);
  const lista = [];
  while (m < mesDe(ahora)) { lista.push(m); m = mesSiguiente(m); }
  return lista;
}

accion('mes.cerrar', 'admin', 'Cierre de mes', (db, a, ctx) => {
  const mes = a.mes;
  exigir(/^\d{4}-\d{2}$/.test(mes), 'Mes no válido.');
  exigir(mes < mesDe(ctx.fecha) || a.forzarActual, 'Solo se cierran meses terminados.');
  exigir(!db.cierres.some(c => c.mes === mes), 'Ese mes ya está cerrado.');
  const pend = mesesSinCerrar(db, ctx.fecha);
  exigir(!pend.length || pend[0] === mes || a.forzarActual, `Primero cierra ${nombreMes(pend[0])}.`);
  // La caja chica se cierra dentro del mismo cierre de mes (sin paso aparte).
  if (!db.cierresCajaChica.some(c => c.mes === mes)) A['cajachica.cerrar'].fn(db, { mes, reponerDesde: a.reponerCajaChicaDesde || '' }, ctx);
  const corte = finDeMes(mes);
  const res = resumenMes(db, mes);
  const datos = datosCierre(db, mes);   // se guarda antes de archivar, para poder volver a sacar el PDF
  const dist = a.distribucion || sugerirDistribucion(db, res.utilNeta);
  if (dist.reserva > 0) db.fondos.push({ id: uid(), fecha: corte, fondo: 'reserva', monto: r2(dist.reserva), motivo: 'Aporte cierre ' + nombreMes(mes), u: ctx.user.nombre });
  if (dist.crecimiento > 0) db.fondos.push({ id: uid(), fecha: corte, fondo: 'crecimiento', monto: r2(dist.crecimiento), motivo: 'Aporte cierre ' + nombreMes(mes), u: ctx.user.nombre });
  const saldosCorte = {};
  for (const c of db.cuentas) saldosCorte[c.id] = saldoCuenta(db, c.id, corte);

  for (const c of db.compras.filter(c => c.pago === 'cuotas' && !c.anulada)) {
    if (c.anticipoPagado === undefined) c.anticipoPagado = sumaL(db.movs.filter(m => m.ref === c.id && m.tipo === 'compra' && movVigente(m)), m => -m.monto);
    const salen = db.cxp.filter(x => x.ref === c.id && x.tipo === 'cuota' && x.pagado >= x.monto && (x.pagadoFecha || x.fecha) <= corte);
    if (salen.length) c.cuotasArchivadas = sumaL([c.cuotasArchivadas || 0, sumaL(salen, x => x.pagado)]);
  }
  // 1) Movimientos del mes (y anteriores) confirmados → se reemplazan por saldos iniciales 🔒
  const quedan = db.movs.filter(m => m.fecha > corte || (m.pendiente && movVigente(m)));
  const sigMes = mesSiguiente(mes) + '-01';
  const nuevosIni = [];
  for (const c of db.cuentas) if (saldosCorte[c.id] !== 0)
    nuevosIni.push({ id: uid(), fecha: sigMes, hora: '00:00', cuentaId: c.id, monto: saldosCorte[c.id], tipo: 'saldo_inicial', detalle: 'Saldo al cierre de ' + nombreMes(mes), ref: '', usuario: ctx.user.nombre, protegido: true });
  db.movs = nuevosIni.concat(quedan);

  // 2) Ventas cerradas y fuera del plazo de devolución se archivan
  const limiteDev = sumarDias(ctx.fecha, -db.config.ventas.plazoDevolucionDias);
  const archivables = v => v.fecha <= corte && (v.estado === 'anulada' || (v.estado === 'pagada' && v.fecha < limiteDev && (!v.entrega || v.entrega.estado === 'entregada') && (!v.comision || v.comision.pagada || v.comision.monto === 0)));
  const ventasArch = db.ventas.filter(archivables);
  db.ventas = db.ventas.filter(v => !archivables(v));
  // 3) Cotizaciones y faltantes ya cerrados
  db.cotizaciones = db.cotizaciones.filter(c => !(c.fecha <= corte && (c.estado === 'ganada' || c.estado === 'perdida' || c.vence < ctx.fecha)));
  db.faltantes = db.faltantes.filter(f => !(f.fecha <= corte && f.estado !== 'abierto'));
  db.cxp = db.cxp.filter(c => !(c.pagado >= c.monto && (c.pagadoFecha || c.fecha) <= corte));
  const tandaViva = new Set(db.compras.filter(c => c.pago === 'cuotas' && !c.anulada && !avanceTanda(db, c).completa));
  db.compras = db.compras.filter(c => c.fecha > corte || tandaViva.has(c));
  db.comisionAjustes = db.comisionAjustes.filter(x => !x.pagado);
  db.log = db.log.filter(l => l.f > corte).slice(-300);

  datos.distribucion = dist;
  db.cierres.push({ mes, fecha: ctx.fecha, por: ctx.user.nombre, resumen: res, distribucion: dist, saldosCorte, datos,
    cajaChica: db.cierresCajaChica.find(c => c.mes === mes), ventasArchivadas: ventasArch.length,
    inventarioCosto: r2(db.repuestos.reduce((s, r) => s + (r.stock || 0) * (r.costo || 0), 0)) });
  return `Mes de ${nombreMes(mes)} cerrado`;
});

/* ─────────────── 10. REPORTES ─────────────── */
function cxcLista(db, ahora) {
  return db.ventas.filter(v => v.estado !== 'anulada' && v.saldo > 0).map(v => {
    const dias = v.vence ? diasEntre(v.vence, ahora) : 0;
    const tramo = dias <= 0 ? 'Al día' : dias <= 15 ? '1–15 días vencido' : dias <= 30 ? '16–30 días vencido' : 'Más de 30 días vencido';
    return { v, dias, tramo };
  }).sort((a, b) => b.dias - a.dias);
}
function dineroDormido(db, ahora) {
  return db.repuestos.filter(r => r.stock > 0).map(r => {
    const desde = r.ultimaVenta || r.creado || db._inicio || ahora;
    return { r, dias: diasEntre(desde, ahora), costoParado: r2(r.stock * r.costo), vendioAlgunaVez: !!r.ultimaVenta };
  }).sort((a, b) => b.costoParado - a.costoParado);
}
function compraSugerida(db, ahora) {
  const meses = [mesDe(ahora), mesAnterior(mesDe(ahora)), mesAnterior(mesAnterior(mesDe(ahora)))];
  const pedidos = {};
  for (const f of db.faltantes.filter(f => f.estado === 'abierto' && f.repuestoId)) pedidos[f.repuestoId] = (pedidos[f.repuestoId] || 0) + f.cant;
  return db.repuestos.map(r => {
    const vendidas = meses.reduce((s, m) => s + ((r.vendidasMes || {})[m] || 0), 0);
    const pedidosN = pedidos[r.id] || 0;
    const objetivo = Math.max(r.min || 0, Math.ceil(vendidas / 3) + pedidosN);
    return { r, vendidas, pedidos: pedidosN, sugerido: Math.max(0, objetivo - (r.stock || 0)) };
  }).filter(x => x.sugerido > 0).sort((a, b) => (b.pedidos + b.vendidas) - (a.pedidos + a.vendidas));
}
/* Avance de una tanda (compra en cuotas). Para no inflar el avance se supone que primero se vende
   lo que ya había antes de la tanda, y que lo comprado después se vende al final (PEPS). */
function avanceTanda(db, c, ahora) {
  const idx = db.compras.findIndex(x => x.id === c.id);
  const items = c.items.map(it => {
    const r = db.repuestos.find(x => x.id === it.repuestoId);
    const despues = db.compras.filter((x, i) => i > idx && !x.anulada).reduce((s, x) => s + x.items.filter(y => y.repuestoId === it.repuestoId).reduce((t, y) => t + y.cant, 0), 0);
    const quedan = r ? Math.max(0, Math.min(it.cant, (r.stock || 0) - despues)) : 0;
    const vendidas = it.cant - quedan;
    return { it, r, vendidas, quedan, recuperado: r2(vendidas * it.costoUnit) };
  });
  const unidades = c.items.reduce((s, it) => s + it.cant, 0), vendidas = items.reduce((s, x) => s + x.vendidas, 0);
  const cuotas = db.cxp.filter(x => x.ref === c.id && x.tipo === 'cuota').sort((a, b) => a.vence.localeCompare(b.vence));
  const anticipo = c.anticipoPagado !== undefined ? c.anticipoPagado : sumaL(db.movs.filter(m => m.ref === c.id && m.tipo === 'compra' && movVigente(m)), m => -m.monto);
  const pagado = sumaL([anticipo, c.cuotasArchivadas || 0, sumaL(cuotas, x => x.pagado)]);
  const pendiente = sumaL(cuotas, x => x.monto - x.pagado);
  const recuperado = sumaL(items, x => x.recuperado);
  const proxima = cuotas.find(x => x.pagado < x.monto) || null;
  const disponible = sumaL([recuperado, -pagado]);   // costo ya recuperado con ventas que todavía no se usó para pagar
  const faltaProxima = proxima ? Math.max(0, sumaL([proxima.monto - proxima.pagado, -Math.max(0, disponible)])) : 0;
  const dias = ahora ? diasEntre(c.fecha, ahora) : 0;
  return {
    c, items, unidades, vendidas, pct: unidades ? Math.round(vendidas / unidades * 100) : 0, recuperado, pagado, pendiente, disponible,
    totalPlan: sumaL([pagado, pendiente]), proxima, faltaProxima, cubierta: !!proxima && faltaProxima === 0,
    lentas: items.filter(x => x.quedan > 0 && x.vendidas / x.it.cant < 0.3 && dias >= 30),
    completa: vendidas >= unidades && pendiente <= 0
  };
}
function tandas(db, ahora) {
  return db.compras.filter(c => c.pago === 'cuotas' && !c.anulada).map(c => avanceTanda(db, c, ahora));
}
/* Por pedir: repuestos bajo su mínimo, o que pidieron clientes cuando no había stock.
   Cantidad sugerida: llegar al mínimo o a lo que se vende en un mes (lo mayor), más lo que pidieron los clientes. */
function porPedir(db, ahora) {
  const meses = [mesDe(ahora), mesAnterior(mesDe(ahora)), mesAnterior(mesAnterior(mesDe(ahora)))];
  const pedidos = {};
  for (const f of db.faltantes.filter(f => f.estado === 'abierto' && f.repuestoId)) pedidos[f.repuestoId] = (pedidos[f.repuestoId] || 0) + f.cant;
  return db.repuestos.filter(r => r.estadoCatalogo !== 'descontinuado' && ((r.min > 0 && (r.stock || 0) < r.min) || pedidos[r.id])).map(r => {
    const vendidas = meses.reduce((s, m) => s + ((r.vendidasMes || {})[m] || 0), 0);
    const objetivo = Math.max(r.min || 0, Math.ceil(vendidas / 3)) + (pedidos[r.id] || 0);
    return { r, vendidas, pedidos: pedidos[r.id] || 0, cant: Math.max(1, objetivo - (r.stock || 0)) };
  }).sort((a, b) => (b.pedidos - a.pedidos) || ((a.r.stock || 0) - (b.r.stock || 0)));
}
function faltantesTop(db) {
  const g = {};
  for (const f of db.faltantes.filter(f => f.estado === 'abierto')) {
    const k = f.repuestoId || norm(f.descripcion);
    g[k] = g[k] || { descripcion: f.descripcion, repuestoId: f.repuestoId, vehiculo: f.vehiculo, veces: 0, cant: 0, items: [] };
    g[k].veces++; g[k].cant += f.cant; g[k].items.push(f);
  }
  return Object.values(g).sort((a, b) => b.veces - a.veces);
}
function balance(db, ahora) {
  const s = saldos(db);
  const inventario = r2(db.repuestos.reduce((t, r) => t + (r.stock || 0) * (r.costo || 0), 0));
  const cxc = r2(db.ventas.filter(v => v.estado !== 'anulada').reduce((t, v) => t + v.saldo, 0));
  const activos = r2(db.activos.reduce((t, a) => t + a.valor, 0));
  const cxp = r2(db.cxp.reduce((t, c) => t + (c.monto - c.pagado), 0));
  const comPend = r2(db.usuarios.reduce((t, u) => t + comisionesPendientes(db, u.id).total, 0));
  const totalActivos = r2(s.total + s.porConfirmar + inventario + cxc + activos);
  const totalPasivos = r2(cxp + comPend);
  return { dinero: s.total, porConfirmar: s.porConfirmar, inventario, cxc, activos, totalActivos, cxp, comPend, totalPasivos, patrimonio: r2(totalActivos - totalPasivos),
    fondos: { reserva: saldoFondo(db, 'reserva'), crecimiento: saldoFondo(db, 'crecimiento') } };
}

/* Pendientes calculados para Inicio (no se guardan: siempre al día). */
function pendientes(db, user, ahora) {
  const out = [];
  const add = (nivel, texto, ir) => out.push({ nivel, texto, ir });
  const admin = esAdmin(user) || soloLectura(user);
  if (tiene(user, 'ventas') || admin) {
    const cxc = cxcLista(db, ahora);
    const conPlazo = cxc.filter(x => x.v.vence);   // los encargos se cobran al llegar: no "vencen"
    const venc = conPlazo.filter(x => x.dias > 0), pronto = conPlazo.filter(x => x.dias <= 0 && x.dias >= -3);
    if (venc.length) add('rojo', `${venc.length} cuenta(s) por cobrar vencida(s)${admin ? ': ' + L(venc.reduce((s, x) => s + x.v.saldo, 0)) : ''}`, 'cobros');
    if (pronto.length) add('naranja', `${pronto.length} cuenta(s) vencen en 3 días o menos`, 'cobros');
    const seg = db.cotizaciones.filter(c => ['pendiente', 'contactado'].includes(c.estado) && c.proximoContacto && c.proximoContacto <= ahora && (admin || c.vendedorId === user.id));
    if (seg.length) add('naranja', `${seg.length} cotización(es) para dar seguimiento hoy`, 'ventas/cotizaciones');
    const disp = db.faltantes.filter(f => f.estado === 'conseguido');
    if (disp.length) add('verde', `${disp.length} pieza(s) que pidieron ya llegaron: avisar al cliente`, 'ventas/faltantes');
  }
  if (admin) {
    const tr = db.movs.filter(m => m.pendiente && movVigente(m));
    if (tr.length) add('naranja', `${tr.length} transferencia(s) por confirmar: ${L(tr.reduce((s, m) => s + m.monto, 0))}`, 'cobros/transferencias');
    const cxp = db.cxp.filter(c => c.pagado < c.monto && c.vence <= sumarDias(ahora, 3));
    if (cxp.length) add(cxp.some(c => c.vence < ahora) ? 'rojo' : 'naranja', `${cxp.length} pago(s) a proveedor vencidos o por vencer`, 'compras/pagos');
    const admins = new Set(db.usuarios.filter(u => esAdmin(u)).map(u => u.nombre)), ajustes = [];
    for (const r of db.repuestos) for (const k of (r.kardex || [])) if (k.f === ahora && /^(Ajuste|Conteo)/.test(k.t) && !admins.has(k.u)) ajustes.push({ r, k });
    if (ajustes.length) { const quien = [...new Set(ajustes.map(x => x.k.u))].join(', ');
      add('naranja', `${ajustes.length} ajuste(s) de stock hoy por ${quien}: ${ajustes.slice(0, 3).map(x => `${x.r.codigo} (${x.k.c > 0 ? '+' : ''}${x.k.c})`).join(', ')}${ajustes.length > 3 ? '…' : ''}`, 'inventario/repuestos'); }
    const pp = porPedir(db, ahora);
    if (pp.length) add('naranja', `${pp.length} repuesto(s) por pedir (bajo el mínimo o pedidos por clientes)`, 'compras/porpedir');
    for (const t of tandas(db, ahora).filter(t => t.proxima && !t.cubierta && t.proxima.vence <= sumarDias(ahora, 7)))
      add(t.proxima.vence < ahora ? 'rojo' : 'naranja', `Tanda "${t.c.nombre || t.c.numero}": la cuota del ${t.proxima.vence.split('-').reverse().join('/')} no está cubierta con lo vendido (faltan ${L(t.faltaProxima)})`, 'compras/tandas');
    const sinCerrar = mesesSinCerrar(db, ahora);
    if (sinCerrar.length) add('rojo', `Cierre de ${nombreMes(sinCerrar[0])} listo para revisar y confirmar`, 'dinero/cierre');
    const cc = saldoCuenta(db, 'cajachica');
    if (db.config.cajaChica.monto > 0 && cc < db.config.cajaChica.monto * 0.3) add('naranja', `Caja chica baja: ${L(cc)} de ${L(db.config.cajaChica.monto)}`, 'dinero/cajachica');
  }
  if (tiene(user, 'bodega') || admin) {
    const pend = db.ventas.filter(v => v.estado !== 'anulada' && v.entrega && v.entrega.estado === 'pendiente');
    const desp = db.ventas.filter(v => v.estado !== 'anulada' && v.entrega && v.entrega.estado === 'despachada');
    const llegar = db.ventas.filter(v => v.estado !== 'anulada' && v.entrega && v.entrega.estado === 'por_llegar');
    const retirar = pend.filter(v => v.entrega.tipo === 'retira');
    if (llegar.length) add('azul', `${llegar.length} encargo(s) esperando al proveedor`, 'entregas');
    if (retirar.length) add('verde', `${retirar.length} pedido(s) listos para que el cliente los retire`, 'entregas');
    if (pend.length > retirar.length) add('naranja', `${pend.length - retirar.length} pedido(s) por despachar`, 'entregas');
    if (desp.length) add('azul', `${desp.length} pedido(s) en camino: confirmar entrega`, 'entregas');
  }
  return out;
}

/* Auditoría interna: revisa que todo cuadre. */
function auditar(db) {
  const errores = [];
  const e = t => errores.push(t);
  for (const r of db.repuestos) {
    if (!(r.stock >= 0)) e(`Stock negativo o inválido: ${r.codigo}`);
    if (r.precio < r.costo) e(`Precio menor al costo: ${r.codigo}`);
    if (Math.abs(margenDePrecio(r.costo, r.precio) - (r.margen || 0)) > 0.11) e(`Margen desactualizado: ${r.codigo}`);
  }
  const cods = {};
  for (const r of db.repuestos.concat(db.llantas)) { const k = norm(r.codigo); if (cods[k]) e(`Código repetido: ${r.codigo}`); cods[k] = 1; }
  const nums = {};
  for (const v of db.ventas) {
    if (nums[v.numero]) e(`Número de venta repetido: ${v.numero}`); nums[v.numero] = 1;
    if (v.estado === 'anulada') continue;
    // Lo devuelto en dinero sale con su propio mov; lo rebajado del saldo reduce lo que se debía cobrar.
    const devDinero = (v.devoluciones || []).reduce((s, d) => s + d.deSaldo, 0);
    const pagado = r2(db.movs.filter(m => m.ref === v.id && movVigente(m) && (m.tipo === 'venta' || m.tipo === 'abono')).reduce((s, m) => s + m.monto, 0));
    const esperado = r2(v.total - devDinero);
    if (Math.abs(r2(pagado + v.saldo) - esperado) > 0.01 && !db.cierres.length) e(`Venta ${v.numero}: pagado ${L(pagado)} + saldo ${L(v.saldo)} ≠ total ${L(esperado)}`);
    if (v.saldo < 0) e(`Venta ${v.numero} con saldo negativo`);
  }
  for (const c of db.cuentas) if (saldoCuenta(db, c.id) < -0.001) e(`Cuenta en negativo: ${c.nombre} (${L(saldoCuenta(db, c.id))})`);
  for (const m of db.movs) if (!cuenta(db, m.cuentaId)) e(`Movimiento con cuenta inexistente: ${m.detalle}`);
  const s = saldos(db);
  const suma = r2(Object.values(s.porCuenta).reduce((t, x) => t + x, 0));
  if (Math.abs(suma - s.total) > 0.001) e('El total no coincide con la suma de cuentas');
  for (const c of db.cxp) if (c.pagado > c.monto + 0.01) e(`Pago a proveedor mayor a lo debido: ${c.detalle}`);
  return errores;
}

/* Pago al proveedor: ¿el cliente ya pagó la venta ligada? (se le paga al proveedor cuando el cliente paga) */
function cxpEstado(db, c) {
  if (c.pagado >= c.monto) return { clave: 'pagado', texto: 'Pagado' };
  const v = db.ventas.find(x => x.id === c.ref);
  if (v) {
    if (v.estado === 'pagada') return { clave: 'listo', texto: 'Cliente ya pagó ✓ – listo para pagar' };
    if (v.estado === 'anulada') return { clave: 'listo', texto: 'Venta anulada – pieza quedó en inventario' };
    return { clave: 'esperando', texto: v.saldo > 0 ? `Esperando que el cliente pague (${L(v.saldo)})` : 'Esperando confirmar la transferencia del cliente' };
  }
  return { clave: c.vence < hoy() ? 'vencido' : 'cuota', texto: c.vence < hoy() ? 'Cuota vencida' : 'Cuota de compra' };
}

/* Todo lo que va en el paquete de cierre de un mes (se calcula ANTES de archivar). */
function datosCierre(db, mes) {
  const corte = finDeMes(mes), res = resumenMes(db, mes);
  const previo = db.cierres.filter(c => c.mes < mes).sort((a, b) => a.mes.localeCompare(b.mes)).pop();
  const ventas = db.ventas.filter(v => mesDe(v.fecha) === mes).sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));
  const compras = db.compras.filter(c => mesDe(c.fecha) === mes && !c.anulada);
  const cots = db.cotizaciones.filter(c => mesDe(c.fecha) === mes);
  const saldosCorte = {}; db.cuentas.forEach(c => { saldosCorte[c.id] = saldoCuenta(db, c.id, corte); });
  const porTipo = { Operativo: 0, Fijo: 0 };
  db.movs.filter(m => movCuenta(m) && mesDe(m.fecha) === mes && (m.tipo === 'gasto' || m.tipo === 'envio')).forEach(m => { const k = m.tipoGasto === 'Fijo' ? 'Fijo' : 'Operativo'; porTipo[k] = sumaL([porTipo[k], -m.monto]); });
  return {
    mes, res, previo: previo ? previo.resumen : null, saldosCorte, gastosPorTipo: porTipo,
    cajaChica: db.cierresCajaChica.find(c => c.mes === mes) || null,
    cxc: cxcLista(db, corte).map(x => ({ numero: x.v.numero, cliente: x.v.clienteNombre, saldo: x.v.saldo, vence: x.v.vence, tramo: x.v.plazo ? x.tramo : 'Encargo (contra entrega)' })),
    cxp: db.cxp.filter(c => c.pagado < c.monto).map(c => ({ proveedor: (db.proveedores.find(p => p.id === c.proveedorId) || {}).nombre || '', detalle: c.detalle, pendiente: r2(c.monto - c.pagado), vence: c.vence })),
    inventario: { costo: sumaL(db.repuestos, r => (r.stock || 0) * (r.costo || 0)), precio: sumaL(db.repuestos, r => (r.stock || 0) * (r.precio || 0)), unidades: db.repuestos.reduce((s, r) => s + (r.stock || 0), 0),
      dormido: dineroDormido(db, corte).slice(0, 10).map(x => ({ codigo: x.r.codigo, descripcion: x.r.descripcion, stock: x.r.stock, dias: x.dias, costo: x.costoParado })) },
    ventas: ventas.map(v => ({ numero: v.numero, fecha: v.fecha, cliente: v.clienteNombre, vendedor: v.vendedorNombre, estado: v.estado, total: v.total, saldo: v.saldo, costo: v.costo })),
    compras: compras.map(c => ({ numero: c.numero, fecha: c.fecha, proveedor: c.proveedorNombre, pago: c.pago, total: c.total })),
    comprasTotal: sumaL(compras, c => c.total),
    comisiones: { generadas: res.comisiones, pagadas: sumaL(db.movs.filter(m => m.tipo === 'comision' && movCuenta(m) && mesDe(m.fecha) === mes), m => -m.monto) },
    cotizaciones: { total: cots.length, valor: sumaL(cots, c => c.total), ganadas: cots.filter(c => c.estado === 'ganada').length, valorGanado: sumaL(cots.filter(c => c.estado === 'ganada'), c => c.total),
      perdidas: cots.filter(c => c.estado === 'perdida').length, abiertas: cots.filter(c => ['pendiente', 'contactado'].includes(c.estado)).length },
    sar: { ventasBrutas: res.ingresos, descuentos: res.descuentos, devoluciones: res.devoluciones, ventasNetas: res.ventasNetas, numVentas: res.numVentas,
      contado: sumaL(ventas.filter(v => v.estado !== 'anulada' && !v.plazo), v => v.total), credito: sumaL(ventas.filter(v => v.estado !== 'anulada' && v.plazo), v => v.total),
      anuladas: ventas.filter(v => v.estado === 'anulada').length, compras: sumaL(compras, c => c.total), gastos: res.gastos },
    socios: db.socios.map(s => ({ nombre: s.nombre, pct: s.pct }))
  };
}

/* ─────────────── 11. ALMACÉN (guardar con control de versión) ───────────────
   backend: { leer() → {data, version} | null, escribir(data, versionPrevia) → nuevaVersion | null(conflicto), crear(data) → version } */
function crearStore(backend, opciones) {
  const st = { db: null, version: null, user: null, online: true, ocupado: false, oyentes: [] };
  const avisar = () => st.oyentes.forEach(f => { try { f(st); } catch (e) { /* pantalla */ } });
  st.alCambiar = f => st.oyentes.push(f);

  st.cargar = async () => {
    const r = await backend.leer();
    if (!r) { st.db = null; st.version = null; avisar(); return null; }
    st.db = normalizar(r.data); st.version = r.version; avisar();
    return st.db;
  };
  st.inicializar = async (db) => {
    const v = await backend.crear(db);
    exigir(v, 'Ya existe una base de datos. Recarga la página.');
    st.db = db; st.version = v; avisar();
  };
  /* Ejecuta una acción con datos frescos. Si alguien guardó en medio, reintenta. */
  st.ejecutar = async (nombre, args) => {
    const acc = A[nombre];
    exigir(acc, 'Acción desconocida: ' + nombre);
    exigir(st.user, 'Inicia sesión.');
    exigir(!soloLectura(st.user) || acc.permiso === 'propio', 'Tu usuario es de solo lectura.');
    exigir(acc.permiso === 'propio' || tiene(st.user, acc.permiso), 'No tienes permiso para: ' + acc.desc);
    exigir(st.online, 'Sin conexión: no se puede guardar. Tus datos escritos no se pierden; intenta cuando vuelva la señal.');
    exigir(!st.ocupado, 'Espera, se está guardando lo anterior.');
    st.ocupado = true; avisar();
    try {
      for (let intento = 0; intento < 4; intento++) {
        const fresco = await backend.leer();
        exigir(fresco, 'No se encontró la base de datos.');
        const db = normalizar(fresco.data);
        const u = db.usuarios.find(x => x.id === st.user.id && x.activo);
        exigir(u, 'Tu usuario fue desactivado.');
        const d = new Date();
        const ctx = { user: u, fecha: (opciones && opciones.fecha) || fechaDe(d), hora: pad(d.getHours()) + ':' + pad(d.getMinutes()),
          metodo: args && args.metodo, referencia: args && args.referencia };
        const resultado = acc.fn(db, clone(args || {}), ctx);
        if (nombre !== 'usuario.cambiarPin') {
          db.log.push({ f: ctx.fecha, h: ctx.hora, u: u.nombre, a: acc.desc, d: typeof resultado === 'string' && resultado.length < 120 ? resultado : '' });
          if (db.log.length > 600) db.log = db.log.slice(-600);
        }
        const v = await backend.escribir(db, fresco.version, u.nombre);
        if (v) { st.db = db; st.version = v; st.user = u; return resultado; }
        await new Promise(r => setTimeout(r, 300 + Math.random() * 500));   // otro guardó primero: reintento con lo nuevo
      }
      throw new RRDError('Hay mucho movimiento al mismo tiempo. Intenta de nuevo en unos segundos.');
    } finally { st.ocupado = false; avisar(); }
  };
  /* Recuperar acceso con el código que se mostró al crear la base: pone contraseña nueva al primer admin. */
  st.recuperar = async (codigo, passHash, passSalt) => {
    for (let intento = 0; intento < 4; intento++) {
      const fresco = await backend.leer();
      exigir(fresco, 'No se encontró la base de datos.');
      const db = normalizar(fresco.data);
      const rc = db.recuperacion;
      exigir(rc && rc.hash, 'Esta base no tiene código de recuperación.');
      exigir((await hashPin(String(codigo).trim().toUpperCase(), rc.salt)) === rc.hash, 'Código de recuperación incorrecto.');
      const admin = db.usuarios.find(u => u.activo && u.permisos.includes('admin'));

/* ── Cierre automático (red de seguridad): corre al entrar un admin desde el día configurado ── */
async function revisarCierreAutomatico() {
  await respaldoDiario();   // primero la copia del día (también protege antes de un cierre automático)
  if (!esAdmin(YO()) || SOLO() || !st.online) return;
  const rev = RRD.revisionCierre(D(), hoy());
  if (!rev || !rev.automatico) return;
  try {
    await recargar();
    const res = RRD.resumenMes(D(), rev.mes), dist = RRD.sugerirDistribucion(D(), res.utilNeta);
    await backend.respaldo(rev.mes.replace('-', ''), D());
    const ok = await hacer('mes.cerrar', { mes: rev.mes, distribucion: dist }, false);
    if (ok) M.abrir('🔒 Cierre automático', `<p>El mes de <b>${nombreMes(rev.mes)}</b> se cerró automáticamente porque pasó el día ${rev.diaAuto} sin confirmarlo.</p>
      <p>La copia quedó guardada en la nube. Descarga el paquete del cierre desde <b>Dinero → Cierre de mes</b>.</p>`, `<button class="btn pri" data-a="ir" data-r="dinero/cierre">Ver cierre</button>`);
  } catch (e) { registrarError('Cierre automático', e); }
}

/* ── Arranque ── */
async function recargar() {
  try {
    const r = await st.cargar();
    st.online = true;
    if (r) ls.set(CACHE, { data: st.db, version: st.version });
    return r;
  } catch (e) {
    st.online = false;
    registrarError('Carga', e);
    const c = ls.get(CACHE);
    if (c && c.data) { st.db = RRD.normalizar(c.data); st.version = c.version; toast('Sin conexión: mostrando la última copia de este dispositivo. No se puede guardar.', 'error'); return st.db; }
    throw e;
  }
}
async function iniciar() {
  try { supa = supabase.createClient(SUPA_URL, SUPA_KEY); }
  catch (e) { $('app').innerHTML = `<div class="login"><div class="login-box"><h2>Sin conexión</h2><p>No se pudo cargar la conexión. Revisa tu internet y recarga.</p></div></div>`; return; }
  backend = backendSupabase(FILA);
  st = RRD.crearStore(backend);
  st.alCambiar(() => pintarBarra());
  let db;
  try { db = await recargar(); }
  catch (e) { $('app').innerHTML = `<div class="login"><div class="login-box"><h2>No hay conexión</h2><p>${esc(e.message)}</p><button class="btn pri" onclick="location.reload()">Reintentar</button></div></div>`; return; }
  if (!db) { pantallaConfigurar(); return; }
  const n = D().config.negocio;   // ícono para "agregar a pantalla de inicio" = el logo del negocio
  if (n.logo) { $('icono-app').href = n.logo; $('favicon').href = n.logo; }
  document.title = n.corto || n.nombre || 'RRD';
  const ses = ls.get(SESION);
  const u = ses && D().usuarios.find(x => x.id === ses.id && x.activo);
  if (u) { st.user = u; pintar(); revisarCierreAutomatico(); } else pantallaAcceso();
  window.addEventListener('online', () => { st.online = true; pintarBarra(); recargar().then(() => pintar()).catch(() => {}); });
  window.addEventListener('offline', () => { st.online = false; pintarBarra(); });
  setInterval(async () => {
    if (!st.user || st.ocupado || document.hidden) return;
    try {
      const cambio = await st.refrescar();
      st.online = true;
      if (cambio) {
        ls.set(CACHE, { data: st.db, version: st.version });
        const yo = D().usuarios.find(x => x.id === st.user.id && x.activo);
        if (!yo) { H['sesion.salir'](); return; }
        st.user = yo;
        const escribiendo = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
        if (!M.pila.length && !escribiendo) pintar();
      }
    } catch (e) { st.online = false; }
    pintarBarra();
  }, 25000);
}

/* ───────── VENTAS: 4 pasos (pedido, cliente, pago, entrega) ───────── */
const nuevoCarrito = () => ({ items: [], clienteModo: 'final', clienteId: '', clienteNombre: '', clienteTel: '', descuento: 0, cotizacionId: '', forma: 'Efectivo', cuentaId: '',
  monto1: 0, forma1: 'Efectivo', cuenta1: '', forma2: 'Transferencia', cuenta2: '', abono: 0, plazo: 0,
  entrega: 'retira', departamento: '', ciudad: '', direccion: '', referencia: '', telRecibe: '', pagaEnvio: 'cliente', notas: '', vigencia: 7, forzarMayorista: false, modo: 'venta', voucher: '' });
function carrito() { if (!U.carrito) U.carrito = Object.assign(nuevoCarrito(), ls.get(BORRADOR) || {}); return U.carrito; }
const guardarCarrito = () => ls.set(BORRADOR, U.carrito);
function lineaCalc(it) {
  const c = carrito(), cfg = D().config;
  const art = it.tipo === 'llanta' ? D().llantas.find(x => x.id === it.refId) : D().repuestos.find(x => x.id === it.refId);
  if (!art) return null;
  let pc = RRD.precioPorCantidad(art, it.tipo === 'llanta', it.cant, cfg);
  if (esAdmin(YO()) && c.forzarMayorista) { const pm = RRD.precioMayorista(art, it.tipo === 'llanta', cfg); if (pm.aplica) pc = { precio: pm.precio, mayorista: true, aviso: '' }; }
  const precio = esAdmin(YO()) && +it.precioUnit > 0 ? +it.precioUnit : (+it.precioCot > 0 ? +it.precioCot : pc.precio);
  return { art, precio, mayorista: (pc.mayorista && precio === pc.precio) || (!!it.mayCot && precio === +it.precioCot), aviso: +it.precioCot > 0 ? 'Precio de la cotización' : pc.aviso, total: r2(precio * it.cant) };
}
function totalesCarrito() {
  const c = carrito();
  const sub = RRD.sumaL(c.items, it => { const l = lineaCalc(it); return l ? l.total : 0; });
  const costo = RRD.sumaL(c.items, it => { const l = lineaCalc(it); return l ? l.art.costo * it.cant : 0; });
  return { sub, costo, neto: RRD.sumaL([sub, -(+c.descuento || 0)]), hayEncargo: c.items.some(i => i.encargo) };
}
function buscarArticulos(q, filtros) {
  const t = norm(q), f = filtros || {};
  const ok = r => (!f.veh || (r.vehiculos || []).includes(f.veh) || (r.vehiculos || []).includes('Universal')) && (!f.ver || (r.versiones || []).includes(f.ver));
  const coincide = r => !t || [r.codigo, r.descripcion, r.marca, ...(r.codigosAnteriores || []), ...(r.vehiculos || []), versionTexto(r.versiones)].some(x => norm(x).includes(t));
  const exacto = r => t && (norm(r.codigo) === t || (r.codigosAnteriores || []).some(c => norm(c) === t));
  const reps = D().repuestos.filter(r => r.estadoCatalogo !== 'descontinuado' || r.stock > 0).filter(r => coincide(r) && ok(r)).sort((a, b) => (exacto(b) - exacto(a)) || ((b.stock > 0) - (a.stock > 0)) || a.descripcion.localeCompare(b.descripcion)).map(r => ({ tipo: 'rep', a: r }));
  const lls = f.veh || f.ver ? [] : D().llantas.filter(coincide).map(r => ({ tipo: 'llanta', a: r }));
  return reps.concat(lls).slice(0, 60);
}

  if (!it.encargo && it.tipo === 'rep') { const a = D().repuestos.find(x => x.id === it.refId); if (a && n > a.stock) return toast(`Solo hay ${a.stock} en stock.`, 'error'); }
  it.cant = n; guardarCarrito(); pintar();
};
H['carrito.cantFija'] = (d, el) => {
  const it = carrito().items[d.i], n = Math.max(1, Math.floor(+el.value || 1));
  if (!it.encargo && it.tipo === 'rep') { const a = D().repuestos.find(x => x.id === it.refId); if (a && n > a.stock) { toast(`Solo hay ${a.stock} en stock.`, 'error'); pintar(); return; } }
  it.cant = n; guardarCarrito(); pintar();
};
H['carrito.precio'] = (d, el) => { carrito().items[d.i].precioUnit = +el.value || 0; guardarCarrito(); pintar(); };

function partesCarrito(c, neto) {
  // Transferencia: el admin elige el banco al confirmar. Tarjeta: entra a la cuenta del POS (Ajustes → Ventas).
  const cta = forma => forma === 'Efectivo' ? 'efectivo' : forma === 'Tarjeta' ? (c.posId || '') : '';
  const ref = forma => forma === 'Tarjeta' ? String(c.voucher || '').trim() : '';
  if (['Efectivo', 'Transferencia', 'Tarjeta'].includes(c.forma)) return [{ forma: c.forma, cuentaId: cta(c.forma), monto: neto, referencia: ref(c.forma) }];
  if (c.forma === 'Mixto') {
    const m1 = r2(+c.monto1 || 0);
    if (!(m1 > 0 && m1 < neto)) throw new RRD.RRDError('En pago mixto, el primer monto debe ser mayor a 0 y menor al total.');
    return [{ forma: c.forma1, cuentaId: cta(c.forma1), monto: m1, referencia: ref(c.forma1) }, { forma: c.forma2, cuentaId: cta(c.forma2), monto: RRD.sumaL([neto, -m1]), referencia: ref(c.forma2) }];
  }
  return +c.abono > 0 ? [{ forma: c.forma1, cuentaId: cta(c.forma1), monto: r2(c.abono), referencia: ref(c.forma1) }] : [];
}

const diasSinVenta = r => diasEntre(r.ultimaVenta || r.creado || D()._inicio || hoy(), hoy());

    ${cabLista({ totales: !costos ? null : [['Artículos', base.length], ['Unidades', base.reduce((s, r) => s + (r.stock || 0), 0)], ['Valor a precio', L(RRD.sumaL(base, r => (r.stock || 0) * r.precio))], ['Valor al costo', L(RRD.sumaL(base, r => (r.stock || 0) * r.costo))]],

    <div class="scroll"><table class="tabla tarjetas"><thead><tr><th>Código</th><th>Descripción</th><th>Versión</th><th class="num">Stock</th>${SIN_PRECIOS() ? '<th>Ubicación</th>' : '<th class="num">Precio</th>'}${costos ? '<th class="num">Costo</th><th class="num">Margen</th>' : ''}<th></th></tr></thead><tbody>
    ${lista.slice(0, 400).map(r => `<tr><td data-l="Código" class="mono"><b>${esc(r.codigo)}</b></td><td data-l="Descripción">${esc(r.descripcion)}${r.lado ? ' · ' + r.lado : ''}${r.presentacion === 'Par' ? ' <span class="chip">Par</span>' : ''}<div class="txt-tenue">${esc(r.categoria)}${(r.vehiculos || []).length ? ' · ' + esc(r.vehiculos.join(', ')) : ''}</div></td>

const leerImagen = (id, max) => new Promise(res => {
  const f = $(id) && $(id).files[0];
  if (!f) return res(null);
  const rd = new FileReader();
  rd.onload = () => { const img = new Image(); img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/png')); }; img.src = rd.result; };
  rd.readAsDataURL(f);
});

      const movs = db.movs.filter(m => mesDe(m.fecha) === mes && RRD.movVigente(m));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(movs.filter(m => m.tipo === 'gasto' || m.tipo === 'envio').map(m => ({ Fecha: m.fecha, Categoría: m.categoria, Tipo: m.tipoGasto || 'Operativo', Detalle: m.detalle, Cuenta: nombreCuenta(m.cuentaId), Método: m.metodo, Referencia: m.referencia || '', Monto: -m.monto, Usuario: m.usuario }))), 'Gastos');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(movs.map(m => ({ Fecha: m.fecha, Hora: m.hora, Cuenta: nombreCuenta(m.cuentaId), Tipo: RRD.TIPOS_MOV[m.tipo] || m.tipo, Detalle: m.detalle, Método: m.metodo || '', Referencia: m.referencia || '', Monto: m.monto, Pendiente: m.pendiente ? 'Sí' : '', Usuario: m.usuario }))), 'Movimientos');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(db.repuestos.map(r => ({ Código: r.codigo, Descripción: r.descripcion, Stock: r.stock, Costo: r.costo, Precio: r.precio, 'Costo total': r2(r.costo * r.stock) }))), 'Inventario');
      zip.file(`RRDv3-respaldo-antes-de-cerrar-${mes}.json`, JSON.stringify(db));
    }
    zip.file(`Cierre-${mes}.xlsx`, XLSX.write(wb, { type: 'array', bookType: 'xlsx' }));
    descargar(`RRD-cierre-${mes}.zip`, await zip.generateAsync({ type: 'blob' }));
  }

  /* ── Excel ── */
  H['xls.inventario'] = () => {
    const cos = COSTOS(), cfg = D().config;
    const filas = D().repuestos.map(r => { const pm = RRD.precioMayorista(r, false, cfg); const f = { Código: r.codigo, Descripción: r.descripcion, Categoría: r.categoria, Versión: versionTexto(r.versiones), Lado: r.lado, Vehículos: (r.vehiculos || []).join(', '), Stock: r.stock, Mínimo: r.min, Precio: r.precio, Mayorista: pm.aplica ? pm.precio : '' };
      if (cos) Object.assign(f, { Costo: r.costo, 'Margen %': r.margen, 'Costo total': r2(r.costo * r.stock) }); f.Ubicación = r.ubicacion; f['Última venta'] = r.ultimaVenta || ''; return f; });
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(filas), 'Inventario'); XLSX.writeFile(wb, `Inventario-${hoy()}.xlsx`);
  };
  /* Catálogo: mismas hojas y columnas que el RRD v2 (lo lee catalogo-ruta-directa.html) */
  H['xls.catalogo'] = () => {
    const hojas = RRD.catalogoHojas(D(), hoy()), anchos = { Productos: [16, 38, 46, 13, 22, 11, 32, 12, 10, 15, 7, 13, 10, 13, 40, 22], 'Catálogos': [30, 60, 10, 11, 40, 10, 20, 13], Negocio: [28, 90] };
    const wb = XLSX.utils.book_new();
    Object.entries(hojas).forEach(([nombre, filas]) => { const ws = XLSX.utils.aoa_to_sheet(filas); if (anchos[nombre]) ws['!cols'] = anchos[nombre].map(w => ({ wch: w })); XLSX.utils.book_append_sheet(wb, ws, nombre); });
    XLSX.writeFile(wb, 'Catalogo-RutaDirecta-' + hoy() + '.xlsx');
  };
  /* Exportar cualquier lista (I2) */
  H['exportar.xls'] = d => { const e = EXPORTS[d.k]; if (!e || !e.filas.length) return toast('No hay datos para exportar', 'error'); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(e.filas), 'Datos'); XLSX.writeFile(wb, `${e.titulo.replace(/\s+/g, '-')}-${hoy()}.xlsx`); };
  H['exportar.pdf'] = async d => {
    const e = EXPORTS[d.k]; if (!e || !e.filas.length) return toast('No hay datos para exportar', 'error');
    const cols = Object.keys(e.filas[0]), p = await nuevoPDF(e.titulo.toUpperCase(), fFecha(hoy()), cols.length > 7 ? 'a4' : 'a4');
    tabla(p, cols.map(c => ({ t: c, w: Math.max(10, Math.min(60, Math.max(c.length, ...e.filas.slice(0, 30).map(f => String(f[c] == null ? '' : f[c]).length)) * 1.6)), der: typeof e.filas[0][c] === 'number' })),
      e.filas.map(f => cols.map(c => typeof f[c] === 'number' && /total|monto|saldo|precio|costo/i.test(c) ? L(f[c]) : f[c])), { chica: true });
    entregarPDF(finalizar(p), `${e.titulo.replace(/\s+/g, '-')}-${hoy()}.pdf`);
  };

  return { plantillas, NOMBRES_WA, VARIABLES, zipCierre, pdfCierre };
})();

iniciar();
</script>
