<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1f3d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RRD">
<link rel="apple-touch-icon" id="icono-app" href="">
<link rel="icon" id="favicon" href="">
<title>RRD</title>
<style>/* RRD v3 — "piel vieja, cerebro nuevo": los mismos tokens, fuentes y componentes del RRD v2.
   Colores con significado fijo: rojo = vencido/error · naranja = pendiente · verde = listo · azul = información */
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{
  --navy:#0f1f3d;--navy2:#1a2f52;--navy3:#243d6a;
  --gold:#c8972a;--gold2:#e8b84b;--gold3:#f5d080;
  --red:#c0392b;--green:#1a7a4a;--orange:#d46a1a;--blue:#0c5460;
  --bg:#f4f2ee;--bg2:#ffffff;--bg3:#eae8e3;
  --text:#1a1a1a;--text2:#4a4a4a;--text3:#7a7a7a;
  --border:#bdb9b0;--border2:#dedad2;--radius:8px;--radius2:12px;
  --ok-f:#d4edda;--warn-f:#fff3cd;--bad-f:#f8d7da;--blue-f:#d1ecf1;--gold-f:#fef3cd;--grey-f:#e2e3e5;
  --sombra:0 1px 3px rgba(0,0,0,.06);
}
body.oscuro{
  --navy:#0a1428;--navy2:#22365c;--navy3:#2e4a7a;
  --bg:#0f1220;--bg2:#151825;--bg3:#1d2133;
  --text:#eef0f8;--text2:#c3c8da;--text3:#8a91aa;
  --border:#3d4566;--border2:#2c3350;
  --ok-f:#123726;--warn-f:#3a2d0c;--bad-f:#3d1518;--blue-f:#0f2e36;--gold-f:#35290c;--grey-f:#262b3d;
  --green:#34d399;--red:#f87171;--orange:#fb923c;--blue:#67c6d9;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
input,select,textarea,button{font-family:inherit;font-size:14px;color:inherit}
a{color:var(--navy3)} body.oscuro a{color:var(--gold2)}
h2{font-size:17px;margin:0 0 .5em;color:var(--navy)} h3{font-size:15px;font-weight:600;margin:0 0 .6em;color:var(--navy)}
body.oscuro h2,body.oscuro h3{color:var(--text)}
.oculto{display:none!important}
.mono,.num{font-family:'IBM Plex Mono',monospace}

/* ── Estructura ── */
#app{min-height:100vh;display:flex;flex-direction:column}
.barra{background:var(--navy);color:#fff;padding:0 20px;display:flex;align-items:center;gap:14px;height:62px;position:sticky;top:0;z-index:30;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.barra .logo-caja{background:#fff;border-radius:4px;padding:3px 6px;height:48px;display:flex;align-items:center}
.barra .logo-caja img{height:42px;max-width:90px;object-fit:contain}
.barra .marca{flex:1;min-width:0}
.barra .marca .n{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra .marca .s{font-size:10.5px;color:var(--gold3);letter-spacing:2px;text-transform:uppercase;font-weight:600}
.barra .der{display:flex;align-items:center;gap:10px}
.estado{font-size:12px;color:rgba(255,255,255,.75);display:flex;align-items:center;gap:6px;white-space:nowrap}
.estado::before{content:'';width:9px;height:9px;border-radius:50%;background:#2ecc71;box-shadow:0 0 0 3px rgba(46,204,113,.25)}
.estado.off::before{background:var(--red);box-shadow:0 0 0 3px rgba(192,57,43,.3)}
.estado.guardando::before{background:var(--gold2)}
.btn-barra{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn-barra:hover{background:rgba(255,255,255,.2)}
.usuario{font-size:13px;color:rgba(255,255,255,.75);cursor:pointer;background:none;border:0;white-space:nowrap}
.sandbox{background:#7c3aed;color:#fff;text-align:center;font-weight:600;font-size:12px;padding:4px}
.nav{background:var(--bg2);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;padding:0 20px;gap:2px;position:sticky;top:62px;z-index:20}
.nav button{padding:14px 14px 11px;cursor:pointer;font-size:14px;font-weight:500;color:var(--text3);border:0;border-bottom:3px solid transparent;background:none;white-space:nowrap;transition:all .2s}
.nav button:hover{color:var(--text)}
.nav button.activo{color:var(--navy);border-bottom-color:var(--gold);font-weight:600}
body.oscuro .nav button.activo{color:var(--gold2)}
.nav .sep{width:1px;background:var(--border);margin:10px 4px;opacity:.6;flex:none}
.contenido{flex:1;width:100%;max-width:1280px;margin:0 auto;padding:24px 20px}
.titulo-pag{font-size:18px;font-weight:600;color:var(--navy);margin:0 0 14px;display:flex;align-items:center;gap:8px}
body.oscuro .titulo-pag{color:var(--text)}
.subnav{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.subnav button{padding:10px 16px;cursor:pointer;font-size:14px;font-weight:500;color:var(--text3);border:0;border-bottom:3px solid transparent;margin-bottom:-1px;background:none;white-space:nowrap}
.subnav button.activo{color:var(--navy);border-bottom-color:var(--gold);font-weight:600}
body.oscuro .subnav button.activo{color:var(--gold2)}
.inferior{display:none}

/* ── Componentes de RRD ── */
.tarjeta,.section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:20px;margin-bottom:18px}
.tarjeta>h3:first-child{display:flex;align-items:center;gap:8px}
.cab-sec{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cab-sec h3{margin:0}
.fila{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fila>.crece{flex:1;min-width:160px}
.entre{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.rejilla{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.rejilla2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:18px}
.kpi .t{font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.kpi .v{font-size:22px;font-weight:600;color:var(--navy);font-family:'IBM Plex Mono',monospace}
body.oscuro .kpi .v{color:var(--text)}
.kpi .s{font-size:12px;color:var(--text3);margin-top:4px}
.kpi.clic{cursor:pointer} .kpi.clic:hover{border-color:var(--gold)}
.borde-rojo{border-left:3px solid var(--red)!important}.borde-verde{border-left:3px solid var(--green)!important}.borde-naranja{border-left:3px solid var(--orange)!important}.borde-oro{border-left:3px solid var(--gold)!important}
.marco-naranja{border:1.5px solid var(--orange)!important}.marco-verde{border:1.5px solid var(--green)!important}
.btn{padding:9px 16px;border-radius:var(--radius);border:1px solid transparent;cursor:pointer;font-weight:500;font-size:13px;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;background:transparent;color:var(--text2);border-color:var(--border)}
.btn:hover{background:var(--bg3)}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.pri:hover{background:var(--navy2)}
body.oscuro .btn.pri{background:var(--navy3);border-color:var(--navy3)}
.btn.oro{background:var(--gold);color:#fff;border-color:var(--gold)}.btn.oro:hover{background:var(--gold2)}
.btn.ok{background:var(--green);color:#fff;border-color:var(--green)}.btn.ok:hover{opacity:.9}
.btn.peligro{background:var(--red);color:#fff;border-color:var(--red)}.btn.peligro:hover{opacity:.85}
.btn.chico{padding:5px 10px;font-size:12px}
.btn.grande{padding:13px 18px;font-size:15px;width:100%;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
label{display:block;font-size:12.5px;font-weight:600;color:var(--text2);margin:10px 0 5px}
input,select,textarea{width:100%;border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;background:var(--bg2)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,151,42,.15)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--navy)}
.check{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--text);margin:6px 0;font-size:13.5px}
.campos{display:grid;gap:0 14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.ayuda{font-size:12px;color:var(--text3);margin-top:3px}
.chip{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap;background:var(--grey-f);color:var(--text2)}
.chip.verde{background:var(--ok-f);color:var(--green)}.chip.naranja{background:var(--warn-f);color:var(--orange)}.chip.rojo{background:var(--bad-f);color:var(--red)}
.chip.azul{background:var(--blue-f);color:var(--blue)}.chip.oro{background:var(--gold-f);color:#856404}
body.oscuro .chip.oro{color:var(--gold3)}
.txt-rojo{color:var(--red)}.txt-verde{color:var(--green)}.txt-naranja{color:var(--orange)}.txt-suave{color:var(--text2)}.txt-tenue{color:var(--text3);font-size:12.5px}
.num{text-align:right;white-space:nowrap}
.fuerte{font-weight:600}
.dinero{font-family:'IBM Plex Mono',monospace;font-weight:600}
/* tablas de RRD */
.scroll{overflow-x:auto}
.tabla{width:100%;border-collapse:collapse;font-size:13px}
.tabla th{background:var(--bg3);padding:10px 12px;text-align:left;font-weight:600;font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--border);white-space:nowrap}
.tabla th.num{text-align:right}
.tabla td{padding:10px 12px;border-bottom:1px solid var(--border2);vertical-align:top}
.tabla tr:last-child td{border-bottom:none}
.tabla tbody tr:hover td{background:var(--bg)}
.tabla tr.clic{cursor:pointer}
.tabla tr.tachado td{opacity:.5;text-decoration:line-through}
.vacio{color:var(--text3);text-align:center;padding:28px 8px}
.aviso{border-radius:var(--radius);padding:10px 14px;margin:10px 0;font-size:13.5px}
.aviso.rojo{background:var(--bad-f);color:var(--red)}.aviso.naranja{background:var(--warn-f);color:var(--orange)}
.aviso.verde{background:var(--ok-f);color:var(--green)}.aviso.azul{background:var(--blue-f);color:var(--blue)}
.pend{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--radius);margin-bottom:8px;cursor:pointer;border-left:4px solid;font-size:13.5px}
.pend.rojo{background:var(--bad-f);border-color:var(--red)}.pend.naranja{background:var(--warn-f);border-color:var(--orange)}
.pend.verde{background:var(--ok-f);border-color:var(--green)}.pend.azul{background:var(--blue-f);border-color:var(--blue)}
.barra-prog{height:8px;background:var(--bg3);border-radius:8px;overflow:hidden}
.barra-prog>div{height:100%;background:var(--green);border-radius:8px}
.barra-prog.roja>div{background:var(--red)}.barra-prog.oro>div{background:var(--gold)}.barra-prog.navy>div{background:var(--navy)}
.barra-apilada{display:flex;height:10px;border-radius:8px;overflow:hidden;background:var(--bg3)}
.barra-apilada>div{height:100%}
.total-grande{font-size:24px;font-weight:600;font-family:'IBM Plex Mono',monospace;color:var(--navy)}
body.oscuro .total-grande{color:var(--text)}
/* listas (I2): totales + chips con contador */
.totales{display:flex;gap:22px;flex-wrap:wrap;padding:12px 16px;background:var(--bg3);border-radius:var(--radius);margin-bottom:12px}
.totales .t{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.totales .v{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filtros button{border:1px solid var(--border);background:var(--bg2);border-radius:99px;padding:5px 12px;font-size:12.5px;cursor:pointer;color:var(--text2);font-weight:500}
.filtros button b{font-family:'IBM Plex Mono',monospace;margin-left:4px}
.filtros button.activo{background:var(--navy);border-color:var(--navy);color:#fff}
body.oscuro .filtros button.activo{background:var(--navy3);border-color:var(--navy3)}
/* venta */
.carrito .linea{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border2)}
.cant{display:flex;align-items:center;gap:4px}
.cant button{width:32px;height:32px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);cursor:pointer;font-weight:700}
.cant input{width:54px;text-align:center;padding:6px}
.resultados{max-height:380px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius);margin-top:8px;background:var(--bg2)}
.resultados .r{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid var(--border2)}
.resultados .r:last-child{border-bottom:0}
.alternar{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.alternar button{border:0;background:var(--bg2);padding:7px 14px;cursor:pointer;font-weight:500;font-size:13px;color:var(--text2)}
.alternar button.activo{background:var(--navy);color:#fff}
/* tablero de entregas */
.tablero{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.tablero .col{background:var(--bg3);border-radius:var(--radius2);padding:12px}
.tablero .col h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--text2);display:flex;justify-content:space-between}
.ficha{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;font-size:13px}

/* ── Ventanas: modal centrado, panel lateral (PC) y hoja inferior (celular) ── */
.velo{position:fixed;inset:0;background:rgba(10,20,40,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow:auto}
.modal{background:var(--bg2);border-radius:var(--radius2);width:100%;max-width:620px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.ancho{max-width:920px}
.modal .cab{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border2)}
.modal .cab h3{margin:0;font-size:16px}
.modal .cuerpo{padding:18px 20px}
.modal .pie{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--border2)}
.velo.panel{justify-content:flex-end;padding:0;align-items:stretch}
.velo.panel .modal{max-width:560px;border-radius:0;min-height:100%;display:flex;flex-direction:column}
.velo.panel .modal .cuerpo{flex:1;overflow:auto}
.cerrar{background:none;border:0;font-size:24px;cursor:pointer;color:var(--text3);line-height:1}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,520px)}
.t-msg{background:var(--navy);color:#fff;padding:11px 18px;border-radius:var(--radius);box-shadow:0 6px 20px rgba(0,0,0,.25);font-weight:500;text-align:center}
.t-msg.error{background:var(--red)}.t-msg.ok{background:var(--green)}

/* ── Login de RRD ── */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);background-image:repeating-linear-gradient(45deg,transparent,transparent 40px,rgba(255,255,255,.02) 40px,rgba(255,255,255,.02) 80px);padding:20px}
.login-box{background:#fff;color:#1a1a1a;border-radius:var(--radius2);padding:44px 40px;width:100%;max-width:420px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.login-box img{max-width:260px;max-height:150px;object-fit:contain;margin-bottom:14px}
.login-box h2{font-size:22px;color:#0f1f3d;margin:0 0 26px}
.login-box input{background:#fff;color:#1a1a1a;border-color:#bdb9b0;margin-bottom:12px;padding:13px 14px}
.login-box .btn.pri{width:100%;padding:13px;font-size:15px;font-weight:600;background:#0f1f3d}
.login-box .err{color:#c0392b;font-size:13px;min-height:18px;margin:2px 0 8px}
.login-box .alt{display:block;margin-top:16px;font-size:12.5px;color:#7a7a7a}
.codigo-rec{font-family:'IBM Plex Mono',monospace;font-size:26px;letter-spacing:3px;background:var(--gold-f);color:#856404;padding:14px;border-radius:var(--radius);text-align:center;font-weight:600;margin:12px 0}

/* ── Celular ── */
@media (max-width:760px){
  .nav{display:none}
  .barra{padding:0 12px;height:56px;gap:8px}
  .barra .logo-caja{height:40px}.barra .logo-caja img{height:34px;max-width:60px}
  .barra .marca .n{font-size:14px}.barra .marca .s{font-size:9px;letter-spacing:1px}
  .estado span{display:none}
  .usuario{display:none}
  .contenido{padding:14px 12px 88px}
  .btn{min-height:44px}.btn.chico{min-height:36px}
  .inferior{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg2);border-top:1px solid var(--border);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  .inferior button{flex:1;background:none;border:0;padding:6px 2px;font-size:11px;color:var(--text3);cursor:pointer;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px}
  .inferior button .i{font-size:20px}
  .inferior button.activo{color:var(--navy);font-weight:600}
  body.oscuro .inferior button.activo{color:var(--gold2)}
  .ocultar-movil{display:none!important}
  .tabla.tarjetas thead{display:none}
  .tabla.tarjetas tr{display:block;border-bottom:1px solid var(--border);padding:8px 0}
  .tabla.tarjetas td{display:flex;justify-content:space-between;gap:12px;border:0;padding:3px 6px;text-align:right}
  .tabla.tarjetas td::before{content:attr(data-l);color:var(--text3);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;text-align:left}
  .tabla.tarjetas td[data-l=""]::before{content:none}
  .velo{padding:0;align-items:flex-end}
  .modal,.velo.panel .modal{border-radius:16px 16px 0 0;max-height:92vh;display:flex;flex-direction:column;min-height:auto;max-width:100%}
  .modal .cuerpo{overflow:auto}
  .tarjeta{padding:14px}
  .totales{gap:14px}
}
@media print{.barra,.nav,.inferior,#toast{display:none}}

/* ── Formularios por pasos y botones grandes (lote 3) ── */
.paso{display:flex;align-items:center;gap:10px;margin:18px 0 12px}
.paso:first-child{margin-top:0}
.paso .n{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:none}
body.oscuro .paso .n{background:var(--gold)}
.paso h3{margin:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--border);background:var(--bg2);border-radius:10px;padding:9px 12px;font-weight:500;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:92px;color:var(--text2);font-size:13px}
.seg button .i{font-size:20px;line-height:1.1}
.seg button.activo{border:2px solid var(--navy);background:#e8edf6;color:var(--navy);font-weight:600}
body.oscuro .seg button.activo{border-color:var(--gold);background:var(--gold-f);color:var(--gold3)}
.seg.chico button{min-width:0;padding:6px 12px;flex-direction:row}
.pie-venta{position:sticky;bottom:0;background:var(--bg2);border-top:1px solid var(--border);margin:18px -20px -20px;padding:14px 20px;border-radius:0 0 12px 12px;z-index:5}
details.plegable{border:1px dashed var(--border);border-radius:8px;padding:10px 14px;margin-top:12px}
details.plegable summary{cursor:pointer;color:var(--text2);font-size:13px;font-weight:500}
.vista-previa{background:var(--bg3);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:8px}
.contador{display:flex;align-items:center;justify-content:center;gap:14px;margin:14px 0}
.contador button{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--border);background:var(--bg2);font-size:26px;font-weight:600;cursor:pointer}

/* Asegura que un blob tenga todas las piezas (por si viene de una versión anterior). */
function normalizar(db) {
  const base = nuevoDB();
  for (const k of Object.keys(base)) if (db[k] === undefined) db[k] = base[k];
  const cb = configBase();
  // Reparto anterior (emergencia primero, % de lo restante a reinversión) → nuevo: 20% y 30% de la utilidad.
  if (db.config && db.config.fondos && db.config.fondos.reservaPct === undefined) db.config.fondos.crecPct = 30;
  for (const k of Object.keys(cb)) {
    if (db.config[k] === undefined) db.config[k] = cb[k];
    else if (cb[k] && typeof cb[k] === 'object' && !Array.isArray(cb[k]))
      for (const k2 of Object.keys(cb[k])) if (db.config[k][k2] === undefined) db.config[k][k2] = cb[k][k2];

  const v = db.config.ventas, pc = v.posCuentaId && db.cuentas.find(x => x.id === v.posCuentaId);

/* ─────────────── 3. PERMISOS ─────────────── */
const tiene = (u, p) => !!u && Array.isArray(u.permisos) && (u.permisos.includes('admin') || u.permisos.includes(p));
const esAdmin = u => !!u && u.permisos.includes('admin');
const soloLectura = u => !!u && u.permisos.includes('socio') && !u.permisos.includes('admin');
const verCostos = u => esAdmin(u) || soloLectura(u);

/* ─────────────── 4. REGLAS DE PRECIO ─────────────── */
const precioDesdeMargen = (costo, m) => (m >= 100 ? 0 : r2(costo / (1 - m / 100)));
const margenDePrecio = (costo, precio) => (precio > 0 ? r2((1 - costo / precio) * 100) : 0);

function margenMayoristaAuto(costo, esLlanta, cfg) {
  if (esLlanta) return cfg.precios.llanta.margen;
  for (const t of cfg.precios.tramos) if (t.hasta == null || costo < t.hasta) return t.margen;
  return 20;
}

/* Precio mayorista de un artículo: { precio, aplica, origen, aviso } */
function precioMayorista(item, esLlanta, cfg) {
  const detalle = +item.precio || 0, costo = +item.costo || 0;
  if (+item.precioMayorista > 0) {
    const pm = +item.precioMayorista;
    if (pm >= detalle) return { precio: detalle, aplica: false, origen: 'manual', aviso: 'El precio mayorista manual es igual o mayor al de detalle: se cobra detalle.' };
    return { precio: pm, aplica: true, origen: 'manual', aviso: pm < precioDesdeMargen(costo, esLlanta ? cfg.precios.llanta.pisoPct : cfg.precios.pisoPct) ? 'Mayorista manual por debajo del piso de margen.' : '' };
  }
  if (!(costo > 0) || !(detalle > 0)) return { precio: detalle, aplica: false, origen: 'auto', aviso: '' };
  const reglas = esLlanta ? cfg.precios.llanta : cfg.precios;
  let p = precioDesdeMargen(costo, margenMayoristaAuto(costo, esLlanta, cfg));
  p = Math.min(p, detalle * reglas.topePct / 100);
  p = Math.round(p);
  const piso = precioDesdeMargen(costo, reglas.pisoPct);
  if (p < piso) p = Math.ceil(piso);
  if (p >= detalle) return { precio: detalle, aplica: false, origen: 'auto', aviso: '' };
  return { precio: p, aplica: true, origen: 'auto', aviso: '' };
}

/* Precio que corresponde en el carrito según cantidad (mayorista automático por artículo). */
function precioPorCantidad(item, esLlanta, cant, cfg) {
  const pm = precioMayorista(item, esLlanta, cfg);
  if (cant >= cfg.precios.mayoristaMinCant && pm.aplica) return { precio: pm.precio, mayorista: true, aviso: pm.aviso };
  return { precio: +item.precio || 0, mayorista: false, aviso: cant >= cfg.precios.mayoristaMinCant ? pm.aviso : '' };
}

function versionTexto(vs) {
  if (!vs || !vs.length) return '';
  if (vs.length === 3) return 'Todas las versiones';
  if (vs.length === 1) return VERSION_NOMBRE[vs[0]] || vs[0];
  return vs.map(v => VERSION_NOMBRE[v] || v).join(' y ');
}

/* Precio sugerido de detalle (regla C). Nunca por debajo del piso de margen. */
function precioSugerido(r, cfg) {
  const p = cfg.precios, costo = +r.costo || 0;
  let precio, origen;
  if (+r.precioRef > 0) { precio = Math.ceil(r.precioRef * (1 + (p.recargoRefPct || 0) / 100)); origen = `referencia del proveedor ${L(r.precioRef)} + ${p.recargoRefPct}%`; }
  else {
    if (!(costo > 0)) return null;
    let m = 30; for (const t of p.tramosDetalle) if (t.hasta == null || costo < t.hasta) { m = t.margen; break; }
    precio = Math.ceil(precioDesdeMargen(costo, m)); origen = `margen ${m}% para costo ${L(costo)}`;
  }
  const piso = Math.ceil(precioDesdeMargen(costo, p.pisoPct));
  if (precio < piso) { precio = piso; origen += ` (subido al piso de ${p.pisoPct}%)`; }

const VER_SIN_SUFIJO = ['', 'todas', 'toda version', 'todas las versiones'];

  const d = String(r.descripcion || '').trim(), v = versionTexto(r.versiones);
  if (VER_SIN_SUFIJO.includes(norm(v)) || norm(d).includes(norm(v))) return d;

}

  const g = (cat && cat.regla) || {};

/* Devuelve las hojas del Excel de catálogo como filas (arreglos). La pantalla las convierte a .xlsx. */
function catalogoHojas(db, fecha) {
  const cfg = db.config;
  const reps = db.repuestos.slice().sort((a, b) => (a.codigo || '').localeCompare(b.codigo || ''));
  const pr = r => (+r.precio > 0 ? +r.precio : '');
  const may = r => { const m = precioMayorista(r, false, cfg); return m.aplica && m.precio > 0 ? m.precio : ''; };
  const ver = r => versionTexto(r.versiones);
  const disp = [['Código', 'Nombre', 'Versión de bus', 'Marca', 'Precio', 'Precio mayorista', 'Stock']];
  const sin = [['Código', 'Nombre', 'Versión de bus', 'Marca', 'Precio', 'Precio mayorista']];
  reps.forEach(r => { if ((r.stock || 0) > 0) disp.push([r.codigo, r.descripcion, ver(r), r.marca || '', pr(r), may(r), r.stock]); else sin.push([r.codigo, r.descripcion, ver(r), r.marca || '', pr(r), may(r)]); });
  const prod = [['Código', 'Nombre', 'Nombre para catálogo', 'Categoría', 'Versión de bus', 'Marca', 'Vehículos compatibles', 'Presentación', 'Precio', 'Precio mayorista', 'Stock', 'Disponibilidad', 'Visible en catálogo', 'Estado', 'Catálogos', 'Códigos anteriores']];

    r.presentacion === 'Par' ? 'Par' : 'Unitario', pr(r), may(r), r.stock || 0, (r.stock || 0) > 0 ? 'En stock' : 'Por encargo',
    r.visibleCatalogo !== false ? 'Sí' : 'No', r.estadoCatalogo === 'descontinuado' ? 'Descontinuado' : 'Activo',
    db.catalogos.filter(c => repEnCatalogo(r, c)).map(c => c.nombre).join('; '), (r.codigosAnteriores || []).join('; ')]));
  const cats = [['Catálogo', 'Regla', 'Productos', 'Stock', 'Vehículos', 'Incluye Universal', 'Categorías', 'Estado']];
  db.catalogos.forEach(c => { const g = c.regla || {}; cats.push([c.nombre, resumenRegla(c), reps.filter(r => repEnCatalogo(r, c)).length,
    g.stock === 'con' ? 'Con stock' : g.stock === 'sin' ? 'Sin stock' : 'Todos', (g.vehiculos || []).join('; '),

    (g.estado || 'activo') === 'activo' ? 'Activo' : g.estado === 'descontinuado' ? 'Descontinuado' : 'Todos']); });
  const cc = cfg.catalogo || {};
  const cond = (cc.condiciones || []).slice();
  cond.splice(Math.min(1, cond.length), 0, 'Precio mayorista aplicable a partir de ' + cfg.precios.mayoristaMinCant + ' unidades por pedido.');
  const neg = [['Campo', 'Valor'], ['Nombre del negocio', cfg.negocio.nombre], ['Teléfono', cc.telefono || cfg.negocio.tel || ''],

}

/* ─────────────── 5. DINERO: UN SOLO REGISTRO ───────────────
   Cada entrada o salida es un "mov" con la cuenta a la que pertenece.
   Saldo de cuenta = suma de sus movs vigentes y confirmados. Nada más. */
const FORMAS = {
  Efectivo:      { cuentaTipo: ['efectivo'], confirmar: false },
  Transferencia: { cuentaTipo: ['banco'], confirmar: true },
  Tarjeta:       { cuentaTipo: ['banco'], confirmar: false },
  'Caja chica':  { cuentaTipo: ['cajachica'], confirmar: false }
};
const FORMAS_COBRO = ['Efectivo', 'Transferencia', 'Tarjeta'];

const TIPOS_MOV = {
  saldo_inicial: 'Saldo inicial', venta: 'Venta', abono: 'Abono de cliente', gasto: 'Gasto',
  traslado: 'Traslado entre cuentas', compra: 'Compra a proveedor', pago_proveedor: 'Pago a proveedor',
  devolucion: 'Devolución a cliente', anulacion: 'Anulación', dividendo: 'Dividendo a socio',
  comision: 'Pago de comisión', activo: 'Compra de activo fijo', envio: 'Costo de envío', ajuste: 'Ajuste', retenido: 'Pago retenido por cancelación'
};

function cuenta(db, id) { return db.cuentas.find(c => c.id === id); }
function cuentaDefault(db, forma) {
  const t = FORMAS[forma] ? FORMAS[forma].cuentaTipo : ['efectivo'];
  const c = db.cuentas.find(x => t.includes(x.tipo) && !x.inactiva);
  return c ? c.id : null;
}

const cuentasPos = db => db.cuentas.filter(c => c.tipo === 'banco' && !c.inactiva && c.tienePos);
/* ¿A qué POS (banco) entra un cobro con tarjeta? El elegido; si hay uno solo, ese; si no, el de Ajustes o el primer banco. */
function cuentaPos(db, elegida) {
  const pos = cuentasPos(db), c = elegida ? cuenta(db, elegida) : null;
  if (c && c.tienePos) return { c, pct: +c.posPct || 0 };
  if (pos.length === 1) return { c: pos[0], pct: +pos[0].posPct || 0 };
  exigir(pos.length === 0, 'Elige por cuál POS pasó la tarjeta.');
  const cfg = cuenta(db, db.config.ventas.posCuentaId), b = cfg && cfg.tipo === 'banco' && !cfg.inactiva ? cfg : (c && c.tipo === 'banco' ? c : cuenta(db, cuentaDefault(db, 'Tarjeta')));
  return { c: b, pct: +db.config.ventas.posPct || 0 };
}
function nuevoMov(db, ctx, m) {
  exigir(cuenta(db, m.cuentaId), 'Cuenta no válida.');
  exigir(r2(m.monto) !== 0, 'El monto no puede ser cero.');
  const mov = {
    id: uid(), fecha: m.fecha || ctx.fecha, hora: ctx.hora, cuentaId: m.cuentaId, monto: r2(m.monto),
    tipo: m.tipo, detalle: m.detalle || '', ref: m.ref || '', usuario: ctx.user.nombre
  };
  if (m.pendiente) mov.pendiente = true;
  if (m.categoria) mov.categoria = m.categoria;
  if (m.grupo) mov.grupo = m.grupo;
  if (m.protegido) mov.protegido = true;
  if (m.interes) mov.interes = r2(m.interes);
  if (m.socioId) mov.socioId = m.socioId;
  if (m.vendedorId) mov.vendedorId = m.vendedorId;
  if (m.tipoGasto) mov.tipoGasto = m.tipoGasto;
  // Trazabilidad: toda salida (y todo traslado) dice cómo se pagó y su referencia.
  if (mov.monto < 0 || mov.tipo === 'traslado') {
    const c = cuenta(db, m.cuentaId), met = m.metodo || ctx.metodo;
    mov.metodo = c.tipo === 'banco' ? (METODOS_BANCO.includes(met) ? met : 'Transferencia') : 'Efectivo';
    const ref = String(m.referencia || ctx.referencia || '').trim();
    if (ref) mov.referencia = ref;
  } else if (m.metodo) mov.metodo = m.metodo;
  db.movs.push(mov);
  return mov;
}
const METODOS_BANCO = ['Transferencia', 'Depósito', 'Cheque', 'Tarjeta'];
const movVigente = m => !m.anulado;
const movCuenta = m => movVigente(m) && !m.pendiente;
/* Las matemáticas son exactas: toda suma de dinero se hace en centavos enteros. */
const sumaL = (lista, f) => lista.reduce((s, x) => s + Math.round((f ? f(x) : x) * 100), 0) / 100;

function saldoCuenta(db, id, hasta) {
  return sumaL(db.movs.filter(m => m.cuentaId === id && movCuenta(m) && (!hasta || m.fecha <= hasta)), m => m.monto);
}
function saldos(db, hasta) {
  const porCuenta = {};
  for (const c of db.cuentas) porCuenta[c.id] = saldoCuenta(db, c.id, hasta);
  const deTipo = t => sumaL(db.cuentas.filter(c => c.tipo === t), c => porCuenta[c.id]);
  const efectivo = deTipo('efectivo'), cajachica = deTipo('cajachica'), bancos = deTipo('banco');
  const porConfirmar = sumaL(db.movs.filter(m => movVigente(m) && m.pendiente && m.monto > 0), m => m.monto);
  return { porCuenta, efectivo, cajachica, bancos, total: sumaL([efectivo, cajachica, bancos]), porConfirmar };
}

/* ─────────────── 6. INVENTARIO (apoyo) ─────────────── */
function kardex(r, ctx, tipo, cant, ref) {
  r.kardex = r.kardex || [];
  r.kardex.push({ f: ctx.fecha, t: tipo, c: cant, s: r.stock, ref: ref || '', u: ctx.user.nombre });
  if (r.kardex.length > 80) r.kardex = r.kardex.slice(-80);
}
function mover_stock(db, ctx, repId, delta, tipo, ref) {
  const r = db.repuestos.find(x => x.id === repId);
  exigir(r, 'Repuesto no encontrado.');
  const nuevo = (+r.stock || 0) + delta;
  exigir(nuevo >= 0, `Stock insuficiente de ${r.codigo} (${r.descripcion}). Hay ${r.stock}.`);
  r.stock = nuevo;
  kardex(r, ctx, tipo, delta, ref);
  return r;
}
function codigoLibre(db, codigo, exceptoId) {
  const c = norm(codigo);
  return !db.repuestos.some(r => r.id !== exceptoId && norm(r.codigo) === c) &&
         !db.llantas.some(r => r.id !== exceptoId && norm(r.codigo) === c);
}
function buscarArticulo(db, tipo, id) {
  return tipo === 'llanta' ? db.llantas.find(x => x.id === id) : db.repuestos.find(x => x.id === id);
}

/* ─────────────── 7. VENTAS (apoyo) ─────────────── */
function numerar(db, tipo, prefijo, fecha) {
  db.contadores[tipo] = (db.contadores[tipo] || 0) + 1;
  const m = mesDe(fecha).split('-');
  return `${prefijo}-${m[1]}${m[0].slice(2)}-${String(db.contadores[tipo]).padStart(4, '0')}`;
}

/* Calcula líneas con precio según quién vende. Valida descuento y existencias. */
function armarLineas(db, ctx, itemsIn, { validarStock, forzarMayorista, preciosCot }) {
  const cfg = db.config, admin = esAdmin(ctx.user);
  exigir(Array.isArray(itemsIn) && itemsIn.length, 'Agrega al menos un artículo.');
  const lineas = [];
  for (const it of itemsIn) {
    const cant = Math.floor(+it.cant || 0);
    exigir(cant > 0, 'Cantidad no válida.');
    if (it.tipo === 'libre') {
      exigir(String(it.descripcion || '').trim(), 'Describe el artículo libre.');
      exigir(+it.precioUnit > 0, 'Precio del artículo libre no válido.');
      lineas.push({ tipo: 'libre', refId: '', codigo: it.codigo || '', descripcion: String(it.descripcion).trim(), cant, precioUnit: r2(it.precioUnit), precioDetalle: r2(it.precioUnit), costoUnit: r2(it.costoUnit || 0), mayorista: false });
      continue;
    }
    const art = buscarArticulo(db, it.tipo, it.refId);
    exigir(art, 'Un artículo del carrito ya no existe.');
    const esLlanta = it.tipo === 'llanta';
    const encargo = !!it.encargo && !esLlanta;
    let proveedorId = '';
    if (encargo) {
      proveedorId = it.proveedorId || art.proveedorId || '';
      exigir(db.proveedores.find(p => p.id === proveedorId), `Elige a qué proveedor se encarga ${art.codigo}.`);
    }
    if (validarStock && !esLlanta && !encargo) {
      const yaEnCarrito = lineas.filter(l => l.refId === art.id).reduce((s, l) => s + l.cant, 0);
      exigir((+art.stock || 0) >= cant + yaEnCarrito, `No hay stock suficiente de ${art.codigo}: hay ${art.stock}, pides ${cant + yaEnCarrito}.`);
    }
    let pc = precioPorCantidad(art, esLlanta, cant, cfg);
    if (admin && forzarMayorista) { const pm = precioMayorista(art, esLlanta, cfg); if (pm.aplica) pc = { precio: pm.precio, mayorista: true, aviso: '' }; }   // el admin fuerza mayorista
    let precio = pc.precio;
    const pCot = preciosCot && preciosCot[(esLlanta ? 'll:' : 'r:') + art.id];
    if (pCot) { precio = pCot.precio; if (pCot.mayorista) pc = { precio, mayorista: true, aviso: '' }; }   // precio prometido en la cotización
    if (admin && +it.precioUnit > 0) precio = r2(it.precioUnit);  // solo el admin puede cambiar precio unitario
    lineas.push({
      tipo: esLlanta ? 'llanta' : 'rep', refId: art.id, codigo: art.codigo,
      descripcion: art.descripcion + (art.versiones && art.versiones.length ? ' — ' + versionTexto(art.versiones) : ''),
      cant, precioUnit: precio, precioDetalle: +art.precio || 0, costoUnit: +art.costo || 0, mayorista: pc.mayorista && precio === pc.precio
    });
    if (encargo) Object.assign(lineas[lineas.length - 1], { encargo: true, proveedorId, llegado: false });
  }
  return lineas;
}
function totalesLineas(lineas, descuento) {
  const subtotal = sumaL(lineas, l => l.precioUnit * l.cant);
  const costo = sumaL(lineas, l => l.costoUnit * l.cant);
  return { subtotal, costo, neto: sumaL([subtotal, -(descuento || 0)]) };
}
function validarDescuento(db, ctx, subtotal, descuento) {
  exigir(descuento >= 0 && descuento <= subtotal, 'Descuento no válido.');
  if (!esAdmin(ctx.user) && descuento > 0) {
    const max = r2(subtotal * db.config.ventas.descMaxVendedor / 100);
    exigir(descuento <= max + 0.001, `Tu descuento máximo es ${db.config.ventas.descMaxVendedor}% (${L(max)}). Para más, pídelo al administrador.`);
  }
}

/* Utilidad de la venta (sin interés): neto de descuento y de devoluciones. */
function utilidadVenta(v) {
  const dev = (v.devoluciones || []);
  const devVenta = dev.reduce((s, d) => s + d.montoBase, 0), devCosto = dev.reduce((s, d) => s + d.costo, 0);
  return r2((v.subtotal - v.descuento - devVenta) - (v.costo - devCosto));
}
function pagadoVenta(db, v) {
  return sumaL(db.movs.filter(m => m.ref === v.id && movVigente(m) && (m.tipo === 'venta' || m.tipo === 'abono')), m => m.monto);
}
function tienePendientes(db, v) {
  return db.movs.some(m => m.ref === v.id && movVigente(m) && m.pendiente);
}

/* Actualiza estado de pago y genera comisión cuando queda pagada completa y confirmada. */
function revisarEstadoVenta(db, ctx, v) {
  if (v.estado === 'anulada') return;
  v.saldo = r2(Math.max(0, v.saldo));
  const completa = v.saldo <= 0 && !tienePendientes(db, v);
  v.estado = v.saldo > 0 ? 'credito' : (completa ? 'pagada' : 'por_confirmar');
  if (completa && v.vendedorId && v.comisionPct > 0) {
    const monto = r2(Math.max(0, utilidadVenta(v)) * (v.comisionPct || 0) / 100);
    if (!v.comision) v.comision = { monto, fecha: ctx.fecha, pagada: false };
    else if (!v.comision.pagada) v.comision.monto = monto;
  }
}
function ajustarComision(db, ctx, v) {
  if (!v.comision) return;
  const nuevo = v.estado === 'anulada' ? 0 : r2(Math.max(0, utilidadVenta(v)) * (v.comisionPct || 0) / 100);
  if (v.comision.pagada) {
    const dif = r2(nuevo - v.comision.monto);
    if (dif !== 0) db.comisionAjustes.push({ id: uid(), fecha: ctx.fecha, vendedorId: v.vendedorId, monto: dif, ref: v.numero, pagado: false });
    v.comision.monto = nuevo;
  } else v.comision.monto = nuevo;
}

/* ─────────────── 8. ACCIONES ───────────────
   Cada acción: permiso + función(db, args, ctx). Todas pasan por ejecutar():

const A = {};
const accion = (nombre, permiso, desc, fn) => { A[nombre] = { permiso, desc, fn }; };

/* ── Configuración y usuarios ── */
accion('config.guardar', 'admin', 'Guardar ajustes', (db, a) => {

accion('usuario.guardar', 'admin', 'Guardar usuario', (db, a) => {

accion('usuario.cambiarPin', 'propio', 'Cambiar PIN', (db, a, ctx) => {

accion('cuenta.guardar', 'admin', 'Guardar cuenta bancaria', (db, a) => {

accion('saldo.inicial', 'admin', 'Registrar saldo inicial', (db, a, ctx) => {

  return 'Saldo inicial registrado 🔒';

/* ── Inventario ── */
function limpiarRep(a, db) {
  const costo = r2(a.costo), precio = r2(a.precio);
  exigir(String(a.codigo || '').trim(), 'El código es obligatorio (número de fábrica de la caja).');
  exigir(String(a.descripcion || '').trim(), 'La descripción es obligatoria.');
  exigir(costo >= 0 && precio > 0, 'Costo y precio deben ser válidos.');
  exigir(precio >= costo, 'El precio no puede ser menor al costo.');
  return {
    codigo: String(a.codigo).trim().toUpperCase(), descripcion: String(a.descripcion).trim(),
    categoria: a.categoria || '', versiones: (a.versiones || []).filter(v => VERSIONES.includes(v)),
    vehiculos: (a.vehiculos || []).filter(v => db.vehiculos.includes(v)), lado: ['Derecho', 'Izquierdo'].includes(a.lado) ? a.lado : '',
    marca: a.marca || '', ubicacion: a.ubicacion || '', costo, precio, margen: margenDePrecio(costo, precio),
    precioMayorista: +a.precioMayorista > 0 ? r2(a.precioMayorista) : 0, min: Math.max(0, Math.floor(+a.min || 0)),

accion('repuesto.guardar', 'admin', 'Guardar repuesto', (db, a, ctx) => {

  if (r.costo !== d.costo || r.precio !== d.precio) {

  }

});
accion('repuesto.eliminar', 'admin', 'Eliminar repuesto', (db, a) => {

});
accion('stock.ajustar', 'bodega', 'Ajustar stock', (db, a, ctx) => {

  r.stock = nuevo;
  kardex(r, ctx, 'Ajuste: ' + a.motivo, delta, '');
  return `Stock de ${r.codigo}: ${nuevo}`;
});
accion('conteo.aplicar', 'bodega', 'Aplicar conteo de inventario', (db, a, ctx) => {
  let n = 0;
  for (const it of a.items || []) {
    const r = db.repuestos.find(x => x.id === it.id);
    if (!r) continue;
    const contado = Math.floor(+it.contado);
    if (!(contado >= 0) || contado === r.stock) continue;
    const delta = contado - r.stock;
    r.stock = contado;
    kardex(r, ctx, 'Conteo físico', delta, '');
    n++;
  }
  return n ? `Conteo aplicado: ${n} artículo(s) corregidos` : 'El conteo coincide, no hubo cambios';
});
accion('llanta.guardar', 'admin', 'Guardar llanta en consignación', (db, a) => {
  const costo = r2(a.costo), precio = r2(a.precio);
  exigir(String(a.codigo || '').trim() && String(a.descripcion || '').trim(), 'Código y medida son obligatorios.');
  exigir(costo > 0 && precio > costo, 'Costo y precio deben ser válidos (precio mayor al costo).');
  exigir(a.proveedorId, 'Elige el proveedor de la consignación.');

  let l = a.id ? db.llantas.find(x => x.id === a.id) : null;

  return l.id;
});

/* ── Clientes ── */
accion('cliente.guardar', 'ventas', 'Guardar cliente', (db, a, ctx) => {

  Object.assign(c, { nombre: String(a.nombre).trim(), tel: String(a.tel || '').replace(/[^\d+]/g, ''), rtn: a.rtn || '', direccion: a.direccion || '', notas: a.notas || '' });
  if (a.credito && esAdmin(ctx.user)) {

    c.credito = { activo: !!a.credito.activo, limite: r2(a.credito.limite), plazo: +a.credito.plazo, interesPct: r2(a.credito.interesPct) };
  }

});
accion('cliente.eliminar', 'admin', 'Eliminar cliente', (db, a) => {
  exigir(!db.ventas.some(v => v.clienteId === a.id && v.saldo > 0 && v.estado !== 'anulada'), 'El cliente tiene saldo pendiente.');
  db.clientes = db.clientes.filter(x => x.id !== a.id);
  return 'Cliente eliminado';
});
/* Contadores que sobreviven al cierre de mes (el cierre borra ventas y compras viejas). */
function statCliente(db, id, fecha, total, compras) {
  const c = db.clientes.find(x => x.id === id);
  if (!c) return;
  const s = c.stats || (c.stats = { compras: 0, total: 0, ultima: '' });
  s.compras = Math.max(0, s.compras + compras); s.total = sumaL([s.total, total]);
  if (compras > 0 && fecha > (s.ultima || '')) s.ultima = fecha;
}
function statProv(db, id, fecha, monto) {
  const p = db.proveedores.find(x => x.id === id);
  if (!p) return;
  const s = p.stats || (p.stats = {}), y = String(fecha).slice(0, 4);
  s[y] = sumaL([s[y] || 0, monto]);
}
function saldoCliente(db, clienteId) {
  return sumaL(db.ventas.filter(v => v.clienteId === clienteId && v.estado !== 'anulada'), v => v.saldo);
}

/* ── Venta ── */
/* Datos de entrega comunes (venta y cambio de entrega). */
const TIPOS_ENTREGA = ['retira', 'envio', 'delivery'];
function datosEntrega(e, telDefault) {
  e = e || {};
  const tipo = TIPOS_ENTREGA.includes(e.tipo) ? e.tipo : 'retira';
  return { tipo, direccion: String(e.direccion || '').trim(), departamento: tipo === 'envio' ? String(e.departamento || '').trim() : '', ciudad: String(e.ciudad || '').trim(),
    referencia: String(e.referencia || '').trim(), telRecibe: String(e.telRecibe || telDefault || '').replace(/[^\d+]/g, ''),
    pagaEnvio: e.pagaEnvio === 'negocio' ? 'negocio' : 'cliente', notas: String(e.notas || '').trim() };
}
function aplicarPartes(db, ctx, v, partes, tipoMov) {
  let total = 0;
  for (const p of partes || []) {
    const monto = r2(p.monto);
    if (!(monto > 0)) continue;
    exigir(FORMAS_COBRO.includes(p.forma), 'Forma de pago no válida.');
    // Transferencia sin banco: queda "esperando comprobante"; el admin elige el banco al confirmar.
    const sinBanco = p.forma === 'Transferencia' && !p.cuentaId;
    const pos = p.forma === 'Tarjeta' ? cuentaPos(db, p.cuentaId) : null;
    const cId = pos ? (pos.c && pos.c.id) : (p.cuentaId || cuentaDefault(db, p.forma));
    const c = cuenta(db, cId);
    exigir(c && FORMAS[p.forma].cuentaTipo.includes(c.tipo), sinBanco ? 'Registra al menos una cuenta de banco en Dinero → Cuentas.' : `La cuenta elegida no corresponde a ${p.forma}.`);
    const mov = nuevoMov(db, ctx, { cuentaId: cId, monto, tipo: tipoMov, ref: v.id, detalle: `${v.numero} · ${v.clienteNombre} · ${p.forma}`, pendiente: FORMAS[p.forma].confirmar });
    if (sinBanco) mov.bancoPorAsignar = true;
    const ref = String(p.referencia || '').trim();
    if (ref) mov.referencia = ref;
    if (p.forma === 'Tarjeta') {
      mov.metodo = 'Tarjeta';
      const pct = pos.pct, com = r2(monto * pct / 100);
      if (com > 0) {
        const g = nuevoMov(db, ctx, { cuentaId: cId, monto: -com, tipo: 'gasto', categoria: 'Comisiones bancarias', tipoGasto: 'Operativo', ref: v.id, detalle: `Comisión POS ${pct}% · ${v.numero}`, metodo: 'Tarjeta', referencia: ref });
        g.comisionPos = mov.id;
      }
    }
    total += monto;
  }
  return r2(total);
}

accion('venta.registrar', 'ventas', 'Registrar venta', (db, a, ctx) => {
  const cotV = a.cotizacionId ? db.cotizaciones.find(c => c.id === a.cotizacionId && ['pendiente', 'contactado'].includes(c.estado) && c.vence >= ctx.fecha) : null;
  const preciosCot = cotV ? Object.fromEntries(cotV.items.filter(l => l.tipo !== 'libre').map(l => [(l.tipo === 'llanta' ? 'll:' : 'r:') + l.refId, { precio: l.precioUnit, mayorista: !!l.mayorista }])) : null;
  const lineas = armarLineas(db, ctx, a.items, { validarStock: true, forzarMayorista: !!a.forzarMayorista, preciosCot });
  const descuento = r2(a.descuento || 0);
  const t = totalesLineas(lineas, descuento);
  validarDescuento(db, ctx, t.subtotal, descuento);
  const cli = a.clienteId ? db.clientes.find(c => c.id === a.clienteId) : null;
  const clienteNombre = cli ? cli.nombre : (String(a.clienteNombre || '').trim() || 'Consumidor final');
  // ISV (apagado hasta que la empresa se constituya). Si el precio ya lo incluye solo se desglosa; si no, se suma.
  const fac = db.config.facturacion, isvPct = fac.isvActivo ? (+fac.isvPct || 0) : 0;
  const isvExtra = isvPct && !fac.precioIncluyeIsv ? r2(t.neto * isvPct / 100) : 0;
  const netoV = sumaL([t.neto, isvExtra]);
  const pagadoAhora = sumaL((a.partes || []).filter(p => +p.monto > 0), p => p.monto);
  exigir(pagadoAhora <= netoV + 0.001, `Lo pagado (${L(pagadoAhora)}) supera el total (${L(netoV)}).`);
  const hayEncargo = lineas.some(l => l.encargo);
  let aCredito = sumaL([netoV, -pagadoAhora]), interes = 0, plazo = 0;
  const usaCredito = aCredito > 0 && (!hayEncargo || a.aCredito);   // encargo: el saldo se cobra al llegar, sin exigir crédito
  if (usaCredito) {
    exigir(cli, 'Para vender a crédito elige un cliente guardado.');
    exigir(cli.credito && cli.credito.activo, `${cli.nombre} no tiene crédito autorizado.`);
    plazo = +(a.plazo || cli.credito.plazo);
    exigir(db.config.credito.plazos.includes(plazo), 'Plazo de crédito no válido.');
    interes = r2(aCredito * (cli.credito.interesPct || 0) / 100);
    const deuda = saldoCliente(db, cli.id);
    exigir(!(cli.credito.limite > 0) || deuda + aCredito + interes <= cli.credito.limite + 0.001,
      `Supera el límite de crédito de ${cli.nombre}: debe ${L(deuda)}, límite ${L(cli.credito.limite)}.`);
  }
  const vendedor = (a.comisionPara && db.usuarios.find(u => u.id === a.comisionPara)) || ctx.user;
  const cobraComision = tiene(vendedor, 'ventas') && !esAdmin(vendedor);
  const v = {
    id: uid(), numero: numerar(db, 'venta', db.config.facturacion.prefijo || 'RRD', ctx.fecha), fecha: ctx.fecha, hora: ctx.hora,
    clienteId: cli ? cli.id : '', clienteNombre, clienteTel: cli ? cli.tel : String(a.clienteTel || '').replace(/[^\d+]/g, ''),
    vendedorId: vendedor.id, vendedorNombre: vendedor.nombre, comisionPct: cobraComision ? db.config.ventas.comisionPct : 0, registradoPor: ctx.user.nombre,
    items: lineas, subtotal: t.subtotal, descuento, costo: t.costo, interes, total: sumaL([netoV, interes]),
    isv: isvPct ? (isvExtra || r2(t.neto - t.neto / (1 + isvPct / 100))) : 0, isvPct, baseGravada: isvPct ? (isvExtra ? t.neto : r2(t.neto / (1 + isvPct / 100))) : 0,
    isvIncluido: isvPct && !isvExtra ? r2(t.neto - t.neto / (1 + isvPct / 100)) : 0,   // ISV dentro del precio: no es ingreso del negocio
    plazo, vence: plazo ? sumarDias(ctx.fecha, plazo) : '', saldo: r2(aCredito + interes), estado: 'credito',
    encargo: hayEncargo,
    entrega: Object.assign(datosEntrega(a.entrega, cli ? cli.tel : a.clienteTel),
      hayEncargo ? { estado: 'por_llegar' } : (a.entrega && a.entrega.tipo && a.entrega.tipo !== 'retira') ? { estado: 'pendiente' } : { estado: 'entregada', fecha: ctx.fecha }),
    cotizacionId: a.cotizacionId || '', notas: a.notas || '', devoluciones: []
  };
  for (const l of lineas) {
    if (l.tipo === 'rep' && l.encargo) {
      // Encargo: la deuda con el proveedor (al costo) nace al registrar la venta.
      const prov = db.proveedores.find(p => p.id === l.proveedorId);
      statProv(db, l.proveedorId, ctx.fecha, l.costoUnit * l.cant);
      db.cxp.push({ id: uid(), tipo: 'encargo', proveedorId: l.proveedorId, monto: r2(l.costoUnit * l.cant), pagado: 0, vence: sumarDias(ctx.fecha, db.config.ventas.diasPagoEncargo || 15), ref: v.id, detalle: `Encargo ${l.cant} × ${l.codigo} (${v.numero})`, fecha: ctx.fecha });
      const r = db.repuestos.find(x => x.id === l.refId);
      kardex(r, ctx, 'Encargado a ' + (prov ? prov.nombre : 'proveedor'), 0, v.numero);
      r.ultimaVenta = ctx.fecha;
      r.vendidasMes = r.vendidasMes || {};
      r.vendidasMes[mesDe(ctx.fecha)] = (r.vendidasMes[mesDe(ctx.fecha)] || 0) + l.cant;
    } else if (l.tipo === 'rep') {
      const r = mover_stock(db, ctx, l.refId, -l.cant, 'Venta', v.numero);
      r.ultimaVenta = ctx.fecha;
      r.vendidasMes = r.vendidasMes || {};
      r.vendidasMes[mesDe(ctx.fecha)] = (r.vendidasMes[mesDe(ctx.fecha)] || 0) + l.cant;
    } else if (l.tipo === 'llanta') {
      const ll = db.llantas.find(x => x.id === l.refId);
      statProv(db, ll.proveedorId, ctx.fecha, l.costoUnit * l.cant);
      db.cxp.push({ id: uid(), tipo: 'llanta', proveedorId: ll.proveedorId, monto: r2(l.costoUnit * l.cant), pagado: 0, vence: sumarDias(ctx.fecha, db.config.ventas.diasPagoLlanta || 15), ref: v.id, detalle: `${l.cant} × ${l.descripcion} (${v.numero})`, fecha: ctx.fecha });
      ll.ultimaVenta = ctx.fecha;
    }
  }
  db.ventas.push(v);
  if (cli) statCliente(db, cli.id, ctx.fecha, v.total, 1);
  aplicarPartes(db, ctx, v, a.partes, 'venta');
  if (v.cotizacionId) {
    const c = db.cotizaciones.find(x => x.id === v.cotizacionId);
    if (c) { c.estado = 'ganada'; c.ventaId = v.id; c.cerrada = ctx.fecha; }
  }
  revisarEstadoVenta(db, ctx, v);
  return v.id;
});

accion('venta.anular', 'admin', 'Anular venta', (db, a, ctx) => {
  const v = db.ventas.find(x => x.id === a.id);
  exigir(v && v.estado !== 'anulada', 'Venta no encontrada o ya anulada.');
  exigir(!(v.devoluciones || []).length, 'La venta tiene devoluciones: no se puede anular completa.');
  exigir(String(a.motivo || '').trim(), 'Escribe el motivo de la anulación.');
  const grupo = uid();
  // Encargos: el administrador decide en cada caso → 'inventario' (la pieza se queda y se le sigue
  // debiendo al proveedor) o 'proveedor' (se devuelve y se cancela la deuda).
  const hayEnc = v.items.some(l => l.encargo);
  if (hayEnc) exigir(['inventario', 'proveedor'].includes(a.destinoEncargo), 'Decide qué pasa con la pieza encargada: entra a tu inventario o se devuelve al proveedor.');
  const retener = !!a.retenerPago;   // el cliente canceló y el negocio se queda con lo ya pagado
  for (const m of db.movs.filter(x => x.ref === v.id && movVigente(x) && (x.tipo === 'venta' || x.tipo === 'abono'))) {
    if (m.pendiente) { m.anulado = true; continue; }       // transferencia sin confirmar: se cae sola
    if (retener) { m.tipo = 'retenido'; m.detalle += ' · retenido por cancelación'; continue; }
    nuevoMov(db, ctx, { cuentaId: m.cuentaId, monto: -m.monto, tipo: 'anulacion', ref: v.id, detalle: `Reintegro anulación ${v.numero}`, grupo });
    // el pago con tarjeta se reversa completo: su comisión del POS también
    for (const g of db.movs.filter(x => x.comisionPos === m.id && movVigente(x))) { g.anulado = true; g.anuladoPor = ctx.user.nombre; g.anuladoFecha = ctx.fecha; }
  }
  for (const l of v.items) {
    if (l.tipo !== 'rep' || !db.repuestos.find(r => r.id === l.refId)) continue;
    if (!l.encargo) mover_stock(db, ctx, l.refId, l.cant, 'Anulación', v.numero);
    else if (a.destinoEncargo === 'inventario') mover_stock(db, ctx, l.refId, l.cant, 'Encargo cancelado: queda en inventario', v.numero);
  }
  for (const c of db.cxp.filter(x => x.ref === v.id)) {
    if (c.tipo === 'envio') continue;   // el envío ya se hizo: se le sigue debiendo al transportista
    if (c.tipo === 'encargo' && a.destinoEncargo === 'inventario') { c.detalle += ' · cliente canceló, pieza en inventario'; continue; }
    statProv(db, c.proveedorId, c.fecha, -(c.monto - c.pagado));
    if (c.pagado > 0) { c.monto = c.pagado; c.notas = 'Venta anulada con pago ya hecho al proveedor: gestionar la devolución'; }
    else db.cxp = db.cxp.filter(x => x.id !== c.id);
  }
  if (v.clienteId) statCliente(db, v.clienteId, v.fecha, -v.total, -1);
  v.estado = 'anulada'; v.saldo = 0; v.anulada = { fecha: ctx.fecha, motivo: a.motivo, por: ctx.user.nombre };
  ajustarComision(db, ctx, v);
  if (v.cotizacionId) { const c = db.cotizaciones.find(x => x.id === v.cotizacionId); if (c) { c.estado = 'pendiente'; c.ventaId = ''; } }
  return `Venta ${v.numero} anulada`;
});

accion('venta.devolver', 'ventas', 'Devolución de cliente (en dinero)', (db, a, ctx) => {
  const v = db.ventas.find(x => x.id === a.id);
  exigir(v && v.estado !== 'anulada', 'Venta no encontrada.');
  exigir(diasEntre(v.fecha, ctx.fecha) <= db.config.ventas.plazoDevolucionDias || esAdmin(ctx.user), `Pasó el plazo de devolución (${db.config.ventas.plazoDevolucionDias} días). Solo el administrador puede autorizarla.`);
  exigir(String(a.motivo || '').trim(), 'Escribe el motivo de la devolución.');
  const factor = v.subtotal > 0 ? (v.subtotal - v.descuento) / v.subtotal : 1;
  let montoBase = 0, costo = 0;
  const items = [];
  for (const it of a.items || []) {
    const l = v.items[it.idx], cant = Math.floor(+it.cant || 0);
    if (!l || cant <= 0) continue;
    const yaDev = (v.devoluciones || []).reduce((s, d) => s + d.items.filter(x => x.idx === it.idx).reduce((t, x) => t + x.cant, 0), 0);
    exigir(cant <= l.cant - yaDev, `Solo quedan ${l.cant - yaDev} por devolver de ${l.codigo}.`);
    montoBase += l.precioUnit * cant * factor;
    costo += l.costoUnit * cant;
    items.push({ idx: it.idx, cant, buenEstado: it.buenEstado !== false });
    if (l.tipo === 'rep' && it.buenEstado !== false && db.repuestos.find(r => r.id === l.refId)) mover_stock(db, ctx, l.refId, cant, 'Devolución', v.numero);
    if (l.tipo === 'llanta') {
      const c = db.cxp.find(x => x.ref === v.id && x.pagado < x.monto);
      if (c) c.monto = r2(Math.max(c.pagado, c.monto - l.costoUnit * cant));
    }
  }
  exigir(items.length, 'Elige qué artículos se devuelven.');
  montoBase = r2(montoBase); costo = r2(costo);
  const interesProp = v.subtotal > 0 ? r2(v.interes * montoBase / (v.subtotal - v.descuento || 1)) : 0;
  let porDevolver = r2(montoBase + interesProp);
  const deSaldo = r2(Math.min(v.saldo, porDevolver));   // primero baja lo que debe
  v.saldo = r2(v.saldo - deSaldo);
  const enDinero = r2(porDevolver - deSaldo);
  if (enDinero > 0) {
    exigir(a.cuentaId && cuenta(db, a.cuentaId), 'Elige de qué cuenta sale el reintegro.');
    exigir(saldoCuenta(db, a.cuentaId) >= enDinero, `No hay saldo suficiente en ${cuenta(db, a.cuentaId).nombre} para devolver ${L(enDinero)}.`);
    nuevoMov(db, ctx, { cuentaId: a.cuentaId, monto: -enDinero, tipo: 'devolucion', ref: v.id, detalle: `Devolución ${v.numero} · ${v.clienteNombre}` });
  }
  if (v.clienteId) statCliente(db, v.clienteId, v.fecha, -porDevolver, 0);
  v.devoluciones.push({ id: uid(), fecha: ctx.fecha, items, montoBase, costo, interes: interesProp, enDinero, deSaldo, motivo: a.motivo, por: ctx.user.nombre });
  revisarEstadoVenta(db, ctx, v);
  ajustarComision(db, ctx, v);
  return enDinero > 0 ? `Devolución registrada: se reintegran ${L(enDinero)}` : `Devolución registrada: se rebajaron ${L(deSaldo)} del saldo`;
});

/* ── Cobros ── */
accion('abono.registrar', 'ventas', 'Registrar abono', (db, a, ctx) => {
  const v = db.ventas.find(x => x.id === a.ventaId);
  exigir(v && v.estado !== 'anulada', 'Venta no encontrada.');
  const monto = r2(a.monto);
  exigir(monto > 0, 'El monto debe ser mayor a cero.');
  exigir(monto <= v.saldo + 0.001, `El abono supera el saldo (${L(v.saldo)}).`);
  aplicarPartes(db, ctx, v, [{ forma: a.forma, cuentaId: a.cuentaId, monto, referencia: a.referencia }], 'abono');
  v.saldo = r2(v.saldo - monto);
  revisarEstadoVenta(db, ctx, v);
  return v.saldo > 0 ? `Abono registrado. Saldo: ${L(v.saldo)}` : 'Abono registrado. ¡Cuenta saldada!';
});

accion('transferencia.confirmar', 'admin', 'Confirmar transferencia', (db, a, ctx) => {
  const m = db.movs.find(x => x.id === a.movId);
  exigir(m && m.pendiente && movVigente(m), 'Esa transferencia ya no está pendiente.');
  // El admin revisa el comprobante y dice a qué banco entró.
  if (a.cuentaId) { const c = cuenta(db, a.cuentaId); exigir(c && c.tipo === 'banco', 'Elige el banco donde entró la transferencia.'); m.cuentaId = c.id; }
  else exigir(!m.bancoPorAsignar, 'Elige el banco donde entró la transferencia.');
  delete m.bancoPorAsignar;
  if (String(a.referencia || '').trim()) m.referencia = String(a.referencia).trim();
  delete m.pendiente;
  m.confirmada = { fecha: ctx.fecha, por: ctx.user.nombre };
  const v = db.ventas.find(x => x.id === m.ref);
  if (v) revisarEstadoVenta(db, ctx, v);
  return 'Transferencia confirmada';
});
accion('transferencia.rechazar', 'admin', 'Rechazar transferencia', (db, a, ctx) => {

accion('entrega.despachar', 'bodega', 'Despachar pedido', (db, a, ctx) => {
  const v = db.ventas.find(x => x.id === a.ventaId);
  exigir(v && v.estado !== 'anulada' && v.entrega && v.entrega.estado === 'pendiente' && v.entrega.tipo !== 'retira', 'Este pedido no está pendiente de despacho.');
  const d = a.datos || {};
  exigir(String(d.empresa || '').trim(), 'Escribe la empresa de envío o el motorista.');
  Object.assign(v.entrega, { estado: 'despachada', fechaDespacho: ctx.fecha, horaDespacho: ctx.hora, despachadoPor: ctx.user.nombre,
    empresa: String(d.empresa).trim(), guia: d.guia || '', motorista: d.motorista || '', costo: r2(d.costo || 0),
    // Siempre se pregunta quién paga el envío (envío nacional o delivery). Si paga RRD, queda por pagar al transportista.
    pagaEnvio: (d.pagaEnvio || v.entrega.pagaEnvio) === 'negocio' ? 'negocio' : 'cliente', notas: d.notas || v.entrega.notas || '', comprobante: String(d.comprobante || '').trim(),
    telRecibe: String(d.telRecibe != null ? d.telRecibe : v.entrega.telRecibe || '').replace(/[^\d+]/g, ''), referencia: d.referencia != null ? String(d.referencia).trim() : (v.entrega.referencia || '') });
  if (v.entrega.pagaEnvio === 'negocio') {
    exigir(v.entrega.costo > 0, 'Escribe el costo del envío que paga RRD.');
    db.cxp.push({ id: uid(), tipo: 'envio', proveedorId: '', acreedor: v.entrega.empresa, monto: v.entrega.costo, pagado: 0, vence: ctx.fecha, ref: v.id,
      detalle: `${v.entrega.tipo === 'envio' ? 'Envío nacional' : 'Delivery'} ${v.numero} · ${v.clienteNombre}${v.entrega.guia ? ' · guía ' + v.entrega.guia : ''}`, fecha: ctx.fecha,
      notas: `Lo informó ${ctx.user.nombre}${v.entrega.comprobante ? ' · comprobante ' + v.entrega.comprobante : ''}` });
  }
  return `Pedido ${v.numero} despachado`;
});
/* El cliente cambió de opinión: retira, envío nacional o delivery (antes de despachar). */
accion('entrega.cambiar', 'ventas', 'Cambiar tipo de entrega', (db, a, ctx) => {

accion('encargo.recibir', 'bodega', 'Recibir encargo del proveedor', (db, a, ctx) => {
  const v = db.ventas.find(x => x.id === a.ventaId);
  exigir(v && v.estado !== 'anulada' && v.entrega && v.entrega.estado === 'por_llegar', 'Este pedido no está esperando mercadería.');
  for (const l of v.items.filter(l => l.encargo && !l.llegado)) {

  return v.saldo > 0 ? `Llegó el encargo ${v.numero}. Cobrar ${L(v.saldo)} al cliente.` : `Llegó el encargo ${v.numero}. Listo para entregar.`;
});
accion('entrega.confirmar', 'bodega', 'Confirmar entrega', (db, a, ctx) => {

});

accion('cotizacion.guardar', 'ventas', 'Guardar cotización', (db, a, ctx) => {
  const lineas = armarLineas(db, ctx, a.items, { validarStock: false, forzarMayorista: !!a.forzarMayorista });
  const descuento = r2(a.descuento || 0);
  const t = totalesLineas(lineas, descuento);
  validarDescuento(db, ctx, t.subtotal, descuento);
  const vig = +a.vigenciaDias || 7;
  exigir(db.config.ventas.vigencias.includes(vig), 'Vigencia no válida.');
  const cli = a.clienteId ? db.clientes.find(c => c.id === a.clienteId) : null;
  let c = a.id ? db.cotizaciones.find(x => x.id === a.id) : null;
  if (!c) { c = { id: uid(), numero: numerar(db, 'cotizacion', 'COT', ctx.fecha), fecha: ctx.fecha, estado: 'pendiente', seguimiento: [], vendedorId: ctx.user.id, vendedorNombre: ctx.user.nombre }; db.cotizaciones.push(c); }
  Object.assign(c, {
    clienteId: cli ? cli.id : '', clienteNombre: cli ? cli.nombre : (String(a.clienteNombre || '').trim() || 'Cliente'),
    clienteTel: cli ? cli.tel : String(a.clienteTel || '').replace(/[^\d+]/g, ''),
    items: lineas, subtotal: t.subtotal, descuento, total: t.neto, costo: t.costo, vigenciaDias: vig, vence: sumarDias(c.fecha, vig),
    proximoContacto: a.proximoContacto || sumarDias(ctx.fecha, 2), notas: a.notas || '', forzarMayorista: !!a.forzarMayorista
  });
  return c.id;
});

});

/* Compra: entra stock al costo promedio. Se paga de contado o en cuotas (tanda). */
accion('compra.registrar', 'admin', 'Registrar compra', (db, a, ctx) => {
  const prov = db.proveedores.find(p => p.id === a.proveedorId);
  exigir(prov, 'Elige el proveedor.');
  exigir(Array.isArray(a.items) && a.items.length, 'Agrega artículos a la compra.');
  const fecha = a.fecha || ctx.fecha;
  const compra = { id: uid(), numero: numerar(db, 'compra', 'CMP', fecha), fecha, proveedorId: prov.id, proveedorNombre: prov.nombre, items: [], total: 0, nombre: a.nombre || '', notas: a.notas || '', pago: a.pago && a.pago.tipo === 'cuotas' ? 'cuotas' : 'contado' };
  for (const it of a.items) {
    const r = db.repuestos.find(x => x.id === it.repuestoId);
    exigir(r, 'Repuesto de la compra no encontrado.');
    const cant = Math.floor(+it.cant), cu = r2(it.costoUnit);
    exigir(cant > 0 && cu > 0, `Cantidad o costo no válido en ${r.codigo}.`);
    const costoAnterior = r.costo, precioAnterior = r.precio, stockAntes = +r.stock || 0;
    const nuevoCosto = stockAntes > 0 ? r2((stockAntes * r.costo + cant * cu) / (stockAntes + cant)) : cu;
    r.costo = nuevoCosto;
    if (a.actualizarPrecios !== false && nuevoCosto > costoAnterior) r.precio = Math.ceil(precioDesdeMargen(nuevoCosto, r.margen || db.config.precios.margenDefault));
    r.margen = margenDePrecio(r.costo, r.precio);
    if (costoAnterior !== r.costo || precioAnterior !== r.precio) r.historialPrecios = (r.historialPrecios || []).concat({ f: fecha, costo: costoAnterior, precio: precioAnterior, u: ctx.user.nombre }).slice(-20);
    mover_stock(db, ctx, r.id, cant, 'Compra', compra.numero);
    compra.items.push({ repuestoId: r.id, codigo: r.codigo, descripcion: r.descripcion, cant, costoUnit: cu, costoAnterior, precioAnterior });
    compra.total += cant * cu;
    for (const f of db.faltantes.filter(f => f.estado === 'abierto' && f.repuestoId === r.id)) { f.estado = 'conseguido'; f.cerrado = fecha; }
  }
  compra.total = r2(compra.total);
  if (compra.pago === 'contado') {
    exigir(a.pago && cuenta(db, a.pago.cuentaId), 'Elige de qué cuenta se paga la compra.');
    nuevoMov(db, ctx, { cuentaId: a.pago.cuentaId, monto: -compra.total, tipo: 'compra', ref: compra.id, detalle: `${compra.numero} · ${prov.nombre}`, fecha });
  } else {
    const cuotas = (a.pago.cuotas || []).filter(c => +c.monto > 0);
    exigir(cuotas.length, 'Define las cuotas de la tanda.');
    const anticipo = r2(a.pago.anticipo || 0);
    const totalPlan = r2(anticipo + cuotas.reduce((s, c) => s + +c.monto, 0));
    exigir(totalPlan >= compra.total - 0.01, `Las cuotas (${L(totalPlan)}) no cubren el valor de la compra (${L(compra.total)}).`);
    const interesTotal = r2(totalPlan - compra.total);
    compra.interesTotal = interesTotal;
    if (anticipo > 0) {
      exigir(cuenta(db, a.pago.cuentaId), 'Elige de qué cuenta sale el anticipo.');
      nuevoMov(db, ctx, { cuentaId: a.pago.cuentaId, monto: -anticipo, tipo: 'compra', ref: compra.id, detalle: `Anticipo ${compra.numero} · ${prov.nombre}`, fecha, interes: r2(interesTotal * anticipo / totalPlan) });
    }
    cuotas.forEach((c, i) => db.cxp.push({ id: uid(), tipo: 'cuota', proveedorId: prov.id, monto: r2(c.monto), pagado: 0, vence: c.fecha, ref: compra.id,
      interes: r2(interesTotal * c.monto / totalPlan), detalle: `Cuota ${i + 1}/${cuotas.length} · ${compra.nombre || compra.numero}`, fecha }));
  }
  statProv(db, prov.id, fecha, compra.total);
  // Financiar con el fondo de crecimiento: el fondo es un apartado del dinero, así que solo se descuenta del apartado.
  const fin = r2(a.financiarFondo || 0);
  if (fin > 0) {
    exigir(fin <= compra.total, 'Lo financiado con el fondo no puede superar el valor de la compra.');
    const fondo = a.fondoCompra === 'reserva' ? 'reserva' : 'crecimiento';
    exigir(saldoFondo(db, fondo) >= fin - 0.001, `El ${NOMBRE_FONDO[fondo]} solo tiene ${L(saldoFondo(db, fondo))}.`);
    db.fondos.push({ id: uid(), fecha, fondo, monto: -fin, motivo: `Financiamiento de ${compra.nombre || compra.numero} con capital propio`, u: ctx.user.nombre, ref: compra.id });
    compra.financiadoFondo = fin; compra.fondoUsado = fondo;
  }
  db.compras.push(compra);
  return compra.id;
});

accion('compra.anular', 'admin', 'Anular compra', (db, a, ctx) => {
  const c = db.compras.find(x => x.id === a.id);
  exigir(c && !c.anulada, 'Compra no encontrada o ya anulada.');
  exigir(!db.cxp.some(x => x.ref === c.id && x.pagado > 0), 'Ya hay cuotas pagadas de esta compra: no se puede anular.');
  for (const it of c.items) {
    const r = db.repuestos.find(x => x.id === it.repuestoId);
    exigir(r && r.stock >= it.cant, `Ya se vendieron piezas de ${it.codigo}: no se puede anular la compra.`);
  }
  for (const it of c.items) {
    const r = mover_stock(db, ctx, it.repuestoId, -it.cant, 'Anulación compra', c.numero);
    r.costo = it.costoAnterior; r.precio = it.precioAnterior; r.margen = margenDePrecio(r.costo, r.precio);
  }
  for (const m of db.movs.filter(x => x.ref === c.id && movVigente(x))) nuevoMov(db, ctx, { cuentaId: m.cuentaId, monto: -m.monto, tipo: 'anulacion', ref: c.id, detalle: `Anulación ${c.numero}` });
  db.cxp = db.cxp.filter(x => x.ref !== c.id);
  statProv(db, c.proveedorId, c.fecha, -c.total);
  if (c.financiadoFondo) db.fondos.push({ id: uid(), fecha: ctx.fecha, fondo: c.fondoUsado || 'crecimiento', monto: c.financiadoFondo, motivo: `Devolución al fondo por anular ${c.numero}`, u: ctx.user.nombre, ref: c.id });
  c.anulada ={ fecha: ctx.fecha, motivo: a.motivo || '', por: ctx.user.nombre };
  return `Compra ${c.numero} anulada`;
});

accion('cxp.pagar', 'admin', 'Pagar a proveedor o transportista', (db, a, ctx) => {
  const c = db.cxp.find(x => x.id === a.id);
  exigir(c && c.pagado < c.monto, 'Ese pago ya está saldado.');
  const pend = r2(c.monto - c.pagado);
  // Una o varias cuentas: [{ cuentaId, monto, metodo, referencia }]
  const partes = (Array.isArray(a.partes) && a.partes.length ? a.partes : [{ cuentaId: a.cuentaId, monto: a.monto || pend, metodo: a.metodo, referencia: a.referencia }])
    .map(p => ({ cuentaId: p.cuentaId, monto: r2(p.monto), metodo: p.metodo, referencia: p.referencia })).filter(p => p.monto > 0);
  exigir(partes.length, 'Escribe cuánto se paga.');
  const monto = sumaL(partes, p => p.monto);
  exigir(monto > 0 && monto <= pend + 0.001, `El pago debe ser hasta ${L(pend)}.`);
  const porCuenta = {};
  for (const p of partes) { exigir(cuenta(db, p.cuentaId), 'Elige de qué cuenta se paga.'); porCuenta[p.cuentaId] = sumaL([porCuenta[p.cuentaId] || 0, p.monto]); }
  for (const id of Object.keys(porCuenta)) exigir(saldoCuenta(db, id) >= porCuenta[id], `No hay saldo suficiente en ${cuenta(db, id).nombre} (${L(saldoCuenta(db, id))}).`);
  const prov = db.proveedores.find(p => p.id === c.proveedorId);
  const quien = prov ? prov.nombre : (c.acreedor || '');
  const grupo = partes.length > 1 ? uid() : '';
  partes.forEach((p, i) => {
    const extra = partes.length > 1 ? ` (parte ${i + 1} de ${partes.length})` : '';
    const base = { cuentaId: p.cuentaId, monto: -p.monto, ref: c.id, metodo: p.metodo, referencia: p.referencia, grupo };
    const mov = c.tipo === 'envio'   // el envío es un gasto del negocio (categoría Envíos) que se paga al transportista o motorista
      ? nuevoMov(db, ctx, Object.assign(base, { tipo: 'envio', categoria: 'Envíos', tipoGasto: 'Operativo', detalle: `${c.detalle} · pagado a ${quien}${extra}` }))
      : nuevoMov(db, ctx, Object.assign(base, { tipo: 'pago_proveedor', detalle: `${c.detalle} · ${quien}${extra}`, interes: c.interes ? r2(c.interes * p.monto / c.monto) : 0 }));
    if (i === 0) marcarFondo(db, ctx, mov, a.fondo, monto, 'Pago: ' + c.detalle);
  });
  c.pagado = r2(c.pagado + monto);
  if (c.pagado >= c.monto) c.pagadoFecha = ctx.fecha;
  return 'Pago registrado';
});

/* ── Dinero ── */
accion('gasto.registrar', 'ventas', 'Registrar gasto', (db, a, ctx) => {
  const c = cuenta(db, a.cuentaId);
  exigir(c, 'Elige de dónde sale el gasto.');
  if (!esAdmin(ctx.user)) exigir(c.tipo === 'cajachica', 'Solo puedes registrar gastos de caja chica.');
  const monto = r2(a.monto);
  exigir(monto > 0, 'El monto debe ser mayor a cero.');
  exigir(String(a.descripcion || '').trim(), 'Describe el gasto.');
  exigir(saldoCuenta(db, c.id) >= monto, `No hay saldo suficiente en ${c.nombre} (${L(saldoCuenta(db, c.id))}).`);
  // Gasto fijo de la lista de Ajustes (renta, internet, sueldo de un empleado…): trae su categoría y queda ligado.
  const gf = a.gastoFijoId ? (db.config.gastosFijos || []).find(x => x.id === a.gastoFijoId) : null;
  if (a.gastoFijoId) exigir(gf, 'Ese gasto fijo ya no existe en Ajustes.');
  const mov = nuevoMov(db, ctx, { cuentaId: c.id, monto: -monto, tipo: 'gasto', categoria: gf ? gf.categoria : (a.categoria || 'Otros'), tipoGasto: gf || a.tipoGasto === 'Fijo' ? 'Fijo' : 'Operativo', detalle: String(a.descripcion).trim(), fecha: a.fecha || ctx.fecha });
  if (gf) mov.gastoFijoId = gf.id;
  marcarFondo(db, ctx, mov, a.fondo, monto, 'Gasto: ' + String(a.descripcion).trim());
  return 'Gasto registrado';
});
accion('mov.anular', 'admin', 'Anular movimiento', (db, a, ctx) => {
  const m = db.movs.find(x => x.id === a.id);
  exigir(m && movVigente(m), 'Movimiento no encontrado.');
  exigir(!m.protegido, 'Los saldos iniciales 🔒 no se pueden borrar.');
  exigir(['gasto', 'traslado', 'dividendo', 'activo', 'envio', 'ajuste'].includes(m.tipo), 'Este movimiento se corrige desde su origen (venta, compra o cobro).');
  const grupo = m.grupo ? db.movs.filter(x => x.grupo === m.grupo && movVigente(x)) : [m];
  for (const g of grupo) {
    g.anulado = true; g.anuladoPor = ctx.user.nombre; g.anuladoFecha = ctx.fecha;
    if (g.fondo) db.fondos.push({ id: uid(), fecha: ctx.fecha, fondo: g.fondo, monto: -g.monto, motivo: 'Devuelto al fondo por anular: ' + g.detalle, u: ctx.user.nombre, movId: g.id });
  }
  if (m.tipo === 'activo') db.activos = db.activos.filter(x => x.movId !== m.id);
  return 'Movimiento anulado';
});
accion('traslado', 'admin', 'Traslado entre cuentas', (db, a, ctx) => {
  const de = cuenta(db, a.desde), hacia = cuenta(db, a.hacia);
  exigir(de && hacia && de.id !== hacia.id, 'Elige dos cuentas distintas.');
  const monto = r2(a.monto);
  exigir(monto > 0, 'El monto debe ser mayor a cero.');
  exigir(saldoCuenta(db, de.id) >= monto, `No hay saldo suficiente en ${de.nombre} (${L(saldoCuenta(db, de.id))}).`);
  const grupo = uid(), det = a.detalle || `${de.nombre} → ${hacia.nombre}`;
  nuevoMov(db, ctx, { cuentaId: de.id, monto: -monto, tipo: 'traslado', detalle: det, grupo, fecha: a.fecha });
  nuevoMov(db, ctx, { cuentaId: hacia.id, monto, tipo: 'traslado', detalle: det, grupo, fecha: a.fecha });
  return 'Traslado registrado';
});

function resumenCajaChica(db, mes) {
  const movs = db.movs.filter(m => m.cuentaId === 'cajachica' && movCuenta(m) && mesDe(m.fecha) === mes);
  const gastos = movs.filter(m => m.tipo === 'gasto');
  return { gastado: r2(-gastos.reduce((s, m) => s + m.monto, 0)), numGastos: gastos.length, saldo: saldoCuenta(db, 'cajachica', finDeMes(mes)) };
}

accion('fondo.mover', 'admin', 'Movimiento de fondo', (db, a, ctx) => {

});
function saldoFondo(db, f) { return sumaL(db.fondos.filter(x => x.fondo === f), x => x.monto); }
const NOMBRE_FONDO = { reserva: 'Fondo de emergencia', crecimiento: 'Fondo de reinversión' };
/* Control de fondos: una salida de dinero puede venir de un fondo apartado (se descuenta del fondo). */
function marcarFondo(db, ctx, mov, fondo, monto, motivo) {
  if (!fondo) return;
  exigir(NOMBRE_FONDO[fondo], 'Fondo no válido.');
  exigir(saldoFondo(db, fondo) >= r2(monto) - 0.001, `El ${NOMBRE_FONDO[fondo]} solo tiene ${L(saldoFondo(db, fondo))}.`);
  db.fondos.push({ id: uid(), fecha: ctx.fecha, fondo, monto: -r2(monto), motivo, u: ctx.user.nombre, movId: mov ? mov.id : '' });
  if (mov) mov.fondo = fondo;
}
