/* Compra: entra stock al costo promedio. Se paga de contado o en cuotas (tanda). */
/* Entra a bodega una línea de compra: costo promedio, precio, stock, última compra y faltantes. */
const recibidoDe = it => it.recibido != null ? it.recibido : it.cant;
function ingresarCompra(db, ctx, compra, it, cant, fecha, actualizarPrecios) {
  const r = db.repuestos.find(x => x.id === it.repuestoId);
  exigir(r, 'Uno de los repuestos de la compra ya no existe. Quítelo y agréguelo de nuevo.');
  const cu = it.costoUnit, costoAnterior = r.costo, precioAnterior = r.precio, stockAntes = +r.stock || 0;
  const nuevoCosto = stockAntes > 0 ? r2((stockAntes * r.costo + cant * cu) / (stockAntes + cant)) : cu;
  r.costo = nuevoCosto;
  if (actualizarPrecios && nuevoCosto > costoAnterior) r.precio = Math.ceil(precioDesdeMargen(nuevoCosto, r.margen || db.config.precios.margenDefault));
  r.margen = margenDePrecio(r.costo, r.precio);
  if (costoAnterior !== r.costo || precioAnterior !== r.precio) r.historialPrecios = (r.historialPrecios || []).concat({ f: fecha, costo: costoAnterior, precio: precioAnterior, u: ctx.user.nombre }).slice(-20);
  mover_stock(db, ctx, r.id, cant, 'Compra', compra.numero);
  if (it.costoAnterior === undefined) Object.assign(it, { costoAnterior, precioAnterior, ultimaAnterior: r.ultimaCompra || null });
  if (it.recibido != null) it.recibido += cant;
  r.ultimaCompra = { f: fecha, costo: cu, proveedor: compra.proveedorNombre, numero: compra.numero };
  for (const f of db.faltantes.filter(f => f.estado === 'abierto' && f.repuestoId === r.id)) { f.estado = 'conseguido'; f.cerrado = fecha; }
  // Lo que entra va primero a los encargos de clientes (del más viejo al más nuevo); lo que sobra queda en stock.
  const asig = asignarEncargos(db, ctx, r.id, cant, cu, compra.numero);
  if (asig.usadas) it.paraEncargos = (it.paraEncargos || []).concat(asig.ventas.map(x => x.numero + ' (' + x.cant + ')'));
}
/* ── Encargos (Lote 13): esperan la compra al proveedor ── */
const piezasRecibidas = l => l.esperaCompra ? (l.recibidas || 0) : (l.encargo ? (l.llegado ? l.cant : 0) : l.cant);
function encargosAbiertos(db, repId, ventaId) {
  const out = [];
  for (const v of db.ventas) {
    if (v.estado === 'anulada' || (ventaId && v.id !== ventaId)) continue;
    for (const l of v.items) if (l.tipo === 'rep' && l.encargo && l.esperaCompra && !l.llegado && (!repId || l.refId === repId)) out.push({ v, l, falta: l.cant - (l.recibidas || 0) });
  }
  return out.sort((x, y) => (x.v.fecha + x.v.numero).localeCompare(y.v.fecha + y.v.numero));
}
/* Pasa hasta "maxCant" unidades del stock a los encargos abiertos de ese repuesto, al costo dado. */
function asignarEncargos(db, ctx, repId, maxCant, costoUnit, ref, ventaId) {
  let resta = Math.floor(maxCant || 0), usadas = 0;
  const tocadas = new Map();
  for (const x of encargosAbiertos(db, repId, ventaId)) {
    if (resta <= 0) break;
    const n = Math.min(x.falta, resta);
    if (n <= 0) continue;
    mover_stock(db, ctx, repId, -n, 'Sale para encargo' + (ref ? ' (' + ref + ')' : ''), x.v.numero);
    const prev = x.l.recibidas || 0;
    x.l.costoUnit = prev ? r2((x.l.costoUnit * prev + costoUnit * n) / (prev + n)) : r2(costoUnit);
    x.l.recibidas = prev + n; resta -= n; usadas += n;
    if (x.l.recibidas >= x.l.cant) x.l.llegado = ctx.fecha;
    tocadas.set(x.v.id, { v: x.v, cant: ((tocadas.get(x.v.id) || {}).cant || 0) + n });
  }
  for (const { v } of tocadas.values()) {
    v.costo = sumaL(v.items, l => l.costoUnit * l.cant);
    reajustarApartado(db, ctx, v);
    ajustarComision(db, ctx, v);
    if (v.entrega && v.entrega.estado === 'por_llegar' && !v.items.some(l => l.encargo && !l.llegado)) { v.entrega.estado = 'pendiente'; v.entrega.llegada = ctx.fecha; }
  }
  return { usadas, ventas: [...tocadas.values()].map(x => ({ numero: x.v.numero, cant: x.cant })) };
}
/* El costo real del encargo cambió: el Fondo de reinversión se ajusta a lo cobrado. */
function reajustarApartado(db, ctx, v) {
  if (!v.apartaCosto || (v.devoluciones || []).length || !(v.total > 0)) return;
  const pagado = sumaL(db.movs.filter(m => m.ref === v.id && movVigente(m) && !m.pendiente && (m.tipo === 'venta' || m.tipo === 'abono')), m => m.monto);
  const objetivo = r2(Math.min(v.costo, pagado * Math.min(1, v.costo / v.total)));
  const ya = sumaL(db.fondos.filter(x => x.ventaId === v.id), x => x.monto), dif = r2(objetivo - ya);
  if (Math.abs(dif) >= 0.01) db.fondos.push({ id: uid(), fecha: ctx.fecha, fondo: 'crecimiento', monto: dif, motivo: `Ajuste al costo real del encargo · ${v.numero}`, u: ctx.user.nombre, ventaId: v.id, tipo: 'costo' });
}
/* Estado de cada encargo pendiente: en bodega (se puede tomar), pedido (viene en camino) o sin pedir. */
function estadoEncargos(db) {
  const viene = enCaminoPorRepuesto(db), usadoB = {}, usadoC = {}, out = [];
  for (const x of encargosAbiertos(db)) {
    const r = db.repuestos.find(y => y.id === x.l.refId), id = x.l.refId;
    const enB = Math.max(0, (r ? disponible(db, r) : 0) - (usadoB[id] || 0)), b = Math.min(enB, x.falta);
    usadoB[id] = (usadoB[id] || 0) + b;
    const enC = Math.max(0, (viene[id] || 0) - (usadoC[id] || 0)), c = Math.min(enC, x.falta - b);
    usadoC[id] = (usadoC[id] || 0) + c;
    const sinPedir = x.falta - b - c;
    const compra = c > 0 ? db.compras.find(k => !k.anulada && k.estado === 'en_camino' && k.items.some(it => it.repuestoId === id && it.cant - recibidoDe(it) > 0)) : null;
    out.push(Object.assign(x, { r, enBodega: b, enCamino: c, sinPedir, compra, estado: sinPedir > 0 ? 'sinPedir' : c > 0 ? 'pedido' : 'enBodega' }));
  }
  return out;
}
accion('compra.registrar', 'admin', 'Registrar compra', (db, a, ctx) => {
  const prov = db.proveedores.find(p => p.id === a.proveedorId);
  exigir(prov, 'Elige el proveedor.');
  exigir(Array.isArray(a.items) && a.items.length, 'Agrega artículos a la compra.');
  const fecha = a.fecha || ctx.fecha;
  const compra = { id: uid(), numero: numerar(db, 'compra', 'CMP', fecha), fecha, proveedorId: prov.id, proveedorNombre: prov.nombre, items: [], total: 0, nombre: a.nombre || '', notas: a.notas || '', pago: a.pago && ['cuotas', 'despues'].includes(a.pago.tipo) ? a.pago.tipo : 'contado' };
  // En camino: el stock NO sube hasta que bodega confirme que llegó
  if (a.enCamino) { compra.estado = 'en_camino'; compra.llegaEstimada = a.llegaEstimada || sumarDias(fecha, 7); }
  const libre0 = libreDiaADia(db);
  for (const it of a.items) {
    const r = db.repuestos.find(x => x.id === it.repuestoId);
    exigir(r, 'Uno de los repuestos de la compra ya no existe. Quítelo y agréguelo de nuevo.');
    const cant = Math.floor(+it.cant), cu = r2(it.costoUnit);
    exigir(cant > 0 && cu > 0, `Cantidad o costo no válido en ${r.codigo}.`);
    const linea = { repuestoId: r.id, codigo: r.codigo, descripcion: r.descripcion, cant, costoUnit: cu };
    if (compra.estado === 'en_camino') linea.recibido = 0;
    else ingresarCompra(db, ctx, compra, linea, cant, fecha, a.actualizarPrecios !== false);
    compra.items.push(linea);
    compra.total += cant * cu;
  }
  compra.total = r2(compra.total);
  if (compra.pago === 'contado') {
    exigir(a.pago && cuenta(db, a.pago.cuentaId), 'Elige de qué cuenta se paga la compra.');
    const mc = nuevoMov(db, ctx, { cuentaId: a.pago.cuentaId, monto: -compra.total, tipo: 'compra', ref: compra.id, detalle: `${compra.numero} · ${prov.nombre}`, fecha });
    if (a.pago.sobres) aplicarSobres(db, ctx, mc, a.pago.sobres, compra.total, `Compra ${compra.numero}`, libre0);
  } else if (compra.pago === 'despues') {
    // Pagar después: una sola deuda con el proveedor en "Por pagar"
    const vence = a.pago.vence || sumarDias(fecha, 30);
    db.cxp.push({ id: uid(), tipo: 'compra', proveedorId: prov.id, monto: compra.total, pagado: 0, vence, ref: compra.id, detalle: `Compra ${compra.numero}${compra.nombre ? ' · ' + compra.nombre : ''}`, fecha });
  } else {
    const cuotas = (a.pago.cuotas || []).filter(c => +c.monto > 0);
    exigir(cuotas.length, 'Define las cuotas de la tanda.');
    const anticipo = r2(a.pago.anticipo || 0);
    const totalPlan = r2(anticipo + cuotas.reduce((s, c) => s + +c.monto, 0));
    exigir(totalPlan >= compra.total - 0.01, `Las cuotas (${L(totalPlan)}) no cubren el valor de la compra (${L(compra.total)}).`);
    const interesTotal = r2(totalPlan - compra.total);
    compra.interesTotal = interesTotal;
    if (anticipo > 0) {
      exigir(cuenta(db, a.pago.cuentaId), 'Elige de qué cuenta sale el anticipo.');
      const ma = nuevoMov(db, ctx, { cuentaId: a.pago.cuentaId, monto: -anticipo, tipo: 'compra', ref: compra.id, detalle: `Anticipo ${compra.numero} · ${prov.nombre}`, fecha, interes: r2(interesTotal * anticipo / totalPlan) });
      if (a.pago.sobres) aplicarSobres(db, ctx, ma, a.pago.sobres, anticipo, `Anticipo ${compra.numero}`, libre0);
    }
    cuotas.forEach((c, i) => db.cxp.push({ id: uid(), tipo: 'cuota', proveedorId: prov.id, monto: r2(c.monto), pagado: 0, vence: c.fecha, ref: compra.id,
      interes: r2(interesTotal * c.monto / totalPlan), detalle: `Cuota ${i + 1}/${cuotas.length} · ${compra.nombre || compra.numero}`, fecha }));
  }
  statProv(db, prov.id, fecha, compra.total);
  // Financiar con el fondo de crecimiento: el fondo es un apartado del dinero, así que solo se descuenta del apartado.
  const fin = r2(a.financiarFondo || 0);
  if (fin > 0) {
    exigir(fin <= compra.total, 'Lo financiado con el fondo no puede superar el valor de la compra.');
    const fondo = a.fondoCompra === 'reserva' ? 'reserva' : 'crecimiento';
    exigir(saldoFondo(db, fondo) >= fin - 0.001, `El ${NOMBRE_FONDO[fondo]} solo tiene ${L(saldoFondo(db, fondo))}.`);
    db.fondos.push({ id: uid(), fecha, fondo, monto: -fin, motivo: `Financiamiento de ${compra.nombre || compra.numero} con capital propio`, u: ctx.user.nombre, ref: compra.id });
    compra.financiadoFondo = fin; compra.fondoUsado = fondo;
  }
  db.compras.push(compra);
  return compra.id;
});

/* Bodega confirma lo que llegó. Puede llegar por partes. "cerrar": lo que falta ya no vendrá (queda anotado para reclamar). */
accion('compra.recibir', 'bodega', 'Recibir compra en bodega', (db, a, ctx) => {
  const c = db.compras.find(x => x.id === a.id);
  exigir(c && !c.anulada && c.estado === 'en_camino', 'Esa compra no está en camino.');
  const cants = a.cants || {};
  let total = 0;
  c.items.forEach((it, i) => {
    const n = Math.floor(+cants[i] || 0), falta = it.cant - recibidoDe(it);
    exigir(n >= 0 && n <= falta, `En ${it.codigo} llegaron más de las que faltaban (${falta}).`);
    if (n > 0) { ingresarCompra(db, ctx, c, it, n, ctx.fecha, true); total += n; }
  });
  const pendientes = c.items.filter(it => recibidoDe(it) < it.cant);
  exigir(total > 0 || (a.cerrar && esAdmin(ctx.user)), 'Escribe cuántas piezas llegaron.');
  c.recepciones = (c.recepciones || []).concat({ fecha: ctx.fecha, hora: ctx.hora, por: ctx.user.nombre, piezas: total, nota: a.nota || '' });
  if (!pendientes.length) { c.estado = 'recibida'; c.llegada = ctx.fecha; return `${c.numero}: llegó completa ✓ (stock actualizado)`; }
  if (a.cerrar) {
    exigir(String(a.nota || '').trim(), 'Escribe qué pasó con lo que no llegó.');
    c.estado = 'recibida'; c.llegada = ctx.fecha;
    c.noLlego = pendientes.map(it => ({ codigo: it.codigo, cant: it.cant - recibidoDe(it), costoUnit: it.costoUnit }));
    c.reclamo = { nota: String(a.nota).trim(), monto: r2(sumaL(c.noLlego, x => x.cant * x.costoUnit)), resuelto: false };
    return `${c.numero}: cerrada. No llegaron ${c.noLlego.reduce((s, x) => s + x.cant, 0)} pieza(s): queda el reclamo al proveedor.`;
  }
  return `${c.numero}: entraron ${total} pieza(s). Faltan ${pendientes.reduce((s, it) => s + it.cant - recibidoDe(it), 0)}.`;
});

accion('compra.anular', 'admin', 'Anular compra', (db, a, ctx) => {
  const c = db.compras.find(x => x.id === a.id);
  exigir(c && !c.anulada, 'Esa compra ya fue anulada. Recargue la pantalla para ver lo último.');
  exigir(!db.cxp.some(x => x.ref === c.id && x.pagado > 0), 'Ya hay cuotas pagadas de esta compra: no se puede anular.');
  exigir(String(a.motivo || '').trim(), 'Escribe el motivo de la anulación.');
  for (const it of c.items) {
    const r = db.repuestos.find(x => x.id === it.repuestoId);
    exigir(r && r.stock >= recibidoDe(it), `Ya se vendieron piezas de ${it.codigo}: no se puede anular la compra.`);
  }
  for (const it of c.items) {
    if (!(recibidoDe(it) > 0)) continue;   // en camino: nada entró a bodega
    const r = mover_stock(db, ctx, it.repuestoId, -recibidoDe(it), 'Anulación compra', c.numero);
    r.costo = it.costoAnterior; r.precio = it.precioAnterior; r.margen = margenDePrecio(r.costo, r.precio);
    if (r.ultimaCompra && r.ultimaCompra.numero === c.numero) r.ultimaCompra = it.ultimaAnterior || null;
  }
  for (const m of db.movs.filter(x => x.ref === c.id && movVigente(x))) {
    nuevoMov(db, ctx, { cuentaId: m.cuentaId, monto: -m.monto, tipo: 'anulacion', ref: c.id, detalle: `Anulación ${c.numero}` });
    for (const x of m.fondos || []) db.fondos.push({ id: uid(), fecha: ctx.fecha, fondo: x.fondo, monto: x.monto, motivo: `Devuelto al fondo por anular ${c.numero}`, u: ctx.user.nombre, movId: m.id });
  }
  db.cxp = db.cxp.filter(x => x.ref !== c.id);
  statProv(db, c.proveedorId, c.fecha, -c.total);
  if (c.financiadoFondo) db.fondos.push({ id: uid(), fecha: ctx.fecha, fondo: c.fondoUsado || 'crecimiento', monto: c.financiadoFondo, motivo: `Devolución al fondo por anular ${c.numero}`, u: ctx.user.nombre, ref: c.id });
  c.anulada ={ fecha: ctx.fecha, motivo: a.motivo || '', por: ctx.user.nombre };
  return `Compra ${c.numero} anulada`;
});

accion('cxp.pagar', 'admin', 'Pagar a proveedor o transportista', (db, a, ctx) => {
  const c = db.cxp.find(x => x.id === a.id);

  // Una o varias cuentas: [{ cuentaId, monto, metodo, referencia }]
  const partes = (Array.isArray(a.partes) && a.partes.length ? a.partes : [{ cuentaId: a.cuentaId, monto: a.monto || pend, metodo: a.metodo, referencia: a.referencia }])
    .map(p => ({ cuentaId: p.cuentaId, monto: r2(p.monto), metodo: p.metodo, referencia: p.referencia })).filter(p => p.monto > 0);
  exigir(partes.length, 'Escribe cuánto se paga.');
  const monto = sumaL(partes, p => p.monto);
  exigir(monto > 0 && monto <= pend + 0.001, `El pago debe ser hasta ${L(pend)}.`);
  const porCuenta = {};
  for (const p of partes) { exigir(cuenta(db, p.cuentaId), 'Elige de qué cuenta se paga.'); porCuenta[p.cuentaId] = sumaL([porCuenta[p.cuentaId] || 0, p.monto]); }
  for (const id of Object.keys(porCuenta)) exigir(saldoCuenta(db, id) >= porCuenta[id], `No hay saldo suficiente en ${cuenta(db, id).nombre} (${L(saldoCuenta(db, id))}).`);
  const prov = db.proveedores.find(p => p.id === c.proveedorId);
  const quien = prov ? prov.nombre : (c.acreedor || '');
  const grupo = partes.length > 1 ? uid() : '', libre0 = libreDiaADia(db);
  partes.forEach((p, i) => {
    const extra = partes.length > 1 ? ` (parte ${i + 1} de ${partes.length})` : '';
    const base = { cuentaId: p.cuentaId, monto: -p.monto, ref: c.id, metodo: p.metodo, referencia: p.referencia, grupo };
    const mov = c.tipo === 'envio'   // el envío es un gasto del negocio (categoría Envíos) que se paga al transportista o motorista
      ? nuevoMov(db, ctx, Object.assign(base, { tipo: 'envio', categoria: 'Envíos', tipoGasto: 'Operativo', detalle: `${c.detalle} · pagado a ${quien}${extra}` }))
      : nuevoMov(db, ctx, Object.assign(base, { tipo: 'pago_proveedor', detalle: `${c.detalle} · ${quien}${extra}`, interes: c.interes ? r2(c.interes * p.monto / c.monto) : 0 }));
    if (i === 0) aplicarSobres(db, ctx, mov, a.sobres, monto, 'Pago: ' + c.detalle, libre0, a.fondo);
  });
  c.pagado = r2(c.pagado + monto);
  if (c.pagado >= c.monto) c.pagadoFecha = ctx.fecha;
  return c.pagado >= c.monto ? `✓ Pago de ${L(monto)} registrado. Esa deuda quedó saldada.` : `✓ Pago de ${L(monto)} registrado. Falta pagar ${L(r2(c.monto - c.pagado))}.`;
});

accion('gasto.registrar', 'ventas', 'Registrar gasto', (db, a, ctx) => {

  if (gf) mov.gastoFijoId = gf.id;

accion('mov.anular', 'admin', 'Anular movimiento', (db, a, ctx) => {
  const m = db.movs.find(x => x.id === a.id);
  exigir(m && movVigente(m), 'Ese movimiento ya no existe. Recargue la pantalla.');
  exigir(!m.protegido, 'Los saldos iniciales 🔒 no se pueden borrar.');
  exigir(['gasto', 'traslado', 'dividendo', 'activo', 'envio', 'ajuste', 'pago_proveedor', 'venta', 'abono', 'aporte', 'ingreso', 'prestamo'].includes(m.tipo) && !m.comisionPos, 'Este movimiento se corrige desde su origen (venta, compra o pedido).');
  exigir(String(a.motivo || '').trim(), 'Escribe el motivo de la anulación.');
  if (m.tipo === 'venta' || m.tipo === 'abono') { exigir(!m.pendiente, 'Esa transferencia está por confirmar: recházala en Cobros → Transferencias.'); const vx = db.ventas.find(x => x.id === m.ref); exigir(!vx || vx.estado !== 'anulada', 'Esa venta ya está anulada.'); }
  if (m.tipo === 'prestamo') { const c = db.cxp.find(x => x.ref === m.id && x.tipo === 'prestamo'); exigir(!c || !(c.pagado > 0), 'Ya hay pagos de ese préstamo: no se puede anular.'); db.cxp = db.cxp.filter(x => !(x.ref === m.id && x.tipo === 'prestamo')); }
  const grupo = m.grupo ? db.movs.filter(x => x.grupo === m.grupo && movVigente(x)) : [m];
  for (const g of grupo) {
    g.anulado = true; g.anuladoPor = ctx.user.nombre; g.anuladoFecha = ctx.fecha; g.anuladoMotivo = String(a.motivo).trim();
    const usados = g.fondos && g.fondos.length ? g.fondos : (g.fondo ? [{ fondo: g.fondo, monto: -g.monto }] : []);
    for (const x of usados) db.fondos.push({ id: uid(), fecha: ctx.fecha, fondo: x.fondo, monto: x.monto, motivo: 'Devuelto al fondo por anular: ' + g.detalle, u: ctx.user.nombre, movId: g.id });
    // pago a proveedor o de un envío: la deuda vuelve a quedar pendiente
    if (g.tipo === 'pago_proveedor' || g.tipo === 'envio') { const c = db.cxp.find(x => x.id === g.ref); if (c) { c.pagado = r2(Math.max(0, c.pagado + g.monto)); delete c.pagadoFecha; } }
    // cobro de un cliente: la venta vuelve a deber, la comisión se ajusta y el costo apartado sale del fondo
    if (g.tipo === 'venta' || g.tipo === 'abono') {
      const v = db.ventas.find(x => x.id === g.ref);
      for (const x of db.movs.filter(x => x.comisionPos === g.id && movVigente(x))) { x.anulado = true; x.anuladoPor = ctx.user.nombre; x.anuladoFecha = ctx.fecha; }
      quitarApartado(db, ctx, x => x.movId === g.id && x.tipo === 'costo', 'Cobro anulado: sale el costo apartado', null, { movId: g.id, ventaId: g.ref });
      if (v && v.estado !== 'anulada') { v.saldo = r2(v.saldo + g.monto); if (!v.vence) v.vence = ctx.fecha; revisarEstadoVenta(db, ctx, v); ajustarComision(db, ctx, v); }
    }
  }
  if (m.tipo === 'activo') db.activos = db.activos.filter(x => x.movId !== m.id);

function saldoFondo(db, f) { return sumaL(db.fondos.filter(x => x.fondo === f), x => x.monto); }
const NOMBRE_FONDO = { reserva: 'Fondo de emergencia', crecimiento: 'Fondo de reinversión' };
/* Control de fondos: una salida de dinero puede venir de un fondo apartado (se descuenta del fondo). */
/* Dinero del día a día = dinero real − lo apartado en los fondos */
const libreDiaADia = db => sumaL([saldos(db).total, -saldoFondo(db, 'reserva'), -saldoFondo(db, 'crecimiento')]);
/* Reparte un pago entre sobres: [{ fondo: 'crecimiento' | 'reserva' | '' (día a día), monto }].
   libre0 = dinero del día a día ANTES de este pago. */
function aplicarSobres(db, ctx, mov, sobres, monto, motivo, libre0, fondoLegado) {
  const lista = (Array.isArray(sobres) && sobres.length ? sobres : [{ fondo: fondoLegado || '', monto }])
    .map(x => ({ fondo: x.fondo || '', monto: r2(x.monto) })).filter(x => x.monto > 0);
  const suma = sumaL(lista, x => x.monto);
  exigir(Math.abs(suma - r2(monto)) < 0.011, `Los sobres (${L(suma)}) no suman el pago (${L(monto)}).`);
  const diario = sumaL(lista.filter(x => !x.fondo), x => x.monto);
  if (diario > 0 && libre0 != null) exigir(diario <= libre0 + 0.001, `No alcanza el dinero del día a día (${L(Math.max(0, libre0))}). Paga una parte con un fondo.`);
  const usados = [];
  for (const x of lista.filter(x => x.fondo)) {
    exigir(NOMBRE_FONDO[x.fondo], 'Elija el fondo: Reinversión o Emergencia.');
    exigir(saldoFondo(db, x.fondo) >= x.monto - 0.001, `El ${NOMBRE_FONDO[x.fondo]} solo tiene ${L(saldoFondo(db, x.fondo))}.`);
    db.fondos.push({ id: uid(), fecha: ctx.fecha, fondo: x.fondo, monto: -x.monto, motivo, u: ctx.user.nombre, movId: mov ? mov.id : '' });
    usados.push(x);
  }
  if (mov && usados.length) { mov.fondos = usados; if (usados.length === 1 && usados[0].monto === r2(monto)) mov.fondo = usados[0].fondo; }
}
function marcarFondo(db, ctx, mov, fondo, monto, motivo) {
  if (!fondo) return;
  exigir(NOMBRE_FONDO[fondo], 'Elija el fondo: Reinversión o Emergencia.');
  exigir(saldoFondo(db, fondo) >= r2(monto) - 0.001, `El ${NOMBRE_FONDO[fondo]} solo tiene ${L(saldoFondo(db, fondo))}.`);
  db.fondos.push({ id: uid(), fecha: ctx.fecha, fondo, monto: -r2(monto), motivo, u: ctx.user.nombre, movId: mov ? mov.id : '' });
  if (mov) mov.fondo = fondo;
}

/* Desempeño de vendedores y descuentos del mes */
function desempenoVendedores(db, mes) {
  const ventas = db.ventas.filter(v => mesDe(v.fecha) === mes && v.estado !== 'anulada');
  const por = {};
  for (const v of ventas) {
    const k = v.vendedorId || '_';
    const p = por[k] || (por[k] = { vendedorId: v.vendedorId, nombre: v.vendedorNombre, ventas: 0, total: 0, utilidad: 0, comision: 0, descuentos: 0 });
    p.ventas++; p.total = sumaL([p.total, v.total]); p.utilidad = sumaL([p.utilidad, utilidadVenta(v)]);
    p.comision = sumaL([p.comision, v.comision ? v.comision.monto : 0]); p.descuentos = sumaL([p.descuentos, v.descuento]);
  }
  const descuentos = ventas.filter(v => v.descuento > 0).map(v => ({ numero: v.numero, fecha: v.fecha, cliente: v.clienteNombre, vendedor: v.vendedorNombre, subtotal: v.subtotal, descuento: v.descuento, pct: r2(v.descuento / v.subtotal * 100) }));
  return { vendedores: Object.values(por).sort((a, b) => b.total - a.total), descuentos };
}

/* Cierre asistido: qué mes toca cerrar y qué conviene revisar antes. */
function revisionCierre(db, ahora) {
  const mes = mesesSinCerrar(db, ahora)[0];
  if (!mes) return null;
  const corte = finDeMes(mes), avisos = [];
  const tr = db.movs.filter(m => m.pendiente && movVigente(m) && m.fecha <= corte);
  if (tr.length) avisos.push(`${tr.length} transferencia(s) sin confirmar (${L(sumaL(tr, m => m.monto))})`);
  const llegar = db.ventas.filter(v => v.estado !== 'anulada' && v.entrega && v.entrega.estado === 'por_llegar' && v.fecha <= corte);
  if (llegar.length) avisos.push(`${llegar.length} encargo(s) sin llegar (pasan al mes siguiente)`);
  const fijos = (db.config.gastosFijos || []).filter(g => !db.movs.some(m => m.gastoFijoId === g.id && movVigente(m) && mesDe(m.fecha) === mes));
  if (fijos.length) avisos.push(`Gastos fijos sin registrar en ${nombreMes(mes)}: ${fijos.map(g => g.nombre).join(', ')}`);
  const dia = +ahora.slice(8, 10), auto = +(db.config.cierre && db.config.cierre.diaAuto) || 5;
  return { mes, avisos, automatico: dia >= auto || mesSiguiente(mes) < mesDe(ahora), diaAuto: auto };
}

/* ─────────────── 9. RESULTADOS Y CIERRE ─────────────── */
function resumenMes(db, mes) {
  const ventas = db.ventas.filter(v => mesDe(v.fecha) === mes && v.estado !== 'anulada');
  let ingresos = 0, costo = 0, descuentos = 0, devol = 0, devCosto = 0, interes = 0;
  for (const v of ventas) {
    ingresos += v.subtotal; costo += v.costo; descuentos += v.descuento; interes += v.interes;
    for (const d of v.devoluciones || []) { devol += d.montoBase; devCosto += d.costo; }
  }
  // devoluciones de ventas de meses ya cerrados que caen en este mes
  for (const v of db.ventas.filter(v => mesDe(v.fecha) < mes && v.estado !== 'anulada'))
    for (const d of (v.devoluciones || []).filter(d => mesDe(d.fecha) === mes)) { devol += d.montoBase; devCosto += d.costo; }
  const isvIncl = sumaL(ventas, v => v.isvIncluido || 0), isvTotal = sumaL(ventas, v => v.isv || 0);
  const ventasNetas = sumaL([ingresos, -descuentos, -devol, -isvIncl]);
  const costoVendido = r2(costo - devCosto);
  const movsMes = db.movs.filter(m => movCuenta(m) && mesDe(m.fecha) === mes);
  const gastosPorCat = {};
  let gastos = 0;
  for (const m of movsMes.filter(m => m.tipo === 'gasto' || m.tipo === 'envio')) {
    const c = m.categoria || 'Otros';
    gastosPorCat[c] = r2((gastosPorCat[c] || 0) - m.monto);
    gastos -= m.monto;
  }
  const financieros = r2(movsMes.filter(m => m.interes).reduce((s, m) => s + m.interes, 0));
  const otrosIngresos = r2(movsMes.filter(m => m.tipo === 'retenido' || m.tipo === 'ingreso').reduce((s, m) => s + m.monto, 0));
  const comisiones = r2(ventas.filter(v => v.comision).reduce((s, v) => s + v.comision.monto, 0) + db.comisionAjustes.filter(x => mesDe(x.fecha) === mes).reduce((s, x) => s + x.monto, 0));
  const utilBruta = r2(ventasNetas - costoVendido);
  const utilNeta = r2(utilBruta + interes + otrosIngresos - r2(gastos) - financieros - comisiones);
  const contado = ventas.filter(v => !v.plazo).length;
  return { mes, numVentas: ventas.length, contado, credito: ventas.length - contado, ingresos: r2(ingresos), descuentos: r2(descuentos), devoluciones: r2(devol),
    ventasNetas, costoVendido, utilBruta, margenPct: ventasNetas > 0 ? r2(utilBruta / ventasNetas * 100) : 0, interes: r2(interes),
    gastos: r2(gastos), gastosPorCat, financieros, otrosIngresos, comisiones, utilNeta, isv: isvTotal };
}

function sugerirDistribucion(db, utilNeta) {
  const f = db.config.fondos;
  const u = Math.max(0, r2(utilNeta));
  // Cada fondo recibe su % de la utilidad, sin pasar su techo; lo que no cabe pasa a dividendos.
  const reserva = r2(Math.min(u * (+f.reservaPct || 0) / 100, Math.max(0, (+f.reservaMeta || 0) - saldoFondo(db, 'reserva'))));
  const crecimiento = r2(Math.min(u * (+f.crecPct || 0) / 100, Math.max(0, (+f.crecTecho || 0) - saldoFondo(db, 'crecimiento'))));
  const dividendos = sumaL([u, -reserva, -crecimiento]);
  // Reparto exacto en centavos: si los % suman 100, el último socio recibe el residuo del redondeo.
  const suma100 = db.socios.reduce((t, x) => t + (+x.pct || 0), 0) === 100;
  let repartido = 0;
  const porSocio = db.socios.map((s, i) => {
    const monto = suma100 && i === db.socios.length - 1 ? sumaL([dividendos, -repartido]) : r2(dividendos * s.pct / 100);
    repartido = sumaL([repartido, monto]);
    return { socioId: s.id, nombre: s.nombre, pct: s.pct, monto };
  });
  return { utilidad: u, reserva, crecimiento, dividendos, porSocio };
}

function mesesSinCerrar(db, ahora) {
  const ultimo = db.cierres.length ? db.cierres.map(c => c.mes).sort().pop() : null;
  let m = ultimo ? mesSiguiente(ultimo) : mesDe(db._inicio || db._creado || ahora);
  const lista = [];
  while (m < mesDe(ahora)) { lista.push(m); m = mesSiguiente(m); }
  return lista;
}

accion('mes.cerrar', 'admin', 'Cierre de mes', (db, a, ctx) => {
  const mes = a.mes;
  exigir(/^\d{4}-\d{2}$/.test(mes), 'Elija el mes que quiere cerrar.');
  exigir(mes < mesDe(ctx.fecha) || a.forzarActual, 'Solo se cierran meses terminados.');
  exigir(!db.cierres.some(c => c.mes === mes), 'Ese mes ya está cerrado.');
  const pend = mesesSinCerrar(db, ctx.fecha);
  exigir(!pend.length || pend[0] === mes || a.forzarActual, `Primero cierra ${nombreMes(pend[0])}.`);
  // Cuadre de caja chica: lo contado contra lo que dice el sistema; la diferencia queda registrada en el último día del mes.
  let arqueo = null;

/* ─────────────── 10. REPORTES ─────────────── */
function cxcLista(db, ahora) {
  return db.ventas.filter(v => v.estado !== 'anulada' && v.saldo > 0).map(v => {
    const dias = v.vence ? diasEntre(v.vence, ahora) : 0;
    const tramo = dias <= 0 ? 'Al día' : dias <= 15 ? '1–15 días vencido' : dias <= 30 ? '16–30 días vencido' : 'Más de 30 días vencido';
    return { v, dias, tramo };
  }).sort((a, b) => b.dias - a.dias);
}
function dineroDormido(db, ahora) {
  return db.repuestos.filter(r => r.stock > 0).map(r => {
    const desde = r.ultimaVenta || r.creado || db._inicio || ahora;
    return { r, dias: diasEntre(desde, ahora), costoParado: r2(r.stock * r.costo), vendioAlgunaVez: !!r.ultimaVenta };
  }).sort((a, b) => b.costoParado - a.costoParado);
}
function compraSugerida(db, ahora) {
  const meses = [mesDe(ahora), mesAnterior(mesDe(ahora)), mesAnterior(mesAnterior(mesDe(ahora)))];
  const pedidos = {};
  for (const f of db.faltantes.filter(f => f.estado === 'abierto' && f.repuestoId)) pedidos[f.repuestoId] = (pedidos[f.repuestoId] || 0) + f.cant;
  return db.repuestos.map(r => {
    const vendidas = meses.reduce((s, m) => s + ((r.vendidasMes || {})[m] || 0), 0);
    const pedidosN = pedidos[r.id] || 0;
    const objetivo = Math.max(r.min || 0, Math.ceil(vendidas / 3) + pedidosN);
    return { r, vendidas, pedidos: pedidosN, sugerido: Math.max(0, objetivo - (r.stock || 0)) };
  }).filter(x => x.sugerido > 0).sort((a, b) => (b.pedidos + b.vendidas) - (a.pedidos + a.vendidas));
}
/* Avance de una tanda (compra en cuotas). Para no inflar el avance se supone que primero se vende

function avanceTanda(db, c, ahora) {
  const idx = db.compras.findIndex(x => x.id === c.id);
  const items = c.items.map(it => {
    const r = db.repuestos.find(x => x.id === it.repuestoId);
    const despues = db.compras.filter((x, i) => i > idx && !x.anulada).reduce((s, x) => s + x.items.filter(y => y.repuestoId === it.repuestoId).reduce((t, y) => t + recibidoDe(y), 0), 0);
    const quedan = r ? Math.max(0, Math.min(recibidoDe(it), (r.stock || 0) - despues)) : 0;
    const vendidas = recibidoDe(it) - quedan;
    return { it, r, vendidas, quedan, recuperado: r2(vendidas * it.costoUnit) };
  });
  const unidades = c.items.reduce((s, it) => s + recibidoDe(it), 0), vendidas = items.reduce((s, x) => s + x.vendidas, 0);
  const cuotas = db.cxp.filter(x => x.ref === c.id && x.tipo === 'cuota').sort((a, b) => a.vence.localeCompare(b.vence));
  const anticipo = c.anticipoPagado !== undefined ? c.anticipoPagado : sumaL(db.movs.filter(m => m.ref === c.id && m.tipo === 'compra' && movVigente(m)), m => -m.monto);
  const pagado = sumaL([anticipo, c.cuotasArchivadas || 0, sumaL(cuotas, x => x.pagado)]);
  const pendiente = sumaL(cuotas, x => x.monto - x.pagado);
  const recuperado = sumaL(items, x => x.recuperado);
  const proxima = cuotas.find(x => x.pagado < x.monto) || null;
  const disponible = sumaL([recuperado, -pagado]);   // costo ya recuperado con ventas que todavía no se usó para pagar
  const faltaProxima = proxima ? Math.max(0, sumaL([proxima.monto - proxima.pagado, -Math.max(0, disponible)])) : 0;
  const dias = ahora ? diasEntre(c.fecha, ahora) : 0;
  return {
    c, items, unidades, vendidas, pct: unidades ? Math.round(vendidas / unidades * 100) : 0, recuperado, pagado, pendiente, disponible,
    totalPlan: sumaL([pagado, pendiente]), proxima, faltaProxima, cubierta: !!proxima && faltaProxima === 0,
    lentas: items.filter(x => x.quedan > 0 && x.vendidas / Math.max(1, recibidoDe(x.it)) < 0.3 && dias >= 30),
    enCamino: c.estado === 'en_camino', completa: c.estado !== 'en_camino' && vendidas >= unidades && pendiente <= 0

}
function tandas(db, ahora) {
  return db.compras.filter(c => c.pago === 'cuotas' && !c.anulada).map(c => avanceTanda(db, c, ahora));
}
/* Por pedir: repuestos bajo su mínimo, o que pidieron clientes cuando no había stock.
   Cantidad sugerida: llegar al mínimo o a lo que se vende en un mes (lo mayor), más lo que pidieron los clientes. */
function enCaminoPorRepuesto(db) {
  const m = {};
  for (const c of db.compras.filter(c => !c.anulada && c.estado === 'en_camino')) for (const it of c.items) m[it.repuestoId] = (m[it.repuestoId] || 0) + (it.cant - recibidoDe(it));

}
function porPedir(db, ahora) {
  const meses = [mesDe(ahora), mesAnterior(mesDe(ahora)), mesAnterior(mesAnterior(mesDe(ahora)))];
  const pedidos = {};
  for (const f of db.faltantes.filter(f => f.estado === 'abierto' && f.repuestoId)) pedidos[f.repuestoId] = (pedidos[f.repuestoId] || 0) + f.cant;
  const viene = enCaminoPorRepuesto(db);
  // Encargos de clientes que todavía esperan la pieza (unidades y proveedor elegido en el encargo más viejo)

  return db.repuestos.filter(r => r.estadoCatalogo !== 'descontinuado' || enc[r.id]).map(r => {
    const vendidas = meses.reduce((s, m) => s + ((r.vendidasMes || {})[m] || 0), 0);
    const tiene = (r.stock || 0) + (viene[r.id] || 0);
    const objetivo = Math.max(r.min || 0, Math.ceil(vendidas / 3)) + (pedidos[r.id] || 0) + (enc[r.id] || 0);

  }).filter(x => x.cant > 0).sort((a, b) => (b.encargos - a.encargos) || (b.pedidos - a.pedidos) || ((a.r.stock || 0) - (b.r.stock || 0)));
}
function faltantesTop(db) {
  const g = {};

    const k = f.repuestoId || norm(f.descripcion);
    g[k] = g[k] || { descripcion: f.descripcion, repuestoId: f.repuestoId, vehiculo: f.vehiculo, veces: 0, cant: 0, items: [] };
    g[k].veces++; g[k].cant += f.cant; g[k].items.push(f);

function balance(db, ahora) {
  const s = saldos(db);
  const inventario = r2(db.repuestos.reduce((t, r) => t + (r.stock || 0) * (r.costo || 0), 0));
  const cxc = r2(db.ventas.filter(v => v.estado !== 'anulada').reduce((t, v) => t + v.saldo, 0));
  const activos = r2(db.activos.reduce((t, a) => t + a.valor, 0));
  const cxp = r2(db.cxp.reduce((t, c) => t + (c.monto - c.pagado), 0));
  const comPend = r2(db.usuarios.reduce((t, u) => t + comisionesPendientes(db, u.id).total, 0));
  // Lote 14: lo que antes se perdía del balance
  const enCamino = sumaL(db.compras.filter(c => !c.anulada && c.estado === 'en_camino'), c => sumaL(c.items, it => (it.cant - recibidoDe(it)) * it.costoUnit));   // ya comprada, aún no entra al stock
  const garantias = sumaL((db.garantias || []).filter(g => g.estado === 'enviada'), g => g.cant * g.costoUnit);
  const reclamos = sumaL(db.compras.filter(c => !c.anulada && c.reclamo && !c.reclamo.resuelto), c => c.reclamo.monto || 0);
  const porCobrarProv = sumaL([garantias, reclamos]);
  const adelantos = sumaL((db.pedidos || []).filter(p => p.estado === 'abierto'), p => p.adelanto || 0);   // dinero del cliente hasta que se venda
  const totalActivos = r2(s.total + s.porConfirmar + inventario + cxc + activos + enCamino + porCobrarProv);
  const totalPasivos = r2(cxp + comPend + adelantos);

    fondos: { reserva: saldoFondo(db, 'reserva'), crecimiento: saldoFondo(db, 'crecimiento') } };
}

/* Pendientes calculados para Inicio (no se guardan: siempre al día). */
function pendientes(db, user, ahora) {
  const out = [];
  const add = (nivel, texto, ir) => out.push({ nivel, texto, ir });
  const admin = esAdmin(user) || soloLectura(user);
  if (tiene(user, 'ventas') || admin) {
    const cxc = cxcLista(db, ahora);
    const conPlazo = cxc.filter(x => x.v.vence);   // los encargos se cobran al llegar: no "vencen"
    const venc = conPlazo.filter(x => x.dias > 0), pronto = conPlazo.filter(x => x.dias <= 0 && x.dias >= -3);
    if (venc.length) add('rojo', `${venc.length} cuenta(s) por cobrar vencida(s)${admin ? ': ' + L(venc.reduce((s, x) => s + x.v.saldo, 0)) : ''}`, 'cobros');
    if (pronto.length) add('naranja', `${pronto.length} cuenta(s) vencen en 3 días o menos`, 'cobros');
    const peds = (db.pedidos || []).filter(p => p.estado === 'abierto' && (admin || p.vendedorId === user.id)), pedVenc = peds.filter(p => p.vence < ahora);
    if (pedVenc.length) add('rojo', `${pedVenc.length} pedido(s) vencido(s): liberar las piezas o extender`, 'ventas/pedidos');
    if (peds.length - pedVenc.length > 0) add('azul', `${peds.length - pedVenc.length} pedido(s) esperando pago`, 'ventas/pedidos');
    const seg = db.cotizaciones.filter(c => ['pendiente', 'contactado'].includes(c.estado) && c.proximoContacto && c.proximoContacto <= ahora && (admin || c.vendedorId === user.id));
    if (seg.length) add('naranja', `${seg.length} cotización(es) para dar seguimiento hoy`, 'ventas/cotizaciones');
    const disp = db.faltantes.filter(f => f.estado === 'conseguido');
    if (disp.length) add('verde', `${disp.length} pieza(s) que pidieron ya llegaron: avisar al cliente`, 'ventas/faltantes');
  }
  if (admin) {
    const tr = db.movs.filter(m => m.pendiente && movVigente(m));
    if (tr.length) add('naranja', `${tr.length} transferencia(s) por confirmar: ${L(tr.reduce((s, m) => s + m.monto, 0))}`, 'cobros/transferencias');
    const cxp = db.cxp.filter(c => c.pagado < c.monto && c.vence <= sumarDias(ahora, 3));
    if (cxp.length) add(cxp.some(c => c.vence < ahora) ? 'rojo' : 'naranja', `${cxp.length} pago(s) a proveedor vencidos o por vencer`, 'dinero/porpagar');
    const admins = new Set(db.usuarios.filter(u => esAdmin(u)).map(u => u.nombre)), ajustes = [];

    const garViejas = (db.garantias || []).filter(g => g.estado === 'enviada' && diasEntre(g.fecha, ahora) > 15);
    if (garViejas.length) add('naranja', `${garViejas.length} pieza(s) en garantía hace más de 15 días sin respuesta del proveedor`, 'inventario/garantias');
    const fondosTot = sumaL([saldoFondo(db, 'reserva'), saldoFondo(db, 'crecimiento')]), real = saldos(db).total;
    if (fondosTot > real + 0.01) add('rojo', `Tus fondos apartados (${L(fondosTot)}) superan tu dinero real (${L(real)})`, 'resultados/fondos');
    const pp = porPedir(db, ahora);
    if (pp.length) add('naranja', `${pp.length} repuesto(s) por pedir (bajo el mínimo o pedidos por clientes)`, 'compras/porpedir');
    for (const t of tandas(db, ahora).filter(t => t.proxima && !t.cubierta && t.proxima.vence <= sumarDias(ahora, 7)))
      add(t.proxima.vence < ahora ? 'rojo' : 'naranja', `Tanda "${t.c.nombre || t.c.numero}": la cuota del ${t.proxima.vence.split('-').reverse().join('/')} no está cubierta con lo vendido (faltan ${L(t.faltaProxima)})`, 'compras/tandas');

    if (admin && sinPedir.size) add('rojo', `${sinPedir.size} encargo(s) de clientes sin pedir al proveedor`, 'compras/porpedir');
    if (enBod.size) add('verde', `${enBod.size} encargo(s) con piezas ya en bodega: tomarlas para el cliente`, 'entregas');

    if (retirar.length) add('verde', `${retirar.length} venta(s) lista(s) para que el cliente las retire`, 'entregas');
    if (pend.length > retirar.length) add('naranja', `${pend.length - retirar.length} envío(s) por despachar`, 'entregas');

}

/* Auditoría interna: revisa que todo cuadre. */
function auditar(db) {
  const errores = [];

    if (r.precio < r.costo) e(`Precio menor al costo: ${r.codigo}`);
    if (Math.abs(margenDePrecio(r.costo, r.precio) - (r.margen || 0)) > 0.11) e(`Margen desactualizado: ${r.codigo}`);
  }
  const cods = {};
  for (const r of db.repuestos.concat(db.llantas)) { const k = norm(r.codigo); if (cods[k]) e(`Código repetido: ${r.codigo}`); cods[k] = 1; }

/* Pago al proveedor: ¿el cliente ya pagó la venta ligada? (se le paga al proveedor cuando el cliente paga) */

/* ── Backend Supabase con control de versión ── */
const conTiempo = (p, ms) => Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error('La nube no respondió a tiempo')), ms))]);
let supa = null;
function backendSupabase(fila) {
  const tabla = () => supa.from('rrd_data');
  const falla = (e) => { throw new RRD.RRDError('Problema con la nube: ' + (e.message || e)); };
  return {
    async leer() {
      const { data, error } = await conTiempo(tabla().select('data,updated_at').eq('id', fila).maybeSingle(), 12000);
      if (error) falla(error);
      if (!data) return null;
      const blob = typeof data.data === 'string' ? JSON.parse(data.data) : data.data;   // la columna guarda el JSON como texto
      return { data: blob, version: data.updated_at };
    },
    async version() {
      const { data, error } = await conTiempo(tabla().select('updated_at').eq('id', fila).maybeSingle(), 8000);
      if (error) falla(error);
      return data ? data.updated_at : null;
    },
    async escribir(db, previa) {
      const { data, error } = await conTiempo(tabla().update({ data: db, updated_at: new Date().toISOString() })
        .eq('id', fila).eq('updated_at', previa).select('updated_at'), 15000);
      if (error) falla(error);
      return data && data.length ? data[0].updated_at : null;   // 0 filas = alguien guardó antes → reintento
    },
    async crear(db) {
      const { error } = await conTiempo(tabla().insert({ id: fila, data: db, updated_at: new Date().toISOString() }), 15000);
      if (error) { if (String(error.code) === '23505') return null; falla(error); }
      const r = await this.leer();
      return r && r.version;
    },
    async listarRespaldos() {
      const { data, error } = await conTiempo(tabla().select('id,updated_at').like('id', fila + '-bk-%').order('updated_at', { ascending: false }), 12000);
      if (error) falla(error);
      return data || [];
    },
    async leerRespaldo(id) {
      exigirRespaldo(id);
      const { data, error } = await conTiempo(tabla().select('data').eq('id', id).maybeSingle(), 20000);
      if (error) falla(error);
      return data ? (typeof data.data === 'string' ? JSON.parse(data.data) : data.data) : null;
    },
    async respaldo(etiqueta, db) {
      const { error } = await conTiempo(tabla().upsert({ id: fila + '-bk-' + etiqueta, data: db, updated_at: new Date().toISOString() }, { onConflict: 'id' }), 20000);
      if (error) falla(error);
    }
  };
}

/* ── Ventanas: modal, panel lateral (PC) / hoja inferior (celular) ── */
const M = {
  pila: [],
  abrir(titulo, cuerpo, botones, opciones) {
    const id = 'm' + Date.now() + Math.random().toString(36).slice(2, 5);
    const w = document.createElement('div');
    w.className = 'velo' + (opciones && opciones.panel ? ' panel' : ''); w.id = id;
    w.innerHTML = `<div class="modal ${opciones && opciones.ancho ? 'ancho' : ''}" role="dialog" aria-modal="true">
      <div class="cab"><h3>${titulo}</h3>${opciones && opciones.fijo ? '' : '<button class="cerrar" data-a="modal.cerrar" aria-label="Cerrar">×</button>'}</div>
      <div class="cuerpo">${cuerpo}</div>${botones ? `<div class="pie">${botones}</div>` : ''}</div>`;
    if (opciones && opciones.fijo) M.bloqueado = true;
    w.addEventListener('mousedown', ev => { if (opciones && opciones.fijo) return; if (ev.target === w) { if (M._res) { M._res(false); M._res = null; } M.cerrar(); } });
    $('modales').appendChild(w);
    soloVer(w);
    M.pila.push(id);
    const primero = w.querySelector('input:not([type=hidden]):not([type=checkbox]),select,textarea');
    if (primero && !(opciones && (opciones.sinFoco || opciones.panel))) setTimeout(() => primero.focus(), 30);
    return id;
  },
  cerrar() { const id = M.pila.pop(); if (id && $(id)) $(id).remove(); },
  cerrarTodo(forzar) { if (M.bloqueado && !forzar) return; M.bloqueado = false; while (M.pila.length) M.cerrar(); },
  confirmar(texto, opciones) {
    return new Promise(res => {
      M._res = res;
      M.abrir(opciones && opciones.titulo || 'Confirmar', `<p>${texto}</p>`,
        `<button class="btn" data-a="modal.no">Cancelar</button><button class="btn ${opciones && opciones.peligro ? 'peligro' : 'pri'}" data-a="modal.si">${opciones && opciones.si || 'Sí, continuar'}</button>`, { sinFoco: true });
    });
  }
};

/* ── Ejecutar una acción del cerebro ── */
async function hacer(nombre, args, msgOk) {
  try {
    const r = await st.ejecutar(nombre, args);
    ls.set(CACHE, { data: st.db, version: st.version });
    if (msgOk !== false) toast(typeof msgOk === 'string' ? msgOk : (typeof r === 'string' ? r : 'Guardado ✓'), 'ok');
    pintar();
    return r === undefined ? true : r;
  } catch (e) {
    if (!(e instanceof RRD.RRDError)) { registrarError('Acción ' + nombre, e); if (/fetch|network|Failed|tiempo/i.test(String(e.message))) { st.online = false; pintarBarra(); } }
    else if (/nube/i.test(e.message)) registrarError('Acción ' + nombre, e);
    toast(e instanceof RRD.RRDError ? e.message : 'No se pudo guardar: ' + e.message, 'error');
    console.error(e);
    return null;
  }
}

function partesCarrito(c, neto) {
  if (c.forma === 'Contra' || !(neto > 0)) return [];
  // Transferencia: el admin elige el banco al confirmar. Tarjeta: entra a la cuenta del POS (Ajustes → Ventas).
  const cta = forma => forma === 'Efectivo' ? 'efectivo' : forma === 'Tarjeta' ? (c.posId || '') : '';
  const ref = forma => forma === 'Tarjeta' ? String(c.voucher || '').trim() : '';
  if (['Efectivo', 'Transferencia', 'Tarjeta'].includes(c.forma)) return [{ forma: c.forma, cuentaId: cta(c.forma), monto: neto, referencia: ref(c.forma) }];
  if (c.forma === 'Mixto') {
    const m1 = r2(+c.monto1 || 0);
    if (!(m1 > 0 && m1 < neto)) throw new RRD.RRDError('En pago mixto, el primer monto debe ser mayor a 0 y menor al total.');
    return [{ forma: c.forma1, cuentaId: cta(c.forma1), monto: m1, referencia: ref(c.forma1) }, { forma: c.forma2, cuentaId: cta(c.forma2), monto: RRD.sumaL([neto, -m1]), referencia: ref(c.forma2) }];
  }
  return +c.abono > 0 ? [{ forma: c.forma1, cuentaId: cta(c.forma1), monto: r2(c.abono), referencia: ref(c.forma1) }] : [];
}

H['dev.calc'] = () => {
  const v = D().ventas.find(x => x.id === U.dev.id), factor = v.subtotal > 0 ? (v.subtotal - v.descuento) / v.subtotal : 1;
  let base = 0, piezas = 0; U.dev.cants.forEach((n, i) => { base += v.items[i].precioUnit * n * factor; if ($('dv-b-' + i).checked) piezas += n; });
  const interes = v.subtotal > 0 ? r2(v.interes * base / (v.subtotal - v.descuento || 1)) : 0, total = r2(base + interes), deSaldo = r2(Math.min(v.saldo, total)), dinero = r2(total - deSaldo);
  $('dv-res').innerHTML = total > 0 ? `Valor devuelto <b>${L(total)}</b>${deSaldo ? ` · se rebajan <b>${L(deSaldo)}</b> de lo que debe` : ''}${dinero ? ` · <b class="txt-rojo">se le reintegran ${L(dinero)}</b>` : ''} · ${piezas} pieza(s) vuelven al stock` : 'Elige qué devuelve.';

H['dev.guardar'] = async d => {

function planCuotas(c, total) {
  if (c.cuotasManual && c.cuotas.length) return c.cuotas;
  const plan = +c.totalPlan > 0 ? +c.totalPlan : total, resto = RRD.sumaL([plan, -(+c.anticipo || 0)]), n = Math.max(1, Math.floor(+c.nCuotas || 1)), dias = Math.max(1, +c.diasCuota || 30);
  const cuota = r2(resto / n);
  return (c.cuotas = Array.from({ length: n }, (_, i) => ({ fecha: sumarDias(c.primera || sumarDias(c.fecha, dias), dias * i), monto: i === n - 1 ? RRD.sumaL([resto, -cuota * (n - 1)]) : cuota })));
}

const leerImagen = (id, max) => new Promise(res => {
  const f = $(id) && $(id).files[0];
  if (!f) return res(null);
  const rd = new FileReader();
  rd.onload = () => { const img = new Image(); img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/png')); }; img.src = rd.result; };
  rd.readAsDataURL(f);
});

  /* ── Paquete de cierre: reporte PDF + resumen SAR + Excel del mes + respaldo JSON ── */
  async function pdfCierre(dc) {
    const r = dc.res, prev = dc.previo, nm = nombreMes(dc.mes);
    const p = await nuevoPDF('CIERRE DE MES', nm);
    const cmp = (a, b) => { if (!prev || b == null) return '—'; if (!b) return a ? 'nuevo' : '—'; const pct = Math.round((a - b) / Math.abs(b) * 100); return (pct >= 0 ? '+' : '-') + Math.abs(pct) + '%'; };
    seccion(p, 'Resumen del mes' + (prev ? ' (contra el mes anterior)' : ''));
    tabla(p, [{ t: 'Indicador', w: 80 }, { t: nm, w: 40, der: 1 }, { t: 'Mes anterior', w: 40, der: 1 }, { t: 'Cambio', w: 25, der: 1 }], [
      ['Ventas netas', L(r.ventasNetas), prev ? L(prev.ventasNetas) : '—', cmp(r.ventasNetas, prev && prev.ventasNetas)],
      ['Número de ventas', r.numVentas, prev ? prev.numVentas : '—', cmp(r.numVentas, prev && prev.numVentas)],
      ['Utilidad bruta (' + r.margenPct + '%)', L(r.utilBruta), prev ? L(prev.utilBruta) : '—', cmp(r.utilBruta, prev && prev.utilBruta)],
      ['Gastos', L(r.gastos), prev ? L(prev.gastos) : '—', cmp(r.gastos, prev && prev.gastos)],
      filaFuerte(['Utilidad neta', L(r.utilNeta), prev ? L(prev.utilNeta) : '—', cmp(r.utilNeta, prev && prev.utilNeta)])]);
    seccion(p, 'Estado de resultados');
    tabla(p, [{ t: 'Concepto', w: 130 }, { t: 'Monto', w: 45, der: 1 }], [['Ventas brutas (' + r.numVentas + ')', L(r.ingresos)], ['- Descuentos', L(-r.descuentos)], ['- Devoluciones', L(-r.devoluciones)],
      filaFuerte(['Ventas netas', L(r.ventasNetas)]), ['- Costo de lo vendido', L(-r.costoVendido)], filaFuerte(['Utilidad bruta (' + r.margenPct + '%)', L(r.utilBruta)]), ['+ Intereses de crédito', L(r.interes)],
      ['+ Pagos retenidos por cancelación', L(r.otrosIngresos || 0)], ['- Gastos', L(-r.gastos)], ['- Gastos financieros (tandas)', L(-r.financieros)], ['- Comisiones', L(-r.comisiones)], filaFuerte(['Utilidad neta', L(r.utilNeta)])]);
    if (Object.keys(r.gastosPorCat || {}).length) { seccion(p, 'Gastos por categoría' + (dc.gastosPorTipo ? ` (fijos ${L(dc.gastosPorTipo.Fijo)} · operativos ${L(dc.gastosPorTipo.Operativo)})` : '')); tabla(p, [{ t: 'Categoría', w: 130 }, { t: 'Monto', w: 45, der: 1 }], Object.entries(r.gastosPorCat).map(([k, v]) => [k, L(v)])); }
    if (dc.saldosCorte) { seccion(p, 'Dinero al corte'); tabla(p, [{ t: 'Cuenta', w: 130 }, { t: 'Saldo', w: 45, der: 1 }], Object.entries(dc.saldosCorte).map(([id, s]) => [nombreCuenta(id), L(s)]).concat([filaFuerte(['Total', L(RRD.sumaL(Object.values(dc.saldosCorte)))])]));
      if (dc.cajaChica) texto(p, `Caja chica: gastado ${L(dc.cajaChica.gastado)} en ${dc.cajaChica.numGastos} gasto(s) · saldo al cierre ${L(dc.cajaChica.saldoAlCierre)}${dc.cajaChica.repuesto ? ' · repuesto ' + L(dc.cajaChica.repuesto) : ''}`, 8.8); }
    if (dc.cxc) { seccion(p, 'Cuentas por cobrar al corte'); tabla(p, [{ t: 'Factura', w: 30 }, { t: 'Cliente', w: 60 }, { t: 'Antigüedad', w: 45 }, { t: 'Saldo', w: 30, der: 1 }], dc.cxc.map(x => [x.numero, x.cliente, x.tramo, L(x.saldo)]).concat([filaFuerte(['', 'Total', '', L(RRD.sumaL(dc.cxc, x => x.saldo))])])); }
    if (dc.cxp) { seccion(p, 'Cuentas por pagar al corte'); tabla(p, [{ t: 'A quién', w: 40 }, { t: 'Detalle', w: 85 }, { t: 'Vence', w: 22 }, { t: 'Pendiente', w: 28, der: 1 }], dc.cxp.map(x => [x.proveedor, x.detalle, fFecha(x.vence), L(x.pendiente)]).concat([filaFuerte(['', 'Total', '', L(RRD.sumaL(dc.cxp, x => x.pendiente))])])); }
    if (dc.inventario) { seccion(p, `Inventario al corte: ${dc.inventario.unidades} unidades · costo ${L(dc.inventario.costo)} · a precio ${L(dc.inventario.precio)}`);
      tabla(p, [{ t: 'Código', w: 30 }, { t: 'Más dinero parado', w: 90 }, { t: 'Stock', w: 15, der: 1 }, { t: 'Días', w: 15, der: 1 }, { t: 'Costo', w: 28, der: 1 }], dc.inventario.dormido.map(x => [x.codigo, x.descripcion, x.stock, x.dias, L(x.costo)])); }
    if (dc.ventas) { seccion(p, 'Ventas del mes'); tabla(p, [{ t: 'Número', w: 30 }, { t: 'Fecha', w: 20 }, { t: 'Cliente', w: 50 }, { t: 'Vendedor', w: 28 }, { t: 'Estado', w: 22 }, { t: 'Total', w: 26, der: 1 }], dc.ventas.map(v => [v.numero, fFecha(v.fecha), v.cliente, v.vendedor, v.estado, L(v.total)]), { chica: true }); }
    if (dc.compras && dc.compras.length) { seccion(p, `Compras del mes (${L(dc.comprasTotal)})`); tabla(p, [{ t: 'Número', w: 30 }, { t: 'Fecha', w: 22 }, { t: 'Proveedor', w: 70 }, { t: 'Pago', w: 25 }, { t: 'Total', w: 28, der: 1 }], dc.compras.map(c => [c.numero, fFecha(c.fecha), c.proveedor, c.pago, L(c.total)])); }
    if (dc.comisiones) texto(p, `Comisiones: generadas ${L(dc.comisiones.generadas)} · pagadas ${L(dc.comisiones.pagadas)}`, 9.5, true);
    if (dc.cotizaciones) texto(p, `Cotizaciones del mes: ${dc.cotizaciones.total} por ${L(dc.cotizaciones.valor)} · ganadas ${dc.cotizaciones.ganadas} (${L(dc.cotizaciones.valorGanado)}) · perdidas ${dc.cotizaciones.perdidas} · abiertas ${dc.cotizaciones.abiertas}`, 9.5);
    const dist = dc.distribucion;
    if (dist) { seccion(p, 'Distribución de la utilidad'); tabla(p, [{ t: 'Destino', w: 130 }, { t: 'Monto', w: 45, der: 1 }], [['Fondo de emergencia', L(dist.reserva)], ['Fondo de reinversión', L(dist.crecimiento)], filaFuerte(['Dividendos', L(dist.dividendos)])].concat((dist.porSocio || []).map(s => ['   ' + s.nombre, L(s.monto)])));
      if (p.y > p.doc.internal.pageSize.getHeight() - 45) nuevaPagina(p);
      p.y += 18; const socios = (dist.porSocio || []).length ? dist.porSocio : [{ nombre: 'Socio' }], ancho = (p.W - 20) / socios.length;
      socios.forEach((s, i) => { const x = 10 + ancho * i + 8; p.doc.line(x, p.y, x + ancho - 16, p.y); p.doc.setFontSize(9); p.doc.text(s.nombre, x + (ancho - 16) / 2, p.y + 5, { align: 'center' }); }); p.y += 10; }
    return finalizar(p, 'Cierre ' + nm);
  }
  async function pdfSAR(dc) {
    const s = dc.sar, n = D() ? D().config : null;
    const p = await nuevoPDF('RESUMEN SAR', nombreMes(dc.mes));
    texto(p, `Contribuyente: ${n ? n.negocio.nombre : ''}${n && n.negocio.rtn ? ' · RTN ' + n.negocio.rtn : ''}`, 10, true);
    if (n && n.facturacion.cai) texto(p, `CAI ${n.facturacion.cai} · rango ${n.facturacion.rangoDesde} al ${n.facturacion.rangoHasta} · fecha límite ${fFecha(n.facturacion.fechaLimite)}`, 8.8);
    tabla(p, [{ t: 'Concepto', w: 130 }, { t: 'Monto', w: 45, der: 1 }], [['Número de ventas', s.numVentas], ['Ventas anuladas', s.anuladas], ['Ventas brutas', L(s.ventasBrutas)], ['Descuentos', L(s.descuentos)], ['Devoluciones', L(s.devoluciones)],
      filaFuerte(['Ventas netas', L(s.ventasNetas)]), ['Ventas de contado', L(s.contado)], ['Ventas a crédito', L(s.credito)], ['ISV (si está activo)', L(dc.res.isv || 0)], ['Compras del mes', L(s.compras)], ['Gastos del mes', L(s.gastos)]]);
    texto(p, 'Documento de apoyo para el contador. No sustituye la declaración oficial ante el SAR.', 8, false, [122, 122, 122]);
    return finalizar(p, 'Resumen SAR ' + nombreMes(dc.mes));
  }
  async function zipCierre(dc, db) {
    const zip = new JSZip(), mes = dc.mes;
    zip.file(`Cierre-${mes}.pdf`, (await pdfCierre(dc)).output('blob'));
    if (dc.sar) zip.file(`Resumen-SAR-${mes}.pdf`, (await pdfSAR(dc)).output('blob'));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet((dc.ventas || []).map(v => ({ Factura: v.numero, Fecha: v.fecha, Cliente: v.cliente, Vendedor: v.vendedor, Estado: v.estado, Total: v.total, Saldo: v.saldo, Costo: v.costo }))), 'Ventas');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet((dc.compras || []).map(c => ({ Número: c.numero, Fecha: c.fecha, Proveedor: c.proveedor, Pago: c.pago, Total: c.total }))), 'Compras');
    if (db) {
      const movs = db.movs.filter(m => mesDe(m.fecha) === mes && RRD.movVigente(m));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(movs.filter(m => m.tipo === 'gasto' || m.tipo === 'envio').map(m => ({ Fecha: m.fecha, Categoría: m.categoria, Tipo: m.tipoGasto || 'Operativo', Detalle: m.detalle, Cuenta: nombreCuenta(m.cuentaId), Método: m.metodo, Referencia: m.referencia || '', Monto: -m.monto, Usuario: m.usuario }))), 'Gastos');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(movs.map(m => ({ Fecha: m.fecha, Hora: m.hora, Cuenta: nombreCuenta(m.cuentaId), Tipo: RRD.TIPOS_MOV[m.tipo] || m.tipo, Detalle: m.detalle, Método: m.metodo || '', Referencia: m.referencia || '', Monto: m.monto, Pendiente: m.pendiente ? 'Sí' : '', Usuario: m.usuario }))), 'Movimientos');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(db.repuestos.map(r => ({ Código: r.codigo, Descripción: r.descripcion, Stock: r.stock, Costo: r.costo, Precio: r.precio, 'Costo total': r2(r.costo * r.stock) }))), 'Inventario');
      zip.file(`RRDv3-respaldo-antes-de-cerrar-${mes}.json`, JSON.stringify(db));
    }
    zip.file(`Cierre-${mes}.xlsx`, XLSX.write(wb, { type: 'array', bookType: 'xlsx' }));
    descargar(`RRD-cierre-${mes}.zip`, await zip.generateAsync({ type: 'blob' }));
  }

  /* ── Excel ── */
  H['xls.inventario'] = () => {
    const cos = COSTOS(), cfg = D().config;
    const filas = D().repuestos.map(r => { const pm = RRD.precioMayorista(r, false, cfg); const f = { Código: r.codigo, Descripción: r.descripcion, Categoría: r.categoria, Versión: versionTexto(r.versiones), Lado: r.lado, Vehículos: (r.vehiculos || []).join(', '), Stock: r.stock, Mínimo: r.min, Precio: r.precio, Mayorista: pm.aplica ? pm.precio : '' };
      if (cos) Object.assign(f, { Costo: r.costo, 'Margen %': r.margen, 'Costo total': r2(r.costo * r.stock) }); f.Ubicación = r.ubicacion; f['Última venta'] = r.ultimaVenta || ''; return f; });
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(filas), 'Inventario'); XLSX.writeFile(wb, `Inventario-${hoy()}.xlsx`);
  };

    const hojas = RRD.catalogoHojas(D(), hoy()), anchos = { Productos: [16, 38, 46, 13, 22, 11, 32, 12, 10, 15, 7, 13, 10, 13, 40, 22], 'Catálogos': [30, 60, 10, 11, 40, 10, 20, 13], Negocio: [28, 90] };
    const wb = XLSX.utils.book_new();
    Object.entries(hojas).forEach(([nombre, filas]) => { const ws = XLSX.utils.aoa_to_sheet(filas); if (anchos[nombre]) ws['!cols'] = anchos[nombre].map(w => ({ wch: w })); XLSX.utils.book_append_sheet(wb, ws, nombre); });
    XLSX.writeFile(wb, 'Catalogo-RutaDirecta-' + hoy() + '.xlsx');
  };
  /* Exportar cualquier lista (I2) */
  H['exportar.xls'] = d => { const e = EXPORTS[d.k]; if (!e || !e.filas.length) return toast('No hay datos para exportar', 'error'); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(e.filas), 'Datos'); XLSX.writeFile(wb, `${e.titulo.replace(/\s+/g, '-')}-${hoy()}.xlsx`); };
  H['exportar.pdf'] = async d => {
    const e = EXPORTS[d.k]; if (!e || !e.filas.length) return toast('No hay datos para exportar', 'error');
    const cols = Object.keys(e.filas[0]), p = await nuevoPDF(e.titulo.toUpperCase(), fFecha(hoy()), cols.length > 7 ? 'a4' : 'a4');
    tabla(p, cols.map(c => ({ t: c, w: Math.max(10, Math.min(60, Math.max(c.length, ...e.filas.slice(0, 30).map(f => String(f[c] == null ? '' : f[c]).length)) * 1.6)), der: typeof e.filas[0][c] === 'number' })),
      e.filas.map(f => cols.map(c => typeof f[c] === 'number' && /total|monto|saldo|precio|costo/i.test(c) ? L(f[c]) : f[c])), { chica: true });
    entregarPDF(finalizar(p), `${e.titulo.replace(/\s+/g, '-')}-${hoy()}.pdf`);
  };

  /* Vista previa en Ajustes: datos reales del negocio y cuentas + un cliente de ejemplo */
  const vistaPrevia = txt => llenar(String(txt || ''), Object.assign(varsBase(), { cliente: 'Juan Pérez', numero: 'FAC-0001', fecha: fFecha(hoy()), detalle: '• 2 × Pastillas de freno delanteras (PF-001) — L 900.00\n• 1 × Filtro de aceite (FA-010) — L 250.00',
    total: 'L 1,150.00', saldo: 'L 500.00', monto: 'L 650.00', vence: fFecha(sumarDias(hoy(), 6)), dias: 5, empresa: 'Cargo Expreso', guia: '123456', adelanto: 'L 300.00', pendiente: 'L 850.00' }));
  return { plantillas, NOMBRES_WA, VARIABLES, zipCierre, pdfCierre, vistaPrevia };
})();
